<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Accesso · MCC STQC</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; }

    /* ── Layout ── */
    .split { display: flex; height: 100vh; }

    /* ── Left panel ── */
    .left {
      width: 40%; position: relative; overflow: hidden; flex-shrink: 0;
    }
    .left-bg {
      position: absolute; inset: 0;
      background-image: url('https://images.unsplash.com/photo-1504917595217-d4dc5ebe6122?auto=format&fit=crop&w=900&q=85');
      background-size: cover; background-position: center;
      transform: scale(1.04); transition: transform 8s ease;
    }
    .left-bg.loaded { transform: scale(1); }
    .left-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, rgba(15,23,42,0.45) 0%, rgba(15,23,42,0.75) 60%, rgba(15,23,42,0.95) 100%);
    }
    .left-content {
      position: relative; z-index: 2; height: 100%;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 40px 44px;
    }
    .left-logo { display: flex; align-items: center; gap: 10px; }
    .left-logo-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #3b82f6; box-shadow: 0 0 12px #3b82f6;
    }
    .left-brand-mcc {
      font-size: 44px; font-weight: 900; letter-spacing: -.02em; color: rgba(255,255,255,0.85);
    }
    .left-brand-srl {
      font-size: 20px; font-weight: 700; letter-spacing: .1em; color: rgba(255,255,255,0.38);
    }
    .left-stqc {
      font-size: clamp(80px, 10vw, 118px); font-weight: 900; color: #fff;
      line-height: 1; letter-spacing: -.03em; text-shadow: 0 4px 40px rgba(0,0,0,0.5);
    }
    .left-sub {
      font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.38);
      margin-top: 10px; letter-spacing: .04em;
    }
    .left-badge {
      display: inline-block; margin-top: 20px; padding: 5px 12px; border-radius: 20px;
      background: rgba(59,130,246,0.2); border: 1px solid rgba(59,130,246,0.4);
      color: #93c5fd; font-size: 11px; font-weight: 600;
      letter-spacing: .06em; text-transform: uppercase;
    }

    /* ── Right panel ── */
    .right {
      flex: 1; background: #0f172a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px;
    }
    .login-box {
      width: 100%; max-width: 420px;
    }
    .login-header { margin-bottom: 32px; }
    .login-eyebrow {
      font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.3);
      text-transform: uppercase; letter-spacing: .14em; margin-bottom: 8px;
    }
    .login-title {
      font-size: 26px; font-weight: 800; color: rgba(255,255,255,0.93);
      letter-spacing: -.02em;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex; gap: 0; margin-bottom: 28px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px; padding: 4px;
    }
    .tab-btn {
      flex: 1; padding: 9px 16px; border-radius: 9px;
      border: none; background: transparent;
      color: rgba(255,255,255,0.4); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all .18s;
    }
    .tab-btn.active {
      background: rgba(59,130,246,0.2);
      color: #93c5fd; border: 1px solid rgba(59,130,246,0.25);
    }
    .tab-btn:not(.active):hover { color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.04); }

    /* ── Tab panels ── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Form ── */
    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 11px; font-weight: 700;
      color: rgba(255,255,255,0.35); text-transform: uppercase;
      letter-spacing: .1em; margin-bottom: 7px;
    }
    .field input {
      width: 100%; padding: 12px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; color: #fff; font-size: 15px;
      transition: border-color .18s, background .18s;
      outline: none;
    }
    .field input:focus {
      border-color: rgba(59,130,246,0.5);
      background: rgba(59,130,246,0.06);
    }
    .field input::placeholder { color: rgba(255,255,255,0.2); }

    .btn-login {
      width: 100%; padding: 14px;
      background: #2563eb; color: #fff;
      border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 8px;
      transition: background .2s, box-shadow .2s;
      box-shadow: 0 4px 20px rgba(37,99,235,.35);
    }
    .btn-login:hover { background: #1d4ed8; box-shadow: 0 6px 28px rgba(37,99,235,.5); }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.5; cursor: default; }

    /* ── Error ── */
    .error-msg {
      display: none; margin-bottom: 16px;
      padding: 10px 14px; border-radius: 9px;
      background: rgba(248,113,113,0.12);
      border: 1px solid rgba(248,113,113,0.25);
      color: #fca5a5; font-size: 13px; font-weight: 500;
    }

    /* ── PIN keypad ── */
    .pin-dots {
      display: flex; gap: 14px; justify-content: center;
      margin-bottom: 28px;
    }
    .pin-dot {
      width: 18px; height: 18px; border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.2);
      transition: all .15s;
    }
    .pin-dot.filled {
      background: #3b82f6;
      border-color: #3b82f6;
      box-shadow: 0 0 12px rgba(59,130,246,0.6);
    }

    .keypad {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px; margin-bottom: 16px;
    }
    .key {
      aspect-ratio: 1;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: #fff; font-size: 22px; font-weight: 700;
      cursor: pointer; transition: all .12s;
      display: flex; align-items: center; justify-content: center;
    }
    .key:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
    .key:active { transform: scale(0.92); background: rgba(59,130,246,0.25); }
    .key.key-del {
      font-size: 16px; color: rgba(255,255,255,0.5);
    }
    .key.key-ok {
      background: rgba(37,99,235,0.2); border-color: rgba(59,130,246,0.4);
      color: #93c5fd; font-size: 14px; font-weight: 700;
    }
    .key.key-ok:hover { background: rgba(37,99,235,0.35); }

    .pin-hint {
      text-align: center; font-size: 12px;
      color: rgba(255,255,255,0.25); margin-top: 4px;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
<div class="split">

  <!-- LEFT -->
  <div class="left">
    <div class="left-bg" id="hero-bg"></div>
    <div class="left-overlay"></div>
    <div class="left-content">
      <div class="left-logo">
        <div class="left-logo-dot"></div>
        <span style="display:flex;align-items:baseline;gap:5px">
          <span class="left-brand-mcc">MCC</span>
          <span class="left-brand-srl">S.R.L.</span>
        </span>
      </div>
      <div>
        <div class="left-stqc">STQC</div>
        <div class="left-sub">Sistema Tracciamento QR su Commessa</div>
        <div class="left-badge">Produzione · v1.0</div>
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <div class="login-box">
      <div class="login-header">
        <div class="login-eyebrow">Sistema di accesso</div>
        <div class="login-title">Benvenuto</div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('standard')">Accesso PC</button>
        <button class="tab-btn" onclick="switchTab('operaio')">Accesso Tablet</button>
      </div>

      <!-- Panel Standard -->
      <div class="tab-panel active" id="panel-standard">
        <div class="error-msg" id="err-standard"></div>
        <form onsubmit="doLogin(event)">
          <div class="field">
            <label>UserID</label>
            <input type="text" id="f-username" placeholder="user id" autocomplete="username" autocapitalize="none"/>
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="f-password" placeholder="••••••••" autocomplete="current-password"/>
          </div>
          <button class="btn-login" id="btn-login" type="submit">Accedi</button>
        </form>
      </div>

      <!-- Panel Operaio -->
      <div class="tab-panel" id="panel-operaio">
        <div class="error-msg" id="err-operaio"></div>
        <div class="pin-dots">
          <div class="pin-dot" id="d0"></div>
          <div class="pin-dot" id="d1"></div>
          <div class="pin-dot" id="d2"></div>
          <div class="pin-dot" id="d3"></div>
        </div>
        <div class="keypad">
          <button class="key" onclick="pinKey('1')">1</button>
          <button class="key" onclick="pinKey('2')">2</button>
          <button class="key" onclick="pinKey('3')">3</button>
          <button class="key" onclick="pinKey('4')">4</button>
          <button class="key" onclick="pinKey('5')">5</button>
          <button class="key" onclick="pinKey('6')">6</button>
          <button class="key" onclick="pinKey('7')">7</button>
          <button class="key" onclick="pinKey('8')">8</button>
          <button class="key" onclick="pinKey('9')">9</button>
          <button class="key key-del" onclick="pinDel()">⌫</button>
          <button class="key" onclick="pinKey('0')">0</button>
          <button class="key key-ok" id="key-ok" onclick="doPinLogin()" disabled>OK</button>
        </div>
        <div class="pin-hint">Inserisci il PIN a 4 cifre</div>
      </div>

    </div>
  </div>
</div>

<script>
const NEXT_URL = new URLSearchParams(location.search).get('next');
const LOGIN_DESTINATION = NEXT_URL && NEXT_URL.startsWith('/') && !NEXT_URL.startsWith('//')
  ? NEXT_URL
  : '/';
// ── Tab switch ────────────────────────────────────────────────────────────────
function switchTab(t) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', (i === 0) === (t === 'standard')));
  document.getElementById('panel-standard').classList.toggle('active', t === 'standard');
  document.getElementById('panel-operaio').classList.toggle('active', t === 'operaio');
  clearErrors();
  if (t === 'standard') document.getElementById('f-username').focus();
}

function clearErrors() {
  document.getElementById('err-standard').style.display = 'none';
  document.getElementById('err-operaio').style.display = 'none';
}

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg; el.style.display = 'block';
}

// ── Standard login ────────────────────────────────────────────────────────────
async function doLogin(e) {
  e.preventDefault();
  clearErrors();
  const username = document.getElementById('f-username').value.trim();
  const password = document.getElementById('f-password').value;
  if (!username || !password) { showError('err-standard', 'Inserisci username e password.'); return; }

  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = 'Accesso in corso…';

  try {
    const res = await fetch('/api/v1/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.detail || 'Errore di accesso');
    }
    const data = await res.json();
    saveSession(data);
    window.location.replace(LOGIN_DESTINATION);
  } catch(err) {
    showError('err-standard', err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Accedi';
  }
}

// ── PIN login ─────────────────────────────────────────────────────────────────
let _pin = '';

function pinKey(digit) {
  if (_pin.length >= 4) return;
  _pin += digit;
  updatePinDots();
  if (_pin.length === 4) doPinLogin();
}

function pinDel() {
  _pin = _pin.slice(0, -1);
  updatePinDots();
  clearErrors();
}

function updatePinDots() {
  for (let i = 0; i < 4; i++) {
    document.getElementById('d' + i).classList.toggle('filled', i < _pin.length);
  }
  document.getElementById('key-ok').disabled = _pin.length !== 4;
}

async function doPinLogin() {
  if (_pin.length !== 4) return;
  clearErrors();
  document.getElementById('key-ok').disabled = true;

  try {
    const res = await fetch('/api/v1/auth/login-pin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: _pin }),
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.detail || 'PIN non riconosciuto');
    }
    const data = await res.json();
    saveSession(data);
    window.location.replace(LOGIN_DESTINATION);
  } catch(err) {
    showError('err-operaio', err.message);
    _pin = '';
    updatePinDots();
  } finally {
    document.getElementById('key-ok').disabled = false;
  }
}

// ── Session ───────────────────────────────────────────────────────────────────
function saveSession(data) {
  localStorage.setItem('stqc_token',   data.access_token);
  localStorage.setItem('stqc_profilo', data.profilo);
  localStorage.setItem('stqc_nome',    data.username);
}

// Redirect if already logged in
(function() {
  const t = localStorage.getItem('stqc_token');
  if (t) window.location.replace(LOGIN_DESTINATION);
})();

// Hero animation
window.addEventListener('load', () => {
  document.getElementById('hero-bg').classList.add('loaded');
  document.getElementById('f-username').focus();
});

// Keyboard support for PIN
document.addEventListener('keydown', e => {
  const panel = document.getElementById('panel-operaio');
  if (!panel.classList.contains('active')) return;
  if (e.key >= '0' && e.key <= '9') pinKey(e.key);
  if (e.key === 'Backspace') pinDel();
  if (e.key === 'Enter' && _pin.length === 4) doPinLogin();
});
</script>
</body>
</html>
