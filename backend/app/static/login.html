<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Accesso · MCC STQC</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; }

    /* ── Layout ── */
    .split { display: flex; height: 100vh; }

    /* ── Left panel ── */
    .left {
      width: 40%; position: relative; overflow: hidden; flex-shrink: 0;
    }
    .left-bg {
      position: absolute; inset: 0;
      background-image: url('https://images.unsplash.com/photo-1504917595217-d4dc5ebe6122?auto=format&fit=crop&w=900&q=85');
      background-size: cover; background-position: center;
      transform: scale(1.04); transition: transform 8s ease;
    }
    .left-bg.loaded { transform: scale(1); }
    .left-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, rgba(15,23,42,0.45) 0%, rgba(15,23,42,0.75) 60%, rgba(15,23,42,0.95) 100%);
    }
    .left-content {
      position: relative; z-index: 2; height: 100%;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 40px 44px;
    }
    .left-logo { display: flex; align-items: center; gap: 10px; }
    .left-logo-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #3b82f6; box-shadow: 0 0 12px #3b82f6;
    }
    .left-brand-mcc {
      font-size: 44px; font-weight: 900; letter-spacing: -.02em; color: rgba(255,255,255,0.85);
    }
    .left-brand-srl {
      font-size: 20px; font-weight: 700; letter-spacing: .1em; color: rgba(255,255,255,0.38);
    }
    .left-stqc {
      font-size: clamp(80px, 10vw, 118px); font-weight: 900; color: #fff;
      line-height: 1; letter-spacing: -.03em; text-shadow: 0 4px 40px rgba(0,0,0,0.5);
    }
    .left-sub {
      font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.38);
      margin-top: 10px; letter-spacing: .04em;
    }
    .left-badge {
      display: inline-block; margin-top: 20px; padding: 5px 12px; border-radius: 20px;
      background: rgba(59,130,246,0.2); border: 1px solid rgba(59,130,246,0.4);
      color: #93c5fd; font-size: 11px; font-weight: 600;
      letter-spacing: .06em; text-transform: uppercase;
    }

    /* ── Right panel ── */
    .right {
      flex: 1; background: #0f172a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px;
    }
    .login-box {
      width: 100%; max-width: 420px;
    }
    .login-header { margin-bottom: 32px; }
    .login-eyebrow {
      font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.3);
      text-transform: uppercase; letter-spacing: .14em; margin-bottom: 8px;
    }
    .login-title {
      font-size: 26px; font-weight: 800; color: rgba(255,255,255,0.93);
      letter-spacing: -.02em;
    }

    /* ── Form ── */
    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 11px; font-weight: 700;
      color: rgba(255,255,255,0.35); text-transform: uppercase;
      letter-spacing: .1em; margin-bottom: 7px;
    }
    .field input {
      width: 100%; padding: 12px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; color: #fff; font-size: 15px;
      transition: border-color .18s, background .18s;
      outline: none;
    }
    .field input:focus {
      border-color: rgba(59,130,246,0.5);
      background: rgba(59,130,246,0.06);
    }
    .field input::placeholder { color: rgba(255,255,255,0.2); }

    .btn-login {
      width: 100%; padding: 14px;
      background: #2563eb; color: #fff;
      border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 8px;
      transition: background .2s, box-shadow .2s;
      box-shadow: 0 4px 20px rgba(37,99,235,.35);
    }
    .btn-login:hover { background: #1d4ed8; box-shadow: 0 6px 28px rgba(37,99,235,.5); }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.5; cursor: default; }

    /* ── Error ── */
    .error-msg {
      display: none; margin-bottom: 16px;
      padding: 10px 14px; border-radius: 9px;
      background: rgba(248,113,113,0.12);
      border: 1px solid rgba(248,113,113,0.25);
      color: #fca5a5; font-size: 13px; font-weight: 500;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
<div class="split">

  <!-- LEFT -->
  <div class="left">
    <div class="left-bg" id="hero-bg"></div>
    <div class="left-overlay"></div>
    <div class="left-content">
      <div class="left-logo">
        <div class="left-logo-dot"></div>
        <span style="display:flex;align-items:baseline;gap:5px">
          <span class="left-brand-mcc">MCC</span>
          <span class="left-brand-srl">S.R.L.</span>
        </span>
      </div>
      <div>
        <div class="left-stqc">STQC</div>
        <div class="left-sub">Sistema Tracciamento QR su Commessa</div>
        <div class="left-badge">Produzione · v1.0</div>
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <div class="login-box">
      <div class="login-header">
        <div class="login-eyebrow">Sistema di accesso</div>
        <div class="login-title">Benvenuto</div>
      </div>

      <div class="error-msg" id="err-standard"></div>
      <form onsubmit="doLogin(event)">
        <div class="field">
          <label>UserID</label>
          <input type="text" id="f-username" placeholder="user id" autocomplete="username" autocapitalize="none"/>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="f-password" placeholder="••••••••" autocomplete="current-password"/>
        </div>
        <button class="btn-login" id="btn-login" type="submit">Accedi</button>
      </form>

    </div>
  </div>
</div>

<script>
const NEXT_URL = new URLSearchParams(location.search).get('next');
const LOGIN_DESTINATION = NEXT_URL && NEXT_URL.startsWith('/') && !NEXT_URL.startsWith('//')
  ? NEXT_URL
  : '/';

function clearErrors() {
  document.getElementById('err-standard').style.display = 'none';
}

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg; el.style.display = 'block';
}

// ── Standard login ────────────────────────────────────────────────────────────
async function doLogin(e) {
  e.preventDefault();
  clearErrors();
  const username = document.getElementById('f-username').value.trim();
  const password = document.getElementById('f-password').value;
  if (!username || !password) { showError('err-standard', 'Inserisci username e password.'); return; }

  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = 'Accesso in corso…';

  try {
    const res = await fetch('/api/v1/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.detail || 'Errore di accesso');
    }
    const data = await res.json();
    saveSession(data);
    window.location.replace(LOGIN_DESTINATION);
  } catch(err) {
    showError('err-standard', err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Accedi';
  }
}

// ── Session ───────────────────────────────────────────────────────────────────
function clearLegacyPersistentSession() {
  ['stqc_token','stqc_profilo','stqc_nome'].forEach(k => localStorage.removeItem(k));
}

function saveSession(data) {
  clearLegacyPersistentSession();
  sessionStorage.setItem('stqc_token',   data.access_token);
  sessionStorage.setItem('stqc_profilo', data.profilo);
  sessionStorage.setItem('stqc_nome',    data.username);
}

// Redirect if already logged in
(function() {
  clearLegacyPersistentSession();
  const t = sessionStorage.getItem('stqc_token');
  if (t) window.location.replace(LOGIN_DESTINATION);
})();

// Hero animation
window.addEventListener('load', () => {
  document.getElementById('hero-bg').classList.add('loaded');
  document.getElementById('f-username').focus();
});
</script>
</body>
</html>
