<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Progettazione</title>
<script src="/static/commessa-embed.js?v=progettazione"></script>
<style>
:root{color-scheme:dark;--bg:#0e223c;--panel:#142a47;--line:#2a4361;--muted:#94a9c1;--text:#e9f1fc;--blue:#86b4ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px "Segoe UI",sans-serif}
main{max-width:1360px;margin:auto;padding:26px 32px 18px}
header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:22px}
.eyebrow{display:flex;align-items:center;gap:8px;color:var(--blue);font-size:10px;font-weight:750;letter-spacing:.14em}
.eyebrow:before{content:"";width:7px;height:7px;background:var(--blue);border-radius:2px}
h1{font-size:clamp(21px,2vw,29px);font-weight:650;letter-spacing:-.035em;margin:8px 0 0;overflow-wrap:anywhere;line-height:1.2}
.identity{min-width:0;flex:1}.meta{display:flex;gap:10px 22px;flex-wrap:wrap;max-width:42%;justify-content:flex-end}.meta span{flex-direction:column;gap:4px!important}.meta span{display:flex;gap:7px;align-items:baseline;font-size:12px;color:#b9c9dc}.meta small{font-size:10px;color:#7e95af;text-transform:uppercase;letter-spacing:.07em}
.panel{border:1px solid var(--line);background:var(--panel);border-radius:16px;overflow:hidden;box-shadow:0 16px 42px #00000018}
.panel-head{padding:18px 22px;display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid var(--line);background:linear-gradient(110deg,#1b3554,#142a47)}
h2{margin:0;font-size:17px;font-weight:650;letter-spacing:-.015em}.legend{color:var(--muted);font-size:12px;margin:5px 0 0}
.progress{width:160px;flex-shrink:0}#count{display:block;text-align:right;font-size:12px;color:#b9c9dc;margin-bottom:8px;font-variant-numeric:tabular-nums}.track{height:4px;background:#304661;border-radius:5px;overflow:hidden}.track span{display:block;height:100%;width:0;background:#63d5ae;border-radius:5px;transition:width .2s}
table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{text-align:left}th{padding:11px 22px;color:#7e95af;font-size:10px;font-weight:650;text-transform:uppercase;letter-spacing:.1em;background:#112741;border-bottom:1px solid var(--line)}td{padding:6px 22px;border-bottom:1px solid #263e5a;height:47px}tbody tr{transition:background .15s}tbody tr:hover{background:#1a3253}tr:last-child td{border-bottom:0}
.activity{display:block;font-size:13px;font-weight:550;letter-spacing:.005em}.note{display:block;font-size:11px;color:#849ab4;margin-top:3px;line-height:1.4}.check{text-align:center;width:80px}.state-col{width:166px}
.check-hit{display:inline-flex;width:36px;height:34px;align-items:center;justify-content:center;border-radius:8px;cursor:pointer}.check-hit:hover{background:#2a4363}
input[type=checkbox]{appearance:none;margin:0;width:21px;height:21px;border:1.5px solid #49617e;border-radius:6px;background:#112540;cursor:pointer;display:grid;place-content:center;transition:background .15s,border-color .15s}
input[type=checkbox]:checked{background:#78aafa;border-color:#78aafa}input[data-field=fine]:checked{background:#67d6b0;border-color:#67d6b0}input:checked:after{content:"";width:8px;height:4px;border-left:2px solid #0e324f;border-bottom:2px solid #0e324f;transform:translateY(-1px) rotate(-45deg)}input:focus-visible{outline:2px solid #b3d2ff;outline-offset:4px}input:disabled{opacity:.5;cursor:wait}
.status{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-size:11px;font-weight:550;padding:6px 10px;border:1px solid #f8717120;border-radius:7px;background:#f8717109;color:#d8a2a9}.dot{width:12px;height:12px;border-radius:50%;background:#f47d88;flex-shrink:0}.IN_CORSO{border-color:#e9b75125;background:#e9b7510c;color:#edc974}.IN_CORSO .dot{background:#f1c459}.COMPLETATA{border-color:#67d6b029;background:#67d6b00c;color:#83dcbf}.COMPLETATA .dot{background:#67d6b0}
tbody tr:has(.status.COMPLETATA){background:#143c30}tbody tr:has(.status.COMPLETATA):hover{background:#194b3b}tbody tr:has(.status.COMPLETATA) td:first-child{box-shadow:inset 3px 0 #67d6b0}tbody tr:has(.status.IN_CORSO){background:#3c3218}tbody tr:has(.status.IN_CORSO):hover{background:#4a3e1e}tbody tr:has(.status.IN_CORSO) td:first-child{box-shadow:inset 3px 0 #f1c459}
.footer{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:12px 2px;color:#6f87a2;font-size:11px}#feedback{min-height:16px;color:#96afcd}#feedback[data-tone=error]{color:#fca5a5}#feedback[data-tone=success]{color:#83dcbf}
@media(max-width:700px){header{display:block}.meta{max-width:none;justify-content:flex-start;margin-top:14px}main{padding:20px 14px 10px}.meta{gap:10px 18px}h1{font-size:23px}.panel-head{padding:16px}.progress{width:110px}.legend{font-size:11px}th,td{padding:9px 12px}.check{width:52px}.state-col{width:128px}.activity{font-size:12px}.status{font-size:10px;padding:5px 7px;gap:5px}.note{font-size:10px}.footer{align-items:flex-start}}
@media(max-width:450px){main{padding:16px 8px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}.meta span:first-child{grid-column:1/-1;overflow-wrap:anywhere}.panel-head{gap:10px;padding:14px 12px}h2{font-size:15px}.progress{width:90px}#count{font-size:10px}.check{width:43px}.state-col{width:104px}th,td{padding:8px}.status{padding:5px;font-size:9px}.activity{font-size:11px}.note{font-size:10px}.footer>span{max-width:55%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><header><div class="identity"><div class="eyebrow">PROGETTAZIONE</div><h1 id="title">Caricamento commessa…</h1></div><div class="meta" id="meta"></div></header><section class="panel"><div class="panel-head"><div><h2>Checklist progettazione</h2><p class="legend">Elaborati e preparazione della commessa</p></div><div class="progress"><span id="count"></span><div class="track" role="progressbar" aria-label="Voci completate" aria-valuemin="0" aria-valuemax="9" aria-valuenow="0"><span id="progress-fill"></span></div></div></div><table><thead><tr><th>Elaborato / attività</th><th class="check">Inizio</th><th class="check">Fine</th><th class="state-col">Stato</th></tr></thead><tbody id="rows"></tbody></table></section><div class="footer"><span>Le modifiche vengono salvate automaticamente.</span><div id="feedback" role="status" aria-live="polite"></div></div></main>
<script>
const auth=()=>({Authorization:'Bearer '+(sessionStorage.getItem('stqc_token')||'')});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let commessaId,items=[];
const labels={NON_INIZIATA:'Non iniziata',IN_CORSO:'In corso',COMPLETATA:'Completata'};
const titles={modello_ifc:'Modello IFC',distinte:'Distinte',taglio_foratura:'Taglio / foratura',nesting_tecnocam:'Nesting Tecnocam',taglio_lamiere:'Taglio lamiere / laser',nesting_metalix:'Nesting Metalix laser',tavole_assemblaggio:'Tavole di assemblaggio',tavole_montaggio:'Tavole di montaggio',etichette:'Stampa di tutte le etichette'};
const notes={nesting_tecnocam:'Taglio profilati',etichette:'Cartacee o metalliche per zincatura a caldo.'};
function render(){
 const completed=items.filter(x=>x.fine).length;
 document.getElementById('count').textContent=completed+' di '+items.length+' completate';
 document.getElementById('progress-fill').style.width=(items.length?completed/items.length*100:0)+'%';
 document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',completed);
 document.querySelector('[role=progressbar]').setAttribute('aria-valuemax',items.length);
 document.getElementById('rows').innerHTML=items.map(x=>`<tr data-key="${x.voce}"><td><span class="activity">${esc(titles[x.voce]||x.label)}</span>${notes[x.voce]?`<span class="note">${esc(notes[x.voce])}</span>`:''}</td><td class="check"><label class="check-hit"><input type="checkbox" data-field="inizio" aria-label="Inizio ${esc(x.label)}" ${x.inizio?'checked':''}></label></td><td class="check"><label class="check-hit"><input type="checkbox" data-field="fine" aria-label="Fine ${esc(x.label)}" ${x.fine?'checked':''}></label></td><td><span class="status ${x.stato}"><span class="dot" aria-hidden="true"></span>${labels[x.stato]}</span></td></tr>`).join('');
}
document.getElementById('rows').addEventListener('change',async event=>{
 const input=event.target;if(!input.matches('input'))return;
 const row=input.closest('tr'),item=items.find(x=>x.voce===row.dataset.key);
 let inizio=item.inizio,fine=item.fine;
 if(input.dataset.field==='fine'){fine=input.checked;if(fine)inizio=true;}else{inizio=input.checked;if(!inizio)fine=false;}
 document.getElementById('rows').querySelectorAll('input').forEach(x=>x.disabled=true);
 const feedback=document.getElementById('feedback');feedback.dataset.tone='pending';feedback.textContent='Salvataggio…';
 try{
  const r=await fetch(`/api/v1/commesse/${commessaId}/progettazione/${item.voce}`,{method:'PATCH',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({inizio,fine})});
  const d=await r.json();if(!r.ok)throw new Error(d.detail||'Salvataggio non riuscito');
  Object.assign(item,d);feedback.dataset.tone='success';feedback.textContent='Modifiche salvate';
 }catch(error){feedback.dataset.tone="error";feedback.textContent=error.message;}
 render();
 document.querySelector(`[data-key="${item.voce}"] input[data-field="${input.dataset.field}"]`)?.focus({preventScroll:true});
});
async function load(){try{
 const ref=decodeURIComponent(location.pathname.split('/')[2]);
 const r=await fetch('/api/v1/commesse/resolve/'+encodeURIComponent(ref),{headers:auth()});const c=await r.json();if(!r.ok)throw new Error(c.detail||'Commessa non disponibile');
 const detail=await fetch(`/api/v1/commesse/${c.id}`,{headers:auth()});if(!detail.ok)throw new Error('Dati commessa non disponibili');Object.assign(c,await detail.json());
 commessaId=c.id;document.getElementById('title').textContent=c.descrizione||c.codice;document.title='Progettazione · '+(c.descrizione||c.codice);
 document.getElementById('meta').innerHTML=`<span><small>Codice</small>${esc(c.codice)}</span><span><small>Cliente</small>${esc(c.cliente||'Non indicato')}</span><span><small>Consegna</small>${esc(c.data_consegna_prevista?new Date(c.data_consegna_prevista+'T12:00:00').toLocaleDateString('it-IT'):'Da definire')}</span>`;
 const response=await fetch(`/api/v1/commesse/${c.id}/progettazione`,{headers:auth()});const data=await response.json();if(!response.ok)throw new Error(data.detail||'Checklist non disponibile');items=data;render();
 }catch(error){document.getElementById('feedback').dataset.tone='error';document.getElementById('feedback').textContent=error.message;}}
load();
</script></body></html>
