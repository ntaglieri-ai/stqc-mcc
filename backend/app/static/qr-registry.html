<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Registro QR distinta · MCC</title>
  <link rel="stylesheet" href="/static/qr-drawer.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#09111f;color:#dce8fa;font-family:Inter,system-ui,sans-serif}.top{height:66px;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid #1c2a40;background:#0d1624}.top a{color:#9db1ca;text-decoration:none}.title{font-size:20px;font-weight:950}.spacer{flex:1}.layout{display:grid;grid-template-columns:290px minmax(0,1fr) auto;min-height:calc(100vh - 66px)}main{padding:22px;min-width:0}.filter-side{background:#0c1523;border-right:1px solid #20314a;padding:16px 13px;height:calc(100vh - 66px);position:sticky;top:0;overflow:auto}.filter-title{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:#8eacd2;font-weight:950}.filter-group{margin-top:11px;border:1px solid #20334c;border-radius:11px;background:#0f1a2a;overflow:hidden}.filter-group summary{cursor:pointer;padding:11px 12px;color:#9eb6d5;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.1em}.filter-group-body{padding:0 10px 11px}.filter-label{font-size:8px;text-transform:uppercase;letter-spacing:.11em;color:#7187a2;font-weight:850;margin:10px 2px 5px}.filter-control{width:100%;background:#121f32;border:1px solid #293d59;border-radius:9px;color:#dce8fa;padding:9px;font-size:11px}.filter-kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.filter-stat{background:#111d2e;border:1px solid #20334c;border-radius:11px;padding:10px}.filter-stat strong{display:block;font-size:18px}.filter-stat span{font-size:8px;color:#758ba7;text-transform:uppercase}.tools{display:flex;gap:10px;align-items:center;margin-bottom:18px}.btn{border:1px solid #2c4161;background:#16243a;color:#dce8fa;border-radius:10px;padding:10px 14px;font-weight:850;cursor:pointer}.btn.primary{background:#315fca;border-color:#4779e5}.count{font-size:12px;color:#8196b2}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px}.card{position:relative;display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;background:#101a2b;border:1px solid #1d2d45;border-radius:15px;padding:14px;cursor:pointer}.card:hover{border-color:#4779ce}.card.has-note{box-shadow:inset 3px 0 #f4be4f}.card img{width:92px;height:92px;background:white;border-radius:9px;padding:5px}.check{position:absolute;right:12px;top:12px;width:19px;height:19px}.code{font-size:15px;font-weight:950;padding-right:25px}.meta{font-size:11px;color:#8297b1;margin-top:7px;line-height:1.5}.note-dot{display:inline-flex;margin-top:8px;padding:4px 7px;border-radius:999px;background:rgba(244,190,79,.13);color:#ffd67c;font-size:10px;font-weight:850}.notes-toggle{position:relative}.notes-toggle.lit{color:#ffd67c;border-color:#a77b2b;box-shadow:0 0 18px rgba(244,190,79,.22)}.badge{position:absolute;right:-7px;top:-8px;background:#f4be4f;color:#1b1405;border-radius:999px;min-width:20px;height:20px;padding:2px 5px;font-size:10px;font-weight:950}.notes{width:0;overflow:hidden;background:#0d1726;border-left:1px solid #20314a;transition:.22s}.notes.open{width:360px}.notes-inner{position:sticky;top:0;width:360px;padding:20px}.notes-head{display:flex;align-items:center}.notes-list{display:grid;gap:8px;margin-top:14px;max-height:45vh;overflow:auto}.note-row{background:#142035;border:1px solid #22344f;border-radius:11px;padding:11px;cursor:pointer}.note-row strong{display:block}.note-row span{font-size:11px;color:#9aacbf}.editor{margin-top:18px;border-top:1px solid #263750;padding-top:16px}.editor textarea{width:100%;min-height:130px;background:#09111f;border:1px solid #2b3e5b;color:white;border-radius:10px;padding:11px;resize:vertical}.empty{padding:35px;text-align:center;color:#8094ae}.loader{padding:60px;text-align:center;color:#8094ae}.station-backdrop{position:fixed;inset:0;background:rgba(4,8,15,.72);display:none;z-index:50}.station-backdrop.open{display:block}.station-drawer{position:absolute;inset:18px 18px 18px auto;width:min(1180px,92vw);background:#0d1726;border:1px solid #284061;border-radius:24px;box-shadow:-25px 0 80px rgba(0,0,0,.45);overflow:auto}.station-head{position:sticky;top:0;background:#0d1726;z-index:2;display:flex;align-items:center;gap:14px;padding:22px;border-bottom:1px solid #223650}.station-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;padding:22px}.station-card{background:linear-gradient(145deg,#111d31,#0d1726);border:1px solid #243a58;border-radius:18px;padding:16px}.station-card h3{margin:0;font-size:18px}.station-card p{min-height:34px;margin:7px 0 14px;color:#8fa4bf;font-size:12px}.station-codes{display:grid;grid-template-columns:1fr 1fr;gap:12px}.station-qr{border:1px solid #2a4265;background:#101b2c;border-radius:14px;padding:12px;text-align:center;cursor:pointer}.station-qr:hover{border-color:#70a1ff;transform:translateY(-1px)}.station-qr img{width:150px;height:150px;background:white;border-radius:10px;padding:7px}.station-qr strong{display:block;margin-top:8px;font-size:13px}.station-qr code{display:block;margin-top:6px;color:#9eb2ce;font-size:10px;word-break:break-all}.station-print{margin-top:8px;padding:8px 10px;border-radius:9px;border:1px solid #2d4568;background:#17263d;color:#dce8fa;font-weight:850;cursor:pointer}@media(max-width:900px){.layout{grid-template-columns:1fr}.filter-side{height:auto;position:static;border-right:0;border-bottom:1px solid #20314a}.notes.open{position:fixed;inset:66px 0 0 auto;width:min(92vw,380px);z-index:20;box-shadow:-20px 0 50px #000}.station-drawer{inset:8px;width:calc(100vw - 16px)}.station-grid{grid-template-columns:1fr;padding:14px}.station-codes{grid-template-columns:1fr}main{padding:14px}.grid{grid-template-columns:1fr}.tools{flex-wrap:wrap}}
  </style>
</head>
<body>
<header class="top"><a id="back" href="#">← Analisi</a><div><div class="title">Registro QR distinta</div><div class="count" id="subtitle">Caricamento…</div></div><div class="spacer"></div><button class="btn" onclick="openStationCodes()">Codici postazione</button><button class="btn notes-toggle" id="notes-toggle" onclick="toggleNotes()">Note <span class="badge" id="notes-badge" hidden>0</span></button></header>
<div class="layout"><aside class="filter-side"><div class="filter-title">Filtri attributi QR</div><div id="attribute-filters"></div><div class="filter-kpi"><div class="filter-stat"><strong id="filter-visible">0</strong><span>Visibili</span></div><div class="filter-stat"><strong id="filter-total">0</strong><span>Totali</span></div></div><button class="btn" style="width:100%;margin-top:12px" onclick="resetPageFilters()">Reset filtri</button></aside><main><div class="tools"><button class="btn primary" onclick="openSelected()">Dettagli selezionati</button><button class="btn" onclick="clearSelected()">Annulla selezione</button><span class="count" id="selection">0 selezionati</span></div><div class="grid" id="grid"><div class="loader">Caricamento QR…</div></div></main>
<aside class="notes" id="notes"><div class="notes-inner"><div class="notes-head"><div><div class="title">Note pezzi</div><div class="count">Note reali collegate ai singoli QR</div></div><div class="spacer"></div><button class="btn" onclick="toggleNotes()">×</button></div><div class="notes-list" id="notes-list"></div><div class="editor" id="editor" hidden><strong id="editor-code">—</strong><textarea id="note-text" placeholder="Scrivi una nota per questo pezzo…"></textarea><button class="btn primary" style="margin-top:9px" onclick="saveNote()">Salva nota</button></div></div></aside></div>
<div class="station-backdrop" id="station-backdrop" onclick="closeStationCodes(event)"><section class="station-drawer" onclick="event.stopPropagation()"><div class="station-head"><div><div class="title">Codici postazione officina</div><div class="count">Scansiona INIZIO, poi i pezzi, poi FINE. Clicca un QR per stamparlo singolarmente.</div></div><div class="spacer"></div><button class="btn" onclick="loadStationCodes()">Aggiorna</button><button class="btn" onclick="closeStationCodes()">×</button></div><div class="station-grid" id="station-grid"><div class="loader">Caricamento postazioni…</div></div></section></div>
<script src="/static/qr-drawer.js"></script>
<script>
const commessaId=Number(location.pathname.split('/').filter(Boolean).at(-2));const auth=()=>({Authorization:'Bearer '+sessionStorage.getItem('stqc_token'),'Content-Type':'application/json'});const selected=new Set();let items=[],editing=null,stationCodes=[];
const grid=document.getElementById('grid'),subtitle=document.getElementById('subtitle'),selection=document.getElementById('selection'),notes=document.getElementById('notes'),notesBadge=document.getElementById('notes-badge'),notesToggle=document.getElementById('notes-toggle'),notesList=document.getElementById('notes-list'),editor=document.getElementById('editor'),editorCode=document.getElementById('editor-code'),noteText=document.getElementById('note-text');
const attributeFilters=document.getElementById('attribute-filters'),filterVisible=document.getElementById('filter-visible'),filterTotal=document.getElementById('filter-total');
const stationBackdrop=document.getElementById('station-backdrop'),stationGrid=document.getElementById('station-grid');
const FILTER_GROUPS=[
  ['Identità',[['uuid','UUID','text'],['qr_code','Codice pezzo','text'],['marca_pos','Marca posizione','select'],['progressivo','Progressivo','text']]],
  ['Commessa e distinta',[['commessa','Commessa','select'],['revisione','Revisione','select'],['assemblato','Assemblato','select']]],
  ['Caratteristiche',[['tipo','Tipo profilo','select'],['profilo','Profilo','select'],['materiale','Materiale','select'],['materiale_descrizione','Descrizione materiale','select'],['lunghezza_mm','Lunghezza mm','text'],['larghezza_mm','Larghezza mm','text'],['spessore_mm','Spessore mm','text'],['peso_kg','Peso kg','text']]],
  ['Origine materiale',[['colata','Colata','select'],['lotto','Lotto','select'],['certificato_31','Certificato 3.1','select'],['fornitore','Fornitore','select']]],
  ['Tracciamento',[['stato','Stato','select'],['ultima_postazione','Ultima postazione','select'],['ultimo_evento','Ultimo evento','select'],['ultimo_aggiornamento','Ultimo aggiornamento','text'],['nota','Nota','text']]]
];
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
document.getElementById('back').href=`/commesse/${commessaId}/analisi`;
async function load(){const r=await fetch(`/api/v1/commesse/${commessaId}/step-5-1/items?limit=5000`,{headers:auth()});const d=await r.json();if(!r.ok){grid.innerHTML=`<div class="empty">${esc(d.detail)}</div>`;return}items=d.items||[];subtitle.textContent=`${d.total} pezzi fisici · un QR per pezzo`;setupPageFilters();render()}
function setupPageFilters(){attributeFilters.innerHTML=FILTER_GROUPS.map((group,index)=>`<details class="filter-group" ${index<2?'open':''}><summary>${esc(group[0])}</summary><div class="filter-group-body">${group[1].map(([key,label,type])=>{if(type==='select'){const values=[...new Set(items.map(x=>x[key]).filter(v=>v!==null&&v!==undefined&&v!=='' ).map(String))].sort((a,b)=>a.localeCompare(b,'it',{numeric:true}));return `<div class="filter-label">${esc(label)}</div><select class="filter-control" data-filter="${key}" data-mode="select" onchange="applyPageFilters()"><option value="">Tutti</option>${values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select>`}return `<div class="filter-label">${esc(label)}</div><input class="filter-control" data-filter="${key}" data-mode="text" placeholder="Filtra ${esc(label.toLowerCase())}…" oninput="applyPageFilters()">`}).join('')}</div></details>`).join('');filterTotal.textContent=items.length}
function visible(){const controls=[...attributeFilters.querySelectorAll('[data-filter]')].filter(el=>el.value.trim()!=='');return items.filter(item=>controls.every(el=>{const actual=String(item[el.dataset.filter]??'');return el.dataset.mode==='select'?actual===el.value:actual.toLowerCase().includes(el.value.trim().toLowerCase())}))}
function render(){const rows=visible();filterVisible.textContent=rows.length;grid.innerHTML=rows.map(x=>`<div class="card ${x.nota?'has-note':''}" onclick="QrDrawer.open('${esc(x.uuid)}')"><input class="check" type="checkbox" ${selected.has(x.uuid)?'checked':''} onclick="toggleSelect('${esc(x.uuid)}',event)"><img src="${esc(x.qr_image_url)}"><div><div class="code">${esc(x.qr_code)}</div><div class="meta">${esc(x.profilo||'—')} · ${esc(x.assemblato||'Senza assemblato')}</div><span class="note-dot" onclick="editNote(${x.id},event)">${x.nota?'● Nota':'＋ Nota'}</span></div></div>`).join('')||'<div class="empty">Nessun QR trovato.</div>';selection.textContent=`${selected.size} selezionati`;renderNotes()}
function applyPageFilters(){render()}function resetPageFilters(){attributeFilters.querySelectorAll('[data-filter]').forEach(el=>el.value='');render()}function toggleSelect(uuid,e){e.stopPropagation();selected.has(uuid)?selected.delete(uuid):selected.add(uuid);render()}function clearSelected(){selected.clear();render()}function openSelected(){const v=[...selected];if(v.length===1)QrDrawer.open(v[0]);else if(v.length>1)QrDrawer.openMany(v)}
function renderNotes(){const noted=items.filter(x=>x.nota);notesBadge.hidden=!noted.length;notesBadge.textContent=noted.length;notesToggle.classList.toggle('lit',noted.length>0);notesList.innerHTML=noted.map(x=>`<div class="note-row" onclick="editNote(${x.id})"><strong>${esc(x.qr_code)}</strong><span>${esc(x.nota)}</span></div>`).join('')||'<div class="empty">Nessuna nota presente.</div>'}
function toggleNotes(){notes.classList.toggle('open')}function editNote(id,e){if(e)e.stopPropagation();editing=items.find(x=>x.id===id);if(!editing)return;notes.classList.add('open');editor.hidden=false;editorCode.textContent=editing.qr_code;noteText.value=editing.nota||''}
async function saveNote(){if(!editing)return;const r=await fetch(`/api/v1/commesse/${commessaId}/step-5-1/items/${editing.id}`,{method:'PATCH',headers:auth(),body:JSON.stringify({nota:noteText.value.trim()||null})});const d=await r.json();if(!r.ok)return alert(d.detail||'Errore salvataggio');items=items.map(x=>x.id===d.id?d:x);editing=d;render()}
async function openStationCodes(){stationBackdrop.classList.add('open');if(!stationCodes.length)await loadStationCodes()}
function closeStationCodes(e){if(e&&e.target!==stationBackdrop)return;stationBackdrop.classList.remove('open')}
async function loadStationCodes(){stationGrid.innerHTML='<div class="loader">Caricamento postazioni…</div>';const r=await fetch('/api/v1/admin/workstations/qr-codes',{headers:auth()});const d=await r.json();if(!r.ok){stationGrid.innerHTML=`<div class="empty">${esc(d.detail||'Errore caricamento postazioni')}</div>`;return}stationCodes=d.items||[];renderStationCodes()}
function renderStationCodes(){stationGrid.innerHTML=stationCodes.map((ws,i)=>`<article class="station-card"><h3>${esc(ws.name)}</h3><p>${esc(ws.code)}${ws.description?' · '+esc(ws.description):''}</p><div class="station-codes">${(ws.codes||[]).map((c,j)=>`<div class="station-qr" onclick="printStationCodeByIndex(${i},${j})"><img src="${esc(c.qr_image_url)}" alt="${esc(ws.code)} ${esc(c.action)}"><strong>${esc(c.label)} postazione</strong><code>${esc(c.payload)}</code><button class="station-print" onclick="printStationCodeByIndex(${i},${j});event.stopPropagation()">Stampa QR</button></div>`).join('')}</div></article>`).join('')||'<div class="empty">Nessuna postazione attiva configurata.</div>'}
function printStationCodeByIndex(i,j){const ws=stationCodes[i],c=ws?.codes?.[j];if(!ws||!c)return;printStationCode(ws.code,ws.name,c.label,c.payload,c.qr_image_url)}
function printStationCode(code,name,label,payload,img){const w=window.open('','_blank','width=760,height=860');if(!w)return alert('Popup bloccato: abilita le finestre di stampa.');w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(code)} ${esc(label)}</title><style>@page{size:A4;margin:18mm}body{font-family:Arial,sans-serif;margin:0;color:#101828}.sheet{min-height:calc(100vh - 36mm);display:flex;align-items:center;justify-content:center}.label{text-align:center;border:2px solid #111827;border-radius:18px;padding:28px 34px;max-width:520px}.kicker{font-size:16px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#475467}.name{font-size:34px;font-weight:900;margin-top:10px}.action{font-size:46px;font-weight:950;margin:8px 0 20px}.action.start{color:#047857}.action.end{color:#b42318}img{width:360px;height:360px;image-rendering:pixelated}.payload{margin-top:18px;font-family:monospace;font-size:18px;word-break:break-all}.hint{margin-top:12px;color:#667085;font-size:13px}@media print{button{display:none}}</style></head><body><div class="sheet"><div class="label"><div class="kicker">Codice postazione officina</div><div class="name">${esc(name)}</div><div class="action ${label.toLowerCase().includes('inizio')?'start':'end'}">${esc(label).toUpperCase()}</div><img src="${esc(img)}"><div class="payload">${esc(payload)}</div><div class="hint">${esc(code)} · scannerizza questo QR con la pistola</div><button onclick="window.print()" style="margin-top:22px;padding:12px 18px;border-radius:10px;border:1px solid #111827;background:#111827;color:white;font-weight:800">Stampa</button></div></div><script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`);w.document.close()}
load();
</script>
</body></html>
