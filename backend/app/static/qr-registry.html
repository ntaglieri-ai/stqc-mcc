<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Registro QR distinta · MCC</title>
  <link rel="stylesheet" href="/static/qr-drawer.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#09111f;color:#dce8fa;font-family:Inter,system-ui,sans-serif}.top{height:66px;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid #1c2a40;background:#0d1624}.top a{color:#9db1ca;text-decoration:none}.title{font-size:20px;font-weight:950}.spacer{flex:1}.layout{display:grid;grid-template-columns:270px minmax(0,1fr) auto;min-height:calc(100vh - 66px)}main{padding:22px;min-width:0}.filter-side{background:#0c1523;border-right:1px solid #20314a;padding:20px 15px}.filter-inner{position:sticky;top:20px}.filter-title{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:#8eacd2;font-weight:950}.filter-label{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#7187a2;font-weight:850;margin:15px 2px 6px}.filter-control{width:100%;background:#121f32;border:1px solid #293d59;border-radius:10px;color:#dce8fa;padding:11px}.filter-kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.filter-stat{background:#111d2e;border:1px solid #20334c;border-radius:11px;padding:11px}.filter-stat strong{display:block;font-size:19px}.filter-stat span{font-size:9px;color:#758ba7;text-transform:uppercase}.tools{display:flex;gap:10px;align-items:center;margin-bottom:18px}.btn{border:1px solid #2c4161;background:#16243a;color:#dce8fa;border-radius:10px;padding:10px 14px;font-weight:850;cursor:pointer}.btn.primary{background:#315fca;border-color:#4779e5}.count{font-size:12px;color:#8196b2}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px}.card{position:relative;display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;background:#101a2b;border:1px solid #1d2d45;border-radius:15px;padding:14px;cursor:pointer}.card:hover{border-color:#4779ce}.card.has-note{box-shadow:inset 3px 0 #f4be4f}.card img{width:92px;height:92px;background:white;border-radius:9px;padding:5px}.check{position:absolute;right:12px;top:12px;width:19px;height:19px}.code{font-size:15px;font-weight:950;padding-right:25px}.meta{font-size:11px;color:#8297b1;margin-top:7px;line-height:1.5}.note-dot{display:inline-flex;margin-top:8px;padding:4px 7px;border-radius:999px;background:rgba(244,190,79,.13);color:#ffd67c;font-size:10px;font-weight:850}.notes-toggle{position:relative}.notes-toggle.lit{color:#ffd67c;border-color:#a77b2b;box-shadow:0 0 18px rgba(244,190,79,.22)}.badge{position:absolute;right:-7px;top:-8px;background:#f4be4f;color:#1b1405;border-radius:999px;min-width:20px;height:20px;padding:2px 5px;font-size:10px;font-weight:950}.notes{width:0;overflow:hidden;background:#0d1726;border-left:1px solid #20314a;transition:.22s}.notes.open{width:360px}.notes-inner{position:sticky;top:0;width:360px;padding:20px}.notes-head{display:flex;align-items:center}.notes-list{display:grid;gap:8px;margin-top:14px;max-height:45vh;overflow:auto}.note-row{background:#142035;border:1px solid #22344f;border-radius:11px;padding:11px;cursor:pointer}.note-row strong{display:block}.note-row span{font-size:11px;color:#9aacbf}.editor{margin-top:18px;border-top:1px solid #263750;padding-top:16px}.editor textarea{width:100%;min-height:130px;background:#09111f;border:1px solid #2b3e5b;color:white;border-radius:10px;padding:11px;resize:vertical}.empty{padding:35px;text-align:center;color:#8094ae}.loader{padding:60px;text-align:center;color:#8094ae}@media(max-width:900px){.layout{grid-template-columns:1fr}.filter-side{border-right:0;border-bottom:1px solid #20314a}.filter-inner{position:static}.notes.open{position:fixed;inset:66px 0 0 auto;width:min(92vw,380px);z-index:20;box-shadow:-20px 0 50px #000}main{padding:14px}.grid{grid-template-columns:1fr}.tools{flex-wrap:wrap}}
  </style>
</head>
<body>
<header class="top"><a id="back" href="#">← Analisi</a><div><div class="title">Registro QR distinta</div><div class="count" id="subtitle">Caricamento…</div></div><div class="spacer"></div><button class="btn notes-toggle" id="notes-toggle" onclick="toggleNotes()">Note <span class="badge" id="notes-badge" hidden>0</span></button></header>
<div class="layout"><aside class="filter-side"><div class="filter-inner"><div class="filter-title">Filtri QR</div><div class="filter-label">Codice o testo</div><input class="filter-control" id="page-filter-text" placeholder="Filtra codici…" oninput="applyPageFilters()"><div class="filter-label">Profilo</div><select class="filter-control" id="page-filter-profile" onchange="applyPageFilters()"><option value="">Tutti i profili</option></select><div class="filter-label">Assemblato</div><select class="filter-control" id="page-filter-assembly" onchange="applyPageFilters()"><option value="">Tutti gli assemblati</option></select><div class="filter-kpi"><div class="filter-stat"><strong id="filter-visible">0</strong><span>Visibili</span></div><div class="filter-stat"><strong id="filter-total">0</strong><span>Totali</span></div></div><button class="btn" style="width:100%;margin-top:12px" onclick="resetPageFilters()">Reset filtri</button></div></aside><main><div class="tools"><button class="btn primary" onclick="openSelected()">Dettagli selezionati</button><button class="btn" onclick="clearSelected()">Annulla selezione</button><span class="count" id="selection">0 selezionati</span></div><div class="grid" id="grid"><div class="loader">Caricamento QR…</div></div></main>
<aside class="notes" id="notes"><div class="notes-inner"><div class="notes-head"><div><div class="title">Note pezzi</div><div class="count">Note reali collegate ai singoli QR</div></div><div class="spacer"></div><button class="btn" onclick="toggleNotes()">×</button></div><div class="notes-list" id="notes-list"></div><div class="editor" id="editor" hidden><strong id="editor-code">—</strong><textarea id="note-text" placeholder="Scrivi una nota per questo pezzo…"></textarea><button class="btn primary" style="margin-top:9px" onclick="saveNote()">Salva nota</button></div></div></aside></div>
<script src="/static/qr-drawer.js"></script>
<script>
const commessaId=Number(location.pathname.split('/').filter(Boolean).at(-2));const auth=()=>({Authorization:'Bearer '+sessionStorage.getItem('stqc_token'),'Content-Type':'application/json'});const selected=new Set();let items=[],editing=null;
const grid=document.getElementById('grid'),subtitle=document.getElementById('subtitle'),selection=document.getElementById('selection'),notes=document.getElementById('notes'),notesBadge=document.getElementById('notes-badge'),notesToggle=document.getElementById('notes-toggle'),notesList=document.getElementById('notes-list'),editor=document.getElementById('editor'),editorCode=document.getElementById('editor-code'),noteText=document.getElementById('note-text');
const pageFilterText=document.getElementById('page-filter-text'),pageFilterProfile=document.getElementById('page-filter-profile'),pageFilterAssembly=document.getElementById('page-filter-assembly'),filterVisible=document.getElementById('filter-visible'),filterTotal=document.getElementById('filter-total');
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
document.getElementById('back').href=`/commesse/${commessaId}/analisi`;
async function load(){const r=await fetch(`/api/v1/commesse/${commessaId}/step-5-1/items?limit=5000`,{headers:auth()});const d=await r.json();if(!r.ok){grid.innerHTML=`<div class="empty">${esc(d.detail)}</div>`;return}items=d.items||[];subtitle.textContent=`${d.total} pezzi fisici · un QR per pezzo`;setupPageFilters();render()}
function setupPageFilters(){const profiles=[...new Set(items.map(x=>x.profilo).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')),assemblies=[...new Set(items.map(x=>x.assemblato).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it'));pageFilterProfile.innerHTML='<option value="">Tutti i profili</option>'+profiles.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');pageFilterAssembly.innerHTML='<option value="">Tutti gli assemblati</option>'+assemblies.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');filterTotal.textContent=items.length}
function visible(){const q=pageFilterText.value.trim().toLowerCase(),p=pageFilterProfile.value,a=pageFilterAssembly.value;return items.filter(x=>(!q||[x.qr_code,x.profilo,x.assemblato,x.nota].some(v=>String(v||'').toLowerCase().includes(q)))&&(!p||x.profilo===p)&&(!a||x.assemblato===a))}
function render(){const rows=visible();filterVisible.textContent=rows.length;grid.innerHTML=rows.map(x=>`<div class="card ${x.nota?'has-note':''}" onclick="QrDrawer.open('${esc(x.uuid)}')"><input class="check" type="checkbox" ${selected.has(x.uuid)?'checked':''} onclick="toggleSelect('${esc(x.uuid)}',event)"><img src="${esc(x.qr_image_url)}"><div><div class="code">${esc(x.qr_code)}</div><div class="meta">${esc(x.profilo||'—')} · ${esc(x.assemblato||'Senza assemblato')}</div><span class="note-dot" onclick="editNote(${x.id},event)">${x.nota?'● Nota':'＋ Nota'}</span></div></div>`).join('')||'<div class="empty">Nessun QR trovato.</div>';selection.textContent=`${selected.size} selezionati`;renderNotes()}
function applyPageFilters(){render()}function resetPageFilters(){pageFilterText.value='';pageFilterProfile.value='';pageFilterAssembly.value='';render()}function toggleSelect(uuid,e){e.stopPropagation();selected.has(uuid)?selected.delete(uuid):selected.add(uuid);render()}function clearSelected(){selected.clear();render()}function openSelected(){const v=[...selected];if(v.length===1)QrDrawer.open(v[0]);else if(v.length>1)QrDrawer.openMany(v)}
function renderNotes(){const noted=items.filter(x=>x.nota);notesBadge.hidden=!noted.length;notesBadge.textContent=noted.length;notesToggle.classList.toggle('lit',noted.length>0);notesList.innerHTML=noted.map(x=>`<div class="note-row" onclick="editNote(${x.id})"><strong>${esc(x.qr_code)}</strong><span>${esc(x.nota)}</span></div>`).join('')||'<div class="empty">Nessuna nota presente.</div>'}
function toggleNotes(){notes.classList.toggle('open')}function editNote(id,e){if(e)e.stopPropagation();editing=items.find(x=>x.id===id);if(!editing)return;notes.classList.add('open');editor.hidden=false;editorCode.textContent=editing.qr_code;noteText.value=editing.nota||''}
async function saveNote(){if(!editing)return;const r=await fetch(`/api/v1/commesse/${commessaId}/step-5-1/items/${editing.id}`,{method:'PATCH',headers:auth(),body:JSON.stringify({nota:noteText.value.trim()||null})});const d=await r.json();if(!r.ok)return alert(d.detail||'Errore salvataggio');items=items.map(x=>x.id===d.id?d:x);editing=d;render()}
load();
</script>
</body></html>
