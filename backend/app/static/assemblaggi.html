<!doctype html>
<html lang="it">
<head>
  <script src="/static/commessa-embed.js?v=commessa-shell2"></script>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Assemblaggi · MCC</title>
  <link rel="stylesheet" href="/static/assemblaggi-register.css?v=1">
</head>
<body>
<header class="top"><a href="/">Home</a><span>/</span><a id="analysis-link">Analisi commessa</a><span>/ Assemblaggi</span></header>
<div class="layout">
  <aside id="assembly-filters" hidden>
    <h2>Filtri assemblaggi</h2>
    <label>Cerca assemblato o pezzo<input id="search" type="search" placeholder="Codice, profilo, materiale"></label>
    <label>Materiale assemblato<select id="material"><option value="">Tutti</option></select></label>
    <button class="btn" id="reset">Azzera filtri</button>
  </aside>
  <main>
    <section class="workbench">
      <div class="heading"><div><h1>QR assemblaggi</h1><p>Apri un assemblato per vedere il QR e i pezzi che lo compongono.</p></div>
        <div class="actions"><button class="btn filter-arrow" id="filters-toggle" aria-controls="assembly-filters" aria-expanded="false">&#9654; Filtri</button><button class="btn" id="scanner-open">Lista scanner</button><button class="btn primary" id="print-open">Stampa QR</button><button class="btn" id="reload" aria-label="Aggiorna elenco">&#8635;</button></div>
      </div>
      <div class="selection"><span id="selection-count" role="status">Caricamento...</span><div class="actions"><button class="btn" id="select-all">Seleziona tutti i filtrati</button><button class="btn" id="clear">Deseleziona</button></div></div>
      <div class="rows" id="rows" aria-live="polite"></div>
      <footer><span id="count"></span><div class="actions"><label for="page-size">Assemblati per pagina</label><select id="page-size"><option>20</option><option>50</option><option>100</option></select><button class="btn" id="previous">Indietro</button><span id="page-count"></span><button class="btn" id="next">Avanti</button></div></footer>
    </section>
  </main>
</div>
<dialog id="print-drawer" aria-labelledby="print-title"><div class="drawer-head"><h2 id="print-title">Stampa QR assemblaggi</h2><button class="btn" id="print-close">Chiudi &times;</button></div><p id="print-message"></p><iframe id="print-frame" title="Configurazione e anteprima stampa QR"></iframe></dialog>
<script src="/static/phase-scanners.js?v=3"></script>
<script src="/static/assemblaggi-register.js?v=3"></script>
</body></html>
