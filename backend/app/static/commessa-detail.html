<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Commessa · MCC</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #fff; }

    /* ── Nav ── */
    .nav {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 10px;
      padding: 0 40px; height: 62px;
      background: rgba(8,15,31,0.96); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .nav-back {
      display: flex; align-items: center; gap: 7px;
      font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.45);
      cursor: pointer; padding: 6px 11px; border-radius: 8px;
      transition: background .2s, color .2s; text-decoration: none;
    }
    .nav-back:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.9); }
    .nav-sep { color: rgba(255,255,255,0.15); font-size: 16px; }
    .nav-crumb {
      font-size: 13px; color: rgba(255,255,255,0.4); text-decoration: none;
      padding: 5px 8px; border-radius: 6px; transition: background .2s, color .2s;
    }
    .nav-crumb:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.75); }
    .nav-title { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.75); }

    /* ── Page ── */
    .page { padding: 44px 40px 80px; max-width: 1100px; margin: 0 auto; }

    /* ── Header card ── */
    .hdr-card {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px; padding: 32px 36px; margin-bottom: 28px;
    }
    .hdr-top {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 20px; flex-wrap: wrap; margin-bottom: 22px;
    }
    .hdr-left { flex: 1; min-width: 0; }
    .hdr-eyebrow {
      font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.25);
      text-transform: uppercase; letter-spacing: .14em; margin-bottom: 8px;
    }
    .hdr-codice {
      font-size: 36px; font-weight: 900; color: #fff;
      letter-spacing: -.04em; line-height: 1; margin-bottom: 6px;
    }
    .hdr-cliente { font-size: 15px; color: rgba(255,255,255,0.45); }
    .hdr-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex-shrink: 0; }

    /* ── Semaphore ── */
    .semaforo {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 14px; border-radius: 20px;
      font-size: 12px; font-weight: 700; letter-spacing: .04em;
    }
    .sem-green  { background: rgba(74,222,128,.1);  border: 1px solid rgba(74,222,128,.22);  color: #4ade80; }
    .sem-yellow { background: rgba(251,191,36,.1);  border: 1px solid rgba(251,191,36,.22);  color: #fbbf24; }
    .sem-red    { background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.22); color: #f87171; }
    .sem-grey   { background: rgba(148,163,184,.08);border: 1px solid rgba(148,163,184,.18); color: #94a3b8; }

    /* ── Badge ── */
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 13px; border-radius: 20px;
      font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    }
    .badge-dot { width: 7px; height: 7px; border-radius: 50%; }
    .badge-aperta  { background: rgba(74,222,128,.12);  border: 1px solid rgba(74,222,128,.25);  color: #4ade80; }
    .badge-sospesa { background: rgba(251,191,36,.12);  border: 1px solid rgba(251,191,36,.25);  color: #fbbf24; }
    .badge-chiusa  { background: rgba(148,163,184,.1);  border: 1px solid rgba(148,163,184,.2);  color: #94a3b8; }

    /* ── Date chips ── */
    .dates-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
    .date-chip {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 7px 13px; border-radius: 10px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
    }
    .date-chip-lbl {
      font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.28);
      text-transform: uppercase; letter-spacing: .06em;
    }
    .date-chip-val { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.82); font-variant-numeric: tabular-nums; }
    .date-chip-val.late { color: #f87171; }

    /* ── Status buttons ── */
    .status-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .status-btn {
      padding: 7px 18px; border-radius: 9px; font-size: 12px; font-weight: 700;
      cursor: pointer; border: 1px solid; transition: all .2s;
    }
    .status-btn:disabled { opacity: 0.38; cursor: default; }
    .sb-aperta  { background: rgba(74,222,128,.07);  border-color: rgba(74,222,128,.2);  color: #4ade80; }
    .sb-aperta:not(:disabled):hover  { background: rgba(74,222,128,.16); }
    .sb-sospesa { background: rgba(251,191,36,.07);  border-color: rgba(251,191,36,.2);  color: #fbbf24; }
    .sb-sospesa:not(:disabled):hover { background: rgba(251,191,36,.16); }
    .sb-chiusa  { background: rgba(148,163,184,.06); border-color: rgba(148,163,184,.18); color: #94a3b8; }
    .sb-chiusa:not(:disabled):hover  { background: rgba(148,163,184,.13); }

    /* ── Notes ── */
    .notes-box {
      padding: 16px 20px; border-radius: 12px; margin-bottom: 28px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
      font-size: 13px; color: rgba(255,255,255,0.5); line-height: 1.6; white-space: pre-wrap;
    }

    /* ── Section ── */
    .sec { margin-bottom: 40px; }

    /* ── Operazioni ── */
    .op-gruppi { display: flex; flex-direction: column; gap: 28px; }
    .op-gruppo-nome {
      font-size: 11px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .1em; color: rgba(255,255,255,.35); margin-bottom: 10px;
    }
    .op-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 14px; border-radius: 10px;
      background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06);
      font-size: 13px; color: rgba(255,255,255,.72); gap: 12px;
    }
    .op-row-nome { flex: 1; font-weight: 600; }
    .op-count {
      font-size: 11px; font-weight: 700; font-family: monospace;
      padding: 2px 9px; border-radius: 10px;
      background: rgba(255,255,255,.07); color: rgba(255,255,255,.5);
    }
    .op-count.has-pezzi { background: rgba(59,130,246,.15); color: #93c5fd; }
    .op-tag-laser  { font-size: 10px; padding: 2px 7px; border-radius: 8px; background: rgba(168,85,247,.15); color: #d8b4fe; font-weight: 700; }
    .op-tag-std    { font-size: 10px; padding: 2px 7px; border-radius: 8px; background: rgba(34,197,94,.12);  color: #86efac; font-weight: 700; }
    .op-stato { font-size: 11px; color: rgba(255,255,255,.28); }
    .btn-avvia-prod {
      margin-top: 40px; padding-top: 28px;
      border-top: 1px solid rgba(255,255,255,.07);
      display: flex; justify-content: flex-end;
    }
    .btn-avvia-prod button {
      padding: 14px 36px; border-radius: 14px; border: none;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 24px rgba(59,130,246,.35); transition: opacity .2s, transform .15s;
    }
    .btn-avvia-prod button:hover  { opacity: .88; transform: translateY(-1px); }
    .btn-avvia-prod button:active { transform: translateY(0); }
    .sec-hdr { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .sec-icon {
      width: 32px; height: 32px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .sec-icon-blue   { background: rgba(59,130,246,.15); }
    .sec-icon-purple { background: rgba(168,85,247,.15); }
    .sec-icon-amber  { background: rgba(245,158,11,.15); }
    .sec-title { font-size: 15px; font-weight: 800; color: rgba(255,255,255,0.85); }
    .sec-sub   { font-size: 11px; color: rgba(255,255,255,0.28); margin-top: 2px; }

    /* ── Fasi verticali ── */
    .fase-list { display: flex; flex-direction: column; }

    .fase-seq-arrow {
      display: flex; align-items: center; justify-content: center; height: 24px;
      color: rgba(255,255,255,0.1); font-size: 14px; user-select: none; pointer-events: none;
    }

    .fase-item {
      display: flex; border-radius: 14px; overflow: hidden;
      background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.07);
      cursor: pointer; user-select: none;
      transition: border-color .18s, background .18s, box-shadow .18s;
    }
    .fase-item:hover { border-color: rgba(255,255,255,0.13); background: rgba(255,255,255,0.035); }
    .fase-item-in-corso {
      background: rgba(29,111,174,0.05); border-color: rgba(29,111,174,0.22);
      box-shadow: 0 4px 28px rgba(29,111,174,0.08);
    }
    .fase-item-in-corso:hover { border-color: rgba(29,111,174,0.4); background: rgba(29,111,174,0.07); }

    .fi-bar { width: 4px; flex-shrink: 0; }
    .fib-da-iniziare { background: #4B5563; }
    .fib-in-corso    { background: #1D6FAE; }
    .fib-completata  { background: #1A7A4A; }
    .fib-warning     { background: #B45309; }

    .fi-content { flex: 1; min-width: 0; padding: 20px 24px; }

    .fi-hdr { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .fi-left { flex: 1; min-width: 0; }
    .fi-seq {
      font-size: 10px; font-weight: 700; font-family: monospace;
      color: rgba(255,255,255,0.22); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 5px;
    }
    .fi-name { font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.9); line-height: 1.2; margin-bottom: 7px; }
    .fi-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: rgba(255,255,255,0.35); }
    .fi-chips { display: flex; gap: 5px; flex-wrap: wrap; }
    .fi-chip {
      display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 20px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.09);
      font-size: 10px; font-family: monospace; font-weight: 600; color: rgba(255,255,255,0.45);
    }
    .fi-right { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 7px; padding-top: 2px; }
    .fi-status { display: inline-flex; align-items: center; gap: 6px; }
    .fi-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .fi-status-label { font-size: 11px; font-weight: 700; letter-spacing: .04em; }
    .fis-da-iniziare .fi-dot { background: #4B5563; }
    .fis-da-iniziare .fi-status-label { color: #9CA3AF; }
    .fis-in-corso .fi-dot    { background: #1D6FAE; }
    .fis-in-corso .fi-status-label    { color: #60a5fa; }
    .fis-completata .fi-dot  { background: #1A7A4A; }
    .fis-completata .fi-status-label  { color: #4ade80; }
    .fis-warning .fi-dot     { background: #B45309; }
    .fis-warning .fi-status-label     { color: #fb923c; }
    .fi-time { font-size: 11px; font-family: monospace; color: rgba(255,255,255,0.22); }

    .fi-body {
      display: none; margin-top: 16px; padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .fase-item.fi-open .fi-body { display: block; }

    .fi-tbl-hdr {
      display: grid; grid-template-columns: 100px 1fr 56px 72px 56px;
      padding: 4px 8px 7px; gap: 8px;
      font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.2);
      text-transform: uppercase; letter-spacing: .08em;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .fi-tbl-row {
      display: grid; grid-template-columns: 100px 1fr 56px 72px 56px;
      padding: 7px 8px; gap: 8px; font-size: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .fi-tbl-row.fi-row-alt { background: rgba(255,255,255,0.018); }
    .fi-tbl-row:last-of-type { border-bottom: none; }
    .fi-extra-rows .fi-tbl-row:last-of-type { border-bottom: none; }
    .c-marca  { font-family: monospace; font-weight: 700; font-size: 11px; color: rgba(255,255,255,0.78); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .c-profilo { color: rgba(255,255,255,0.45); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .c-qty  { font-family: monospace; font-weight: 700; color: rgba(255,255,255,0.72); text-align: right; }
    .c-min  { font-family: monospace; color: rgba(255,255,255,0.2); text-align: right; }
    .c-real { font-family: monospace; color: rgba(255,255,255,0.2); text-align: right; }
    .c-qr   { display: flex; align-items: center; justify-content: center; }
    .qr-yes {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 2px 6px; border-radius: 5px;
      background: rgba(26,122,74,0.2); border: 1px solid rgba(26,122,74,0.4);
      font-size: 9px; font-weight: 700; color: #4ade80; white-space: nowrap;
    }
    .qr-no {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 2px 6px; border-radius: 5px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.22); white-space: nowrap;
    }

    .fi-extra-rows { display: none; }
    .fi-extra-rows.visible { display: contents; }
    .fi-more-btn {
      width: 100%; margin-top: 6px; padding: 7px 0;
      background: none; border: 1px dashed rgba(255,255,255,0.09);
      border-radius: 8px; color: rgba(255,255,255,0.3);
      font-size: 11px; cursor: pointer; transition: all .15s; text-align: center;
    }
    .fi-more-btn:hover { border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.6); }

    /* ── Parallel step ── */
    .fase-parallel-label {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 0 2px;
    }
    .fase-parallel-label span {
      font-size: 10px; font-weight: 700; color: rgba(255,255,255,.22);
      text-transform: uppercase; letter-spacing: .1em;
      padding: 2px 8px; border-radius: 4px;
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06);
    }
    .fase-parallel-cards {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px;
    }

    /* ── Daily progress ── */
    .fi-section-title {
      font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
      color: rgba(255,255,255,.2); margin-bottom: 10px;
    }
    .fi-daily { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,.06); }
    .fi-daily-cols { display: flex; gap: 8px; }
    .fi-day {
      flex: 1; text-align: center; padding: 8px 4px; border-radius: 8px;
      background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06);
    }
    .fi-day-today { border-color: rgba(37,99,235,.4); background: rgba(37,99,235,.08); }
    .fi-day-label { font-size: 9px; color: rgba(255,255,255,.28); margin-bottom: 5px; line-height: 1.3; }
    .fi-day-today .fi-day-label { color: #93c5fd; }
    .fi-day-val { font-size: 16px; font-weight: 700; font-family: monospace; color: rgba(255,255,255,.4); }
    .fi-day-today .fi-day-val { color: #60a5fa; }

    .fi-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 12px; padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.05); gap: 12px;
    }
    .fi-footer-totals { font-size: 11px; font-family: monospace; color: rgba(255,255,255,0.28); }
    .fi-footer-totals strong { color: rgba(255,255,255,0.55); font-weight: 700; }
    .fi-status-sel {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.62); border-radius: 7px;
      font-size: 11px; font-weight: 600; padding: 5px 10px; cursor: pointer;
    }
    .fi-status-sel:focus { outline: none; border-color: rgba(29,111,174,.45); }

    /* ── Empty card ── */
    .empty-card {
      padding: 52px 20px; text-align: center;
      background: rgba(255,255,255,0.02); border: 1px dashed rgba(255,255,255,0.08);
      border-radius: 16px;
    }
    .empty-icon  { font-size: 32px; margin-bottom: 12px; opacity: .35; }
    .empty-title { font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.28); margin-bottom: 6px; }
    .empty-desc  { font-size: 12px; color: rgba(255,255,255,0.18); line-height: 1.6; max-width: 360px; margin: 0 auto; }

    /* ── Material tabs ── */
    .mat-tabs {
      display: flex; gap: 4px; margin-bottom: 14px;
      background: rgba(255,255,255,0.04); border-radius: 12px; padding: 4px;
    }
    .mat-tab {
      flex: 1; padding: 8px 10px; border-radius: 9px;
      font-size: 12px; font-weight: 700; text-align: center;
      cursor: pointer; border: none; background: transparent;
      color: rgba(255,255,255,0.32); transition: all .18s;
    }
    .mat-tab.active { background: rgba(255,255,255,0.09); color: rgba(255,255,255,0.82); }
    .mat-panel { display: none; }
    .mat-panel.active { display: block; }

    /* ── Material rows ── */
    .mat-row-wrap {
      background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; overflow: hidden;
    }
    .mat-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); gap: 12px;
    }
    .mat-row:last-child { border-bottom: none; }
    .mat-name { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.75); }
    .mat-meta { font-size: 11px; color: rgba(255,255,255,0.28); margin-top: 2px; font-family: monospace; }
    .mat-qty  { font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.85); text-align: right; font-variant-numeric: tabular-nums; }
    .mat-qty-sub { font-size: 10px; color: rgba(255,255,255,0.28); text-align: right; margin-top: 2px; }

    /* ── Sfrido notice ── */
    .sfrido-notice {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; margin-bottom: 12px;
      background: rgba(251,191,36,.06); border: 1px solid rgba(251,191,36,.15);
      border-radius: 10px; font-size: 11px; color: rgba(251,191,36,.7); line-height: 1.5;
    }
    .sfrido-total {
      text-align: right; font-size: 12px; font-family: monospace;
      color: rgba(251,191,36,.5); margin-top: 10px;
    }

    /* ── Empty row ── */
    .empty-row { padding: 32px 20px; text-align: center; font-size: 13px; color: rgba(255,255,255,0.22); }

    /* ── Production view tabs ── */
    .prod-tabs { display: flex; gap: 3px; background: rgba(255,255,255,0.04); border-radius: 10px; padding: 3px; }
    .prod-tab {
      padding: 6px 16px; border-radius: 7px; border: none;
      font-size: 12px; font-weight: 700; cursor: pointer;
      color: rgba(255,255,255,0.32); background: transparent; transition: all .18s;
    }
    .prod-tab.active { background: rgba(255,255,255,0.09); color: rgba(255,255,255,0.82); }

    /* ── Pezzi search ── */
    .pz-search-wrap { margin-bottom: 14px; }
    .pz-search-input {
      width: 100%; padding: 10px 14px; border-radius: 10px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09);
      color: #fff; font-size: 13px; outline: none; transition: border-color .15s;
    }
    .pz-search-input::placeholder { color: rgba(255,255,255,0.22); }
    .pz-search-input:focus { border-color: rgba(59,130,246,0.4); }

    /* ── Pezzi list ── */
    .pz-list { display: flex; flex-direction: column; gap: 4px; }
    .pz-row {
      border-radius: 12px; overflow: hidden;
      background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.07);
      cursor: pointer; transition: border-color .15s, background .15s;
    }
    .pz-row:hover { border-color: rgba(255,255,255,0.12); background: rgba(255,255,255,0.035); }
    .pz-row.pz-open { border-color: rgba(59,130,246,0.25); background: rgba(29,78,138,0.07); }

    .pz-row-main { display: flex; align-items: center; }
    .pz-bar { width: 4px; flex-shrink: 0; align-self: stretch; min-height: 48px; }
    .pz-bar--attesa    { background: #4B5563; }
    .pz-bar--in-corso  { background: #1D6FAE; }
    .pz-bar--completata { background: #1A7A4A; }

    .pz-inner { flex: 1; display: flex; align-items: center; gap: 14px; padding: 13px 18px; min-width: 0; }
    .pz-marca { font-family: monospace; font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.88); flex-shrink: 0; }
    .pz-profilo { font-size: 12px; color: rgba(255,255,255,0.35); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pz-fase-badge {
      display: inline-flex; align-items: center; flex-shrink: 0;
      padding: 3px 9px; border-radius: 20px; font-size: 10px; font-weight: 700;
    }
    .pfb-attesa    { background: rgba(75,85,99,.18);   border: 1px solid rgba(75,85,99,.3);    color: #9CA3AF; }
    .pfb-in-corso  { background: rgba(29,111,174,.15); border: 1px solid rgba(29,111,174,.35); color: #60a5fa; }
    .pfb-completata { background: rgba(26,122,74,.15); border: 1px solid rgba(26,122,74,.35);  color: #4ade80; }
    .pz-qr-ico {
      flex-shrink: 0; font-size: 15px; opacity: .3; transition: opacity .15s;
    }
    .pz-qr-ico.has-qr { opacity: .75; color: #4ade80; }

    /* ── Pezzi expand ── */
    .pz-expand {
      display: none; padding: 20px 24px; gap: 24px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .pz-row.pz-open .pz-expand { display: flex; flex-wrap: wrap; }

    .pz-expand-qr { flex-shrink: 0; text-align: center; }
    .pz-qr-img {
      width: 128px; height: 128px; border-radius: 10px;
      background: #fff; display: block; image-rendering: pixelated;
    }
    .pz-qr-placeholder {
      width: 128px; height: 128px; border-radius: 10px;
      background: rgba(255,255,255,0.04); border: 2px dashed rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; color: rgba(255,255,255,0.15);
    }
    .pz-id-label { font-size: 10px; font-family: monospace; color: rgba(255,255,255,0.22); margin-top: 7px; }

    .pz-expand-info { flex: 1; min-width: 220px; }
    .pz-info-grid {
      display: grid; grid-template-columns: auto 1fr; gap: 5px 16px; margin-bottom: 18px; align-items: baseline;
    }
    .pz-info-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: rgba(255,255,255,0.22); white-space: nowrap; }
    .pz-info-val { font-size: 13px; color: rgba(255,255,255,0.7); }

    .pz-percorso-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: rgba(255,255,255,0.2); margin-bottom: 8px; }
    .pz-percorso-steps { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
    .pz-step-chip {
      display: inline-flex; align-items: center; padding: 4px 11px; border-radius: 20px;
      font-size: 11px; font-weight: 700;
    }
    .psc-completata { background: rgba(26,122,74,.2);   border: 1px solid rgba(26,122,74,.4);   color: #4ade80; }
    .psc-in-corso   { background: rgba(29,111,174,.2);  border: 1px solid rgba(29,111,174,.4);  color: #60a5fa; }
    .psc-sbloccata  { background: rgba(29,111,174,.08); border: 1px solid rgba(29,111,174,.18); color: rgba(96,165,250,.6); }
    .psc-bloccata   { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); color: rgba(255,255,255,.28); }
    .pz-step-arrow  { color: rgba(255,255,255,.15); font-size: 11px; }

    /* ── Loader ── */
    .loader {
      display: flex; align-items: center; justify-content: center;
      height: 280px; flex-direction: column; gap: 14px;
      color: rgba(255,255,255,0.3); font-size: 13px;
    }
    .spin {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.08); border-top-color: #3b82f6;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 28px; right: 28px;
      padding: 12px 20px; border-radius: 12px;
      font-size: 13px; font-weight: 600;
      background: #1e293b; border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      opacity: 0; transform: translateY(10px);
      transition: opacity .25s, transform .25s;
      pointer-events: none; z-index: 200;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.ok  { border-color: rgba(74,222,128,.3);  color: #4ade80; }
    .toast.err { border-color: rgba(248,113,113,.3); color: #f87171; }

    @media (max-width: 640px) {
      .nav { padding: 0 16px; }
      .page { padding: 24px 16px 60px; }
      .hdr-card { padding: 22px 20px; }
      .hdr-codice { font-size: 26px; }
    }
  </style>
</head>
<body>

<!-- Auth guard -->
<script>
(function() {
  const t = sessionStorage.getItem('stqc_token');
  const p = sessionStorage.getItem('stqc_profilo');
  if (!t) { window.location.replace('/login'); return; }
  if (!['Direttore','Progettazione','Admin'].includes(p)) { window.location.replace('/'); }
})();
</script>

<nav class="nav">
  <a class="nav-back" href="/" onclick="sessionStorage.removeItem('returnPanel')">← Home</a>
  <span class="nav-sep">/</span>
  <a class="nav-crumb" href="/commesse">In corso</a>
  <span class="nav-sep">/</span>
  <span class="nav-title" id="nav-codice">Caricamento…</span>
  <div style="margin-left:auto">
    <button onclick="logout()" style="padding:5px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.35);font-size:11px;font-weight:600;cursor:pointer;" onmouseover="this.style.color='#fca5a5';this.style.borderColor='rgba(248,113,113,0.3)'" onmouseout="this.style.color='rgba(255,255,255,0.35)';this.style.borderColor='rgba(255,255,255,0.1)'">Esci</button>
  </div>

<div class="page">
  <div id="root"><div class="loader"><div class="spin"></div>Caricamento commessa…</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const PROFILO = sessionStorage.getItem('stqc_profilo') || '';
function getAuth() { return 'Bearer ' + sessionStorage.getItem('stqc_token'); }
function logout() {
  sessionStorage.removeItem('stqc_token');
  sessionStorage.removeItem('stqc_profilo');
  sessionStorage.removeItem('stqc_nome');
  window.location.replace('/login');
}
const commessaId = parseInt(location.pathname.split('/').pop(), 10);

let _movements = [];
let _items     = [];
let _magazzino = [];
let _fasi      = [];
let _pezzi     = [];
let _commessa  = null;
let _prodView  = 'fasi';

/* ── Utils ── */
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(d) {
  if (!d) return '—';
  const [y, m, dd] = d.split('-');
  return `${dd}/${m}/${y}`;
}
function fmtDateTime(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('it-IT', { day:'2-digit', month:'2-digit', year:'numeric' })
    + ' ' + d.toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit' });
}
function daysTo(dateStr) {
  if (!dateStr) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((new Date(dateStr) - t) / 86400000);
}
function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} show`;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3200);
}

/* ── Tabs ── */
function showTab(id) {
  document.querySelectorAll('.mat-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === id));
  document.querySelectorAll('.mat-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + id));
}

/* ── Semaphore ── */
function getSemaphore(c) {
  if (c.status === 'SOSPESA') return { cls: 'sem-grey',   label: 'Sospesa' };
  if (c.status === 'CHIUSA')  return { cls: 'sem-grey',   label: 'Chiusa'  };
  if (c.status === 'IN_PRODUZIONE') {
    const days = daysTo(c.data_consegna_prevista);
    if (days === null) return { cls: 'sem-green',  label: 'In produzione' };
    if (days < 0)      return { cls: 'sem-red',    label: `In ritardo (${Math.abs(days)}gg)` };
    if (days <= 14)    return { cls: 'sem-yellow', label: `Produzione · warning (${days}gg)` };
    return { cls: 'sem-green', label: `In produzione (${days}gg)` };
  }
  if (c.status !== 'APERTA') return { cls: 'sem-grey', label: c.status };
  const days = daysTo(c.data_consegna_prevista);
  if (days === null) return { cls: 'sem-green', label: 'In schedule' };
  if (days < 0)      return { cls: 'sem-red',    label: `In ritardo (${Math.abs(days)}gg)` };
  if (days <= 14)    return { cls: 'sem-yellow', label: `Warning (${days}gg)` };
  return { cls: 'sem-green', label: `In schedule (${days}gg)` };
}

/* ── Badge ── */
function badgeHtml(status) {
  const map = {
    APERTA:        { cls: 'badge-aperta',  dot: '#4ade80', label: 'Aperta'        },
    IN_PRODUZIONE: { cls: 'badge-aperta',  dot: '#3b82f6', label: 'In produzione' },
    SOSPESA:       { cls: 'badge-sospesa', dot: '#fbbf24', label: 'Sospesa'       },
    CHIUSA:        { cls: 'badge-chiusa',  dot: '#94a3b8', label: 'Chiusa'        },
  };
  const b = map[status] || map.CHIUSA;
  return `<span class="badge ${b.cls}"><span class="badge-dot" style="background:${b.dot}"></span>${b.label}</span>`;
}

/* ── Find distinta items for this commessa ── */
function findDistintaItems(c, imports) {
  const codice = c.codice.toLowerCase();
  let items = [];

  // Primario: commessa_id (scritto da generate-qr)
  for (const imp of imports) {
    const byId = imp.items.filter(i => i.commessa_id === c.id);
    if (byId.length > 0) items = items.concat(byId);
  }
  if (items.length > 0) return items;

  // Fallback 1: commessa_reference (scritto da parse_distinta_file)
  for (const imp of imports) {
    const byRef = imp.items.filter(i => i.commessa_reference && i.commessa_reference.toLowerCase() === codice);
    if (byRef.length > 0) items = items.concat(byRef);
  }
  if (items.length > 0) return items;

  // Fallback 2: nome file importazione
  for (const imp of imports) {
    if (imp.filename.toLowerCase().includes(codice)) items = items.concat(imp.items);
  }
  return items;
}

/* ── Helpers ── */
function getLastWorkdays(n) {
  const result = [];
  const d = new Date(); d.setHours(0,0,0,0);
  while (result.length < n) {
    if (d.getDay() !== 0 && d.getDay() !== 6) result.unshift(new Date(d));
    d.setDate(d.getDate() - 1);
  }
  return result;
}

/* ── Section 1: Fasi ── */
function renderFasi(fasi) {
  if (!fasi || fasi.length === 0) {
    return `<div class="empty-card">
      <div class="empty-icon">📋</div>
      <div class="empty-title">Nessuna fase importata</div>
      <div class="empty-desc">Carica il file Fasi Operative in Nuova Commessa per visualizzare l'avanzamento produzione</div>
    </div>`;
  }

  const qrMap = new Map();
  for (const item of _items) {
    if (item.part_number) qrMap.set(item.part_number, item);
  }

  const faseGroups = new Map();
  for (const f of fasi) {
    const key = f.fase || 'Non specificata';
    if (!faseGroups.has(key)) faseGroups.set(key, []);
    faseGroups.get(key).push(f);
  }

  const secSub = document.querySelector('.sec-sub-fasi');
  if (secSub) secSub.textContent = `${fasi.length} righe · ${faseGroups.size} fasi`;

  const faseList = [];
  for (const [faseName, rows] of faseGroups) {
    const seqs = rows.map(r => r.sequenza).filter(v => v != null);
    const seq = seqs.length ? Math.min(...seqs) : 9999;
    const allStatuses = rows.map(r => r.status);
    let groupStatus = 'COMPLETATA';
    if (allStatuses.some(s => s === 'DA_INIZIARE')) groupStatus = 'DA_INIZIARE';
    else if (allStatuses.some(s => s === 'IN_CORSO')) groupStatus = 'IN_CORSO';
    faseList.push({ faseName, rows, seq, groupStatus });
  }
  faseList.sort((a, b) => a.seq - b.seq);

  const steps = [];
  const seqMap = new Map();
  for (const fe of faseList) {
    if (!seqMap.has(fe.seq)) { seqMap.set(fe.seq, []); steps.push(fe.seq); }
    seqMap.get(fe.seq).push(fe);
  }

  const workdays = getLastWorkdays(5);
  const todayStr = new Date().toISOString().slice(0, 10);
  let cardIdx = 0;
  let html = '<div class="fase-list">';
  let isFirst = true;

  for (const seq of steps) {
    const stepFases = seqMap.get(seq);
    const isParallel = stepFases.length > 1;

    if (!isFirst) html += '<div class="fase-seq-arrow">↓</div>';
    isFirst = false;

    if (isParallel) {
      html += `<div class="fase-step-parallel">
        <div class="fase-parallel-label"><span>in parallelo</span></div>
        <div class="fase-parallel-cards">`;
    }

    for (const fe of stepFases) {
      html += _renderFaseCard(fe, workdays, todayStr, qrMap, cardIdx++);
    }

    if (isParallel) html += '</div></div>';
  }

  html += '</div>';
  return html;
}

function _renderFaseCard(fe, workdays, todayStr, qrMap, idx) {
  const { faseName, rows, seq, groupStatus } = fe;
  const statusConf = {
    DA_INIZIARE: { barCls:'fib-da-iniziare', statusCls:'fis-da-iniziare', label:'Da iniziare' },
    IN_CORSO:    { barCls:'fib-in-corso',    statusCls:'fis-in-corso',    label:'In corso'   },
    COMPLETATA:  { barCls:'fib-completata',  statusCls:'fis-completata',  label:'Completata' },
    WARNING:     { barCls:'fib-warning',     statusCls:'fis-warning',     label:'Attenzione' },
  };
  const sc = statusConf[groupStatus] || statusConf.DA_INIZIARE;
  const isActive = groupStatus === 'IN_CORSO';
  const ids = rows.map(r => r.id);
  const totalQty = rows.reduce((s, r) => s + (r.quantita || 0), 0);
  const totalMin = rows.reduce((s, r) => s + (r.tempo_tot_min || 0), 0);
  const postazioni = [...new Set(rows.map(r => r.postazione).filter(Boolean))];
  const chipsHtml = postazioni.map(p => `<span class="fi-chip">${esc(p)}</span>`).join('');
  const seqLabel = seq !== 9999 ? `Seq. ${seq}` : '';
  const countLabel = `${rows.length} ${rows.length === 1 ? 'riga' : 'righe'}${totalQty > 0 ? ' · ' + Number(totalQty).toLocaleString('it-IT', {maximumFractionDigits:1}) + ' pz' : ''}`;
  const timeLabel = totalMin > 0 ? `${Number(totalMin).toLocaleString('it-IT', {maximumFractionDigits:0})} min prev.` : '— min prev.';

  const dailyCols = workdays.map(d => {
    const iso = d.toISOString().slice(0, 10);
    const isToday = iso === todayStr;
    const label = d.toLocaleDateString('it-IT', { weekday:'short', day:'2-digit', month:'2-digit' });
    return `<div class="fi-day${isToday ? ' fi-day-today' : ''}">
      <div class="fi-day-label">${esc(label)}</div>
      <div class="fi-day-val">—</div>
    </div>`;
  }).join('');
  const dailyHtml = `<div class="fi-daily">
    <div class="fi-section-title">Avanzamento giornaliero</div>
    <div class="fi-daily-cols">${dailyCols}</div>
  </div>`;

  const SHOW = 5;
  const extraId = `fex${idx}`;
  const btnId   = `fbn${idx}`;
  const rowHtml = (r, i) => {
    const item = qrMap.get(r.marca_pos);
    const hasQr = !!(item && item.qr_code);
    return `<div class="fi-tbl-row${i % 2 === 1 ? ' fi-row-alt' : ''}">
      <span class="c-marca">${esc(r.marca_pos || '—')}</span>
      <span class="c-profilo">${esc(r.profilo || '—')}</span>
      <span class="c-qty">${r.quantita != null ? Number(r.quantita).toLocaleString('it-IT', {maximumFractionDigits:1}) : '—'}</span>
      <span class="c-min">${r.tempo_prev_minpz != null ? Number(r.tempo_prev_minpz).toLocaleString('it-IT', {maximumFractionDigits:1}) : '—'}</span>
      <span class="c-qr">${hasQr ? '<span class="qr-yes">✓ QR</span>' : '<span class="qr-no">— QR</span>'}</span>
    </div>`;
  };
  const visibleHtml = rows.slice(0, SHOW).map(rowHtml).join('');
  const extraRows   = rows.slice(SHOW);
  const extraHtml   = extraRows.length
    ? `<div class="fi-extra-rows" id="${extraId}">${extraRows.map((r, i) => rowHtml(r, i + SHOW)).join('')}</div>
       <button class="fi-more-btn" id="${btnId}" onclick="event.stopPropagation();expandFaseRows('${extraId}','${btnId}')">+ altri ${extraRows.length} pezzi</button>`
    : '';
  const pezziHtml = `<div class="fi-pezzi">
    <div class="fi-section-title">Pezzi</div>
    <div class="fi-tbl-hdr">
      <span>Marca/Pos.</span><span>Profilo</span>
      <span style="text-align:right">Qtà</span>
      <span style="text-align:right">T. prev.</span>
      <span style="text-align:center">QR</span>
    </div>
    ${visibleHtml}${extraHtml}
  </div>`;

  const footerQty = totalQty > 0 ? `<strong>${Number(totalQty).toLocaleString('it-IT', {maximumFractionDigits:1})}</strong> pz` : '';
  const footerMin = totalMin > 0 ? `<strong>${Number(totalMin).toLocaleString('it-IT', {maximumFractionDigits:0})}</strong> min` : '';
  const footerTxt = [footerQty, footerMin].filter(Boolean).join(' · ');

  return `<div class="fase-item${isActive ? ' fase-item-in-corso' : ''}" onclick="toggleFaseCard(this)">
    <div class="fi-bar ${sc.barCls}"></div>
    <div class="fi-content">
      <div class="fi-hdr">
        <div class="fi-left">
          ${seqLabel ? `<div class="fi-seq">${esc(seqLabel)}</div>` : ''}
          <div class="fi-name">${esc(faseName)}</div>
          <div class="fi-meta">
            <span>${esc(countLabel)}</span>
            ${postazioni.length ? `<span class="fi-chips">${chipsHtml}</span>` : ''}
          </div>
        </div>
        <div class="fi-right">
          <div class="fi-status ${sc.statusCls}">
            <span class="fi-dot"></span>
            <span class="fi-status-label">${sc.label}</span>
          </div>
          <div class="fi-time">${timeLabel}</div>
        </div>
      </div>
      <div class="fi-body">
        ${dailyHtml}
        ${pezziHtml}
        <div class="fi-footer">
          <span class="fi-footer-totals">${footerTxt}</span>
          ${PROFILO !== 'Direttore' ? `
          <select class="fi-status-sel" onclick="event.stopPropagation()"
                  onchange="event.stopPropagation();setFaseGroupStatus(${JSON.stringify(ids)},this.value)">
            <option value="DA_INIZIARE" ${groupStatus==='DA_INIZIARE'?'selected':''}>Da iniziare</option>
            <option value="IN_CORSO"    ${groupStatus==='IN_CORSO'   ?'selected':''}>In corso</option>
            <option value="COMPLETATA"  ${groupStatus==='COMPLETATA' ?'selected':''}>Completata</option>
          </select>` : ''}
        </div>
      </div>
    </div>
  </div>`;
}

/* ── Main render ── */
function render(c, movements, items, magazzino, fasi) {
  document.getElementById('nav-codice').textContent = c.codice;
  document.title = `${c.codice} · MCC`;

  const sem = getSemaphore(c);
  const days = daysTo(c.data_consegna_prevista);
  const consegnaLate = days !== null && days < 0 && c.status === 'APERTA';

  const statusBtns = ['APERTA', 'SOSPESA', 'CHIUSA'].map(s => {
    const active = s === c.status;
    const cls = { APERTA:'sb-aperta', SOSPESA:'sb-sospesa', CHIUSA:'sb-chiusa' }[s];
    const lbl = { APERTA:'Aperta',    SOSPESA:'Sospesa',    CHIUSA:'Chiusa'    }[s];
    return `<button class="status-btn ${cls}" ${active ? 'disabled' : ''} onclick="changeStatus('${s}')">${active ? '✓ ' : ''}${lbl}</button>`;
  }).join('');

  const notesHtml = c.notes
    ? `<div class="notes-box">${esc(c.notes)}</div>`
    : '';

  const descrizioneChip = c.descrizione
    ? `<div class="date-chip"><span class="date-chip-lbl">Descrizione</span><span class="date-chip-val" style="font-size:12px">${esc(c.descrizione)}</span></div>`
    : '';

  document.getElementById('root').innerHTML = `

    <div class="hdr-card">
      <div class="hdr-top">
        <div class="hdr-left">
          <div class="hdr-eyebrow">Commessa in corso</div>
          <div class="hdr-codice">${esc(c.codice)}</div>
          <div class="hdr-cliente">${esc(c.cliente || 'Cliente non specificato')}</div>
        </div>
        <div class="hdr-right">
          <span class="semaforo ${sem.cls}">${sem.label}</span>
          ${badgeHtml(c.status)}
        </div>
      </div>

      <div class="dates-row">
        <div class="date-chip">
          <span class="date-chip-lbl">Inizio</span>
          <span class="date-chip-val">${fmtDate(c.data_inizio)}</span>
        </div>
        <div class="date-chip">
          <span class="date-chip-lbl">Consegna prevista</span>
          <span class="date-chip-val ${consegnaLate ? 'late' : ''}">${fmtDate(c.data_consegna_prevista)}</span>
        </div>
        ${descrizioneChip}
      </div>

      <div class="status-row">${statusBtns}</div>
    </div>

    ${notesHtml}

    ${renderOperazioni(c, items)}

  `;
  if (_prodView === 'pezzi') switchProdView('pezzi');
}

/* ── Operazioni — vista fissa per stato commessa ── */
function renderOperazioni(c, items) {
  const isAperta = c.status === 'APERTA';

  // Conta pezzi LAMIERA e non-LAMIERA dalla distinta
  const nLamiera = items.filter(i => /^PL/i.test(i.description || '')).length;
  const nStd     = items.filter(i => i.description && !/^PL/i.test(i.description)).length;

  function opRow(nome, n, tag) {
    const countCls = n > 0 ? 'has-pezzi' : '';
    const countLbl = n > 0 ? `${n} pz` : '—';
    const tagHtml  = tag ? `<span class="${tag === 'laser' ? 'op-tag-laser' : 'op-tag-std'}">${tag === 'laser' ? 'Lamiera' : 'Profilati'}</span>` : '';
    const stato    = isAperta ? '' : `<span class="op-stato">In attesa</span>`;
    return `<div class="op-row">
      <span class="op-row-nome">${nome}</span>
      ${tagHtml}
      ${stato}
      <span class="op-count ${countCls}">${countLbl}</span>
    </div>`;
  }

  const gruppi = [
    {
      nome: '🔧 Officina',
      rows: [
        ...(nLamiera > 0 ? [opRow('Taglio Laser', nLamiera, 'laser')] : []),
        opRow('Taglio Standard', nStd, nStd > 0 ? 'std' : null),
        opRow('Forature', 0),
        opRow('Puntature', 0),
        opRow('Saldature Finali / Assemblaggio', 0),
      ],
    },
    {
      nome: '🎨 Preparazione Esterno',
      rows: [
        opRow('Verniciatura', 0),
        opRow('Zincatura', 0),
      ],
    },
    {
      nome: '🏗️ Cantiere',
      rows: [
        opRow('Consegna cantiere', 0),
      ],
    },
  ];

  const gruppiHtml = gruppi.map(g => `
    <div>
      <div class="op-gruppo-nome">${g.nome}</div>
      ${g.rows.join('')}
    </div>`).join('');

  const avviaBtn = isAperta ? `
    <div class="btn-avvia-prod">
      <button id="btn-avvia" onclick="avviaProduzioneNew()">🚀 Avvia produzione</button>
    </div>` : '';

  return `
    <div class="sec">
      <div class="sec-hdr">
        <div class="sec-icon sec-icon-blue">🔩</div>
        <div>
          <div class="sec-title">Operazioni</div>
          <div class="sec-sub">${isAperta ? 'Piano di produzione' : 'Avanzamento in tempo reale'}</div>
        </div>
      </div>
      <div class="op-gruppi">${gruppiHtml}</div>
      ${avviaBtn}
    </div>`;
}

/* ── Avvia produzione (nuovo — solo PATCH status) ── */
async function avviaProduzioneNew() {
  const btn = document.getElementById('btn-avvia');
  if (btn) { btn.disabled = true; btn.textContent = '…avvio in corso'; }
  try {
    const res = await fetch(`/api/v1/commesse/${commessaId}`, {
      method:  'PATCH',
      headers: { Authorization: getAuth(), 'Content-Type': 'application/json' },
      body:    JSON.stringify({ status: 'IN_PRODUZIONE' }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `HTTP ${res.status}`);
    }
    toast('Produzione avviata', 'ok');
    location.reload();
  } catch (e) {
    toast(`Errore: ${e.message}`, 'err');
    if (btn) { btn.disabled = false; btn.textContent = '🚀 Avvia produzione'; }
  }
}

/* ── Change status ── */
async function changeStatus(newStatus) {
  try {
    const res = await fetch(`/api/v1/commesse/${commessaId}`, {
      method: 'PATCH',
      headers: { Authorization: getAuth(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: newStatus }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const updated = await res.json();
    toast(`Stato aggiornato → ${newStatus}`, 'ok');
    render(updated, _movements, _items, _magazzino, _fasi);
  } catch (e) {
    toast(`Errore: ${e.message}`, 'err');
  }
}

/* ── Avvia Produzione ── */
async function avviaProduzione() {
  const btn = document.getElementById('btn-avvia');
  if (btn) { btn.disabled = true; btn.textContent = '…Avvio in corso'; }
  try {
    const res = await fetch(`/api/v1/commesse/${commessaId}/avvia-produzione`, {
      method: 'POST',
      headers: { Authorization: getAuth() },
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || res.statusText);
    }
    const data = await res.json();
    toast(
      `Produzione avviata · ${data.percorsi_creati} percorsi` +
      (data.operatori_sbloccati ? ` · ${data.operatori_sbloccati} operatori sbloccati` : ''),
      'ok'
    );
    const [cRes, pzRes] = await Promise.all([
      fetch(`/api/v1/commesse/${commessaId}`, { headers: { Authorization: getAuth() } }),
      fetch(`/api/v1/commesse/${commessaId}/pezzi`, { headers: { Authorization: getAuth() } }),
    ]);
    const c = await cRes.json();
    _commessa = c;
    _pezzi = pzRes.ok ? await pzRes.json() : [];
    _prodView = 'pezzi';
    render(c, _movements, _items, _magazzino, _fasi);
  } catch(e) {
    toast(`Errore: ${e.message}`, 'err');
    if (btn) { btn.disabled = false; btn.textContent = '🚀 Avvia Produzione'; }
  }
}

/* ── Fase status update ── */
async function setFaseGroupStatus(ids, newStatus) {
  try {
    await Promise.all(ids.map(id =>
      fetch(`/api/v1/commesse/${commessaId}/fasi/${id}`, {
        method: 'PATCH',
        headers: { Authorization: getAuth(), 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus }),
      })
    ));
    const fRes = await fetch(`/api/v1/commesse/${commessaId}/fasi`, { headers: { Authorization: getAuth() } });
    _fasi = fRes.ok ? await fRes.json() : _fasi;
    const cont = document.getElementById('fasi-content');
    if (cont) cont.innerHTML = renderFasi(_fasi);
    toast('Stato fase aggiornato', 'ok');
  } catch (e) {
    toast(`Errore: ${e.message}`, 'err');
  }
}

function toggleFaseCard(el) {
  const wasOpen = el.classList.contains('fi-open');
  document.querySelectorAll('.fase-item.fi-open').forEach(c => c.classList.remove('fi-open'));
  if (!wasOpen) el.classList.add('fi-open');
}

function expandFaseRows(extraId, btnId) {
  document.getElementById(extraId).classList.add('visible');
  document.getElementById(btnId).style.display = 'none';
}

/* ── Production view tab switch ── */
function switchProdView(view) {
  _prodView = view;
  document.querySelectorAll('.prod-tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
  const vf = document.getElementById('view-fasi');
  const vp = document.getElementById('view-pezzi');
  const qrBtn = document.getElementById('btn-qr-refresh');
  if (vf) vf.style.display = view === 'fasi'  ? '' : 'none';
  if (vp) vp.style.display = view === 'pezzi' ? '' : 'none';
  if (qrBtn) qrBtn.style.display = view === 'fasi' ? '' : 'none';
}

/* ── Pezzi view ── */
function renderPezziRows(pezzi, q) {
  if (!pezzi || pezzi.length === 0) {
    const notStarted = !_commessa || _commessa.status !== 'IN_PRODUZIONE';
    return `<div class="empty-card">
      <div class="empty-icon">🔩</div>
      <div class="empty-title">${notStarted ? 'Produzione non ancora avviata' : 'Nessun pezzo registrato'}</div>
      <div class="empty-desc">${notStarted ? 'Avvia la produzione per visualizzare i pezzi fisici e il loro percorso.' : 'Nessun pezzo fisico trovato per questa commessa.'}</div>
    </div>`;
  }
  const qLow = (q || '').toLowerCase().trim();
  const list = qLow ? pezzi.filter(p => (p.marca_pos || '').toLowerCase().includes(qLow)) : pezzi;
  if (list.length === 0) return '<div class="empty-row">Nessun pezzo corrisponde alla ricerca.</div>';
  return list.map(p => renderPezzoRow(p)).join('');
}

function renderPezzoRow(p) {
  const BAR = { BLOCCATA:'pz-bar--attesa', SBLOCCATA:'pz-bar--attesa', IN_CORSO:'pz-bar--in-corso', COMPLETATA:'pz-bar--completata' };
  const BADGE = { BLOCCATA:'pfb-attesa', SBLOCCATA:'pfb-attesa', IN_CORSO:'pfb-in-corso', COMPLETATA:'pfb-completata' };
  const CHIP = { COMPLETATA:'psc-completata', IN_CORSO:'psc-in-corso', SBLOCCATA:'psc-sbloccata', BLOCCATA:'psc-bloccata' };

  const st = p.stato_corrente || 'BLOCCATA';
  const barCls   = BAR[st]   || 'pz-bar--attesa';
  const badgeCls = BADGE[st] || 'pfb-attesa';
  const badgeLabel = st === 'COMPLETATA' ? 'Completato'
                   : st === 'IN_CORSO'   ? 'In corso'
                   : (p.fase_corrente || 'Attesa');

  const marcaHtml = `${esc(p.marca_pos || '—')}${p.instance_number != null ? `<span style="opacity:.4"> #${p.instance_number}</span>` : ''}`;
  const hasQr = !!p.qr_code;

  const percorsoHtml = (p.percorso || []).map((step, i) => {
    const arrow = i < p.percorso.length - 1 ? '<span class="pz-step-arrow">→</span>' : '';
    return `<span class="pz-step-chip ${CHIP[step.stato] || 'psc-bloccata'}">${esc(step.fase_name || '—')}</span>${arrow}`;
  }).join('') || '<span style="color:rgba(255,255,255,.2);font-size:12px">Nessuna fase nel percorso</span>';

  const infoRows = [
    ['Marca/Pos.', `<span style="font-family:monospace;font-weight:700">${esc(p.marca_pos || '—')}</span>${p.instance_number != null ? `<span style="opacity:.4"> #${p.instance_number}</span>` : ''}`],
    ['Profilo',   esc(p.profilo || '—')],
    ['Commessa',  esc(_commessa ? _commessa.codice : '—')],
    ...(p.parent_assembly ? [['Assem. padre', esc(p.parent_assembly)]] : []),
  ].map(([l, v]) => `<span class="pz-info-lbl">${l}</span><span class="pz-info-val">${v}</span>`).join('');

  const qrHtml = hasQr
    ? `<img class="pz-qr-img" src="data:image/png;base64,${p.qr_code}" alt="QR"/>`
    : `<div class="pz-qr-placeholder">▣</div>`;

  return `<div class="pz-row" onclick="togglePezzo(this)">
    <div class="pz-row-main">
      <div class="pz-bar ${barCls}"></div>
      <div class="pz-inner">
        <span class="pz-marca">${marcaHtml}</span>
        <span class="pz-profilo">${esc(p.profilo || '—')}</span>
        <span class="pz-fase-badge ${badgeCls}">${esc(badgeLabel)}</span>
        <span class="pz-qr-ico ${hasQr ? 'has-qr' : ''}" title="${hasQr ? 'QR disponibile' : 'Nessun QR'}">▣</span>
      </div>
    </div>
    <div class="pz-expand">
      <div class="pz-expand-qr">
        ${qrHtml}
        ${p.item_id ? `<div class="pz-id-label">ID ${p.item_id}</div>` : ''}
      </div>
      <div class="pz-expand-info">
        <div class="pz-info-grid">${infoRows}</div>
        <div class="pz-percorso-title">Percorso fasi</div>
        <div class="pz-percorso-steps">${percorsoHtml}</div>
      </div>
    </div>
  </div>`;
}

function togglePezzo(el) {
  const wasOpen = el.classList.contains('pz-open');
  document.querySelectorAll('.pz-row.pz-open').forEach(r => r.classList.remove('pz-open'));
  if (!wasOpen) el.classList.add('pz-open');
}

function filterPezzi(q) {
  const cont = document.getElementById('pz-list');
  if (cont) cont.innerHTML = renderPezziRows(_pezzi, q);
}

/* ── Refresh QR badges senza reload pagina ── */
async function refreshQRBadges() {
  try {
    const dRes = await fetch('/api/v1/warehouse/distinta/imports?limit=200', { headers: { Authorization: getAuth() } });
    if (!dRes.ok) throw new Error(`HTTP ${dRes.status}`);
    const imports = await dRes.json();
    _items = findDistintaItems(_commessa, imports);
    const cont = document.getElementById('fasi-content');
    if (cont) cont.innerHTML = renderFasi(_fasi);
    const found = _items.filter(i => i.qr_code).length;
    toast(found > 0 ? `Badge QR aggiornati — ${found} QR presenti` : 'Badge QR aggiornati — nessun QR trovato', 'ok');
  } catch (e) {
    toast(`Errore aggiornamento QR: ${e.message}`, 'err');
  }
}

/* ── Load ── */
async function load() {
  try {
    const [cRes, dRes, magRes, fRes, pzRes] = await Promise.all([
      fetch(`/api/v1/commesse/${commessaId}`, { headers: { Authorization: getAuth() } }),
      fetch(`/api/v1/warehouse/distinta/imports?limit=200`, { headers: { Authorization: getAuth() } }),
      fetch(`/api/v1/warehouse/magazzino?limit=500`, { headers: { Authorization: getAuth() } }),
      fetch(`/api/v1/commesse/${commessaId}/fasi`, { headers: { Authorization: getAuth() } }),
      fetch(`/api/v1/commesse/${commessaId}/pezzi`, { headers: { Authorization: getAuth() } }),
    ]);
    if (!cRes.ok) throw new Error(cRes.status === 404 ? 'Commessa non trovata' : `HTTP ${cRes.status}`);
    const [c, imports, magazzino, fasi, pezzi] = await Promise.all([
      cRes.json(),
      dRes.ok ? dRes.json() : [],
      magRes.ok ? magRes.json() : [],
      fRes.ok ? fRes.json() : [],
      pzRes.ok ? pzRes.json() : [],
    ]);
    _movements = [];
    _magazzino = magazzino;
    _fasi      = fasi;
    _pezzi     = pezzi;
    _commessa  = c;
    _items     = findDistintaItems(c, imports);
    render(c, _movements, _items, _magazzino, _fasi);
  } catch (e) {
    document.getElementById('root').innerHTML = `
      <div class="loader" style="color:#f87171">
        <span style="font-size:28px">✕</span>
        ${esc(e.message)}
        <a href="/commesse" style="color:#3b82f6;font-size:13px;margin-top:8px">← Torna alla lista</a>
      </div>`;
  }
}

load();
</script>
