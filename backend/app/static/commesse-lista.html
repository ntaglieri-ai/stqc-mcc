<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Commesse in corso · MCC</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #fff; }

    /* ── Nav ── */
    .nav {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 12px;
      padding: 0 40px;
      height: 62px;
      background: rgba(8, 15, 31, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .nav-back {
      display: flex; align-items: center; gap: 7px;
      font-size: 13px; font-weight: 500;
      color: rgba(255,255,255,0.45);
      cursor: pointer; padding: 6px 11px; border-radius: 8px;
      transition: background .2s, color .2s; text-decoration: none;
    }
    .nav-back:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.9); }
    .nav-sep { color: rgba(255,255,255,0.15); font-size: 18px; }
    .nav-crumb { font-size: 13px; color: rgba(255,255,255,0.35); text-decoration: none; }
    a.nav-crumb { padding: 4px 8px; border-radius: 6px; transition: background .2s, color .2s; }
    a.nav-crumb:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.7); }
    .nav-title { font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.75); }
    .nav-actions { margin-left: auto; }
    .btn-new {
      display: flex; align-items: center; gap: 7px;
      padding: 8px 18px;
      background: #2563eb;
      color: #fff; border: none; border-radius: 10px;
      font-size: 13px; font-weight: 700;
      cursor: pointer; text-decoration: none;
      transition: background .2s, box-shadow .2s;
      box-shadow: 0 2px 12px rgba(37,99,235,.35);
    }
    .btn-new:hover { background: #1d4ed8; box-shadow: 0 4px 20px rgba(37,99,235,.5); }

    /* ── Page ── */
    .page { padding: 44px 40px 72px; max-width: 1280px; margin: 0 auto; }

    .page-header { margin-bottom: 36px; }
    .page-eyebrow {
      font-size: 11px; font-weight: 700;
      color: rgba(255,255,255,0.28); text-transform: uppercase; letter-spacing: .14em; margin-bottom: 7px;
    }
    .page-title { font-size: 30px; font-weight: 900; color: #fff; letter-spacing: -.03em; line-height: 1; }
    .page-sub { font-size: 14px; color: rgba(255,255,255,0.35); margin-top: 8px; }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }

    /* ── Commessa card ── */
    .comm-card {
      position: relative; height: 230px; border-radius: 18px;
      overflow: hidden; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.06);
      transition: transform .25s cubic-bezier(.4,0,.2,1), box-shadow .25s;
    }
    .comm-card:hover { transform: translateY(-4px) scale(1.01); box-shadow: 0 28px 70px rgba(0,0,0,0.6); }
    .comm-card:hover .c-bg { transform: scale(1.07); filter: brightness(1.1); }
    .comm-card:hover .c-overlay { opacity: 0.5; }
    .comm-card:hover .c-arrow { opacity: 1; transform: translateX(0); }
    .comm-card:active { transform: scale(0.985); }

    .c-bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      transition: transform .5s cubic-bezier(.4,0,.2,1), filter .3s;
    }
    .c-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.93) 0%, rgba(0,0,0,0.52) 50%, rgba(0,0,0,0.18) 100%);
      opacity: 0.82; transition: opacity .25s;
    }
    .c-body {
      position: relative; z-index: 2;
      height: 100%; display: flex; flex-direction: column; justify-content: flex-end;
      padding: 20px 22px 22px;
    }
    .c-arrow {
      position: absolute; top: 18px; right: 18px;
      width: 30px; height: 30px; border-radius: 50%;
      background: rgba(255,255,255,0.13); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.9); font-size: 14px;
      opacity: 0; transform: translateX(-7px); transition: all .22s;
    }
    .c-codice {
      font-size: 19px; font-weight: 900; color: #fff;
      letter-spacing: -.025em; line-height: 1.15; margin-bottom: 3px;
    }
    .c-desc {
      font-size: 12px; color: rgba(255,255,255,0.45);
      margin-bottom: 12px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .c-semaforo { display: flex; align-items: center; gap: 7px; margin-bottom: 9px; }
    .sem-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .sem-label { font-size: 12px; font-weight: 700; letter-spacing: .01em; }
    .c-progress-track { height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; }
    .c-progress-fill { height: 100%; border-radius: 2px; transition: width .7s ease; }
    .c-progress-pct { font-size: 10px; color: rgba(255,255,255,0.3); margin-top: 5px; font-weight: 600; letter-spacing: .02em; }

    .c-status-badge {
      position: absolute; top: 16px; left: 16px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
      backdrop-filter: blur(4px);
    }
    .c-delete {
      position: absolute; top: 14px; right: 14px;
      width: 27px; height: 27px; border-radius: 50%;
      border: 1px solid rgba(248,113,113,.25);
      background: rgba(0,0,0,.4);
      backdrop-filter: blur(6px);
      color: rgba(248,113,113,.5);
      font-size: 13px; font-weight: 400; line-height: 1;
      cursor: pointer; z-index: 4;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .2s, background .2s, color .2s, transform .15s;
    }
    .comm-card:hover .c-delete { opacity: 1; }
    .c-delete:hover { background: rgba(220,38,38,.6); border-color: #f87171; color: #fff; transform: scale(1.12); }

    /* ── States ── */
    .state-msg {
      grid-column: 1 / -1; padding: 80px 20px;
      text-align: center; color: rgba(255,255,255,0.28); font-size: 15px; line-height: 1.6;
    }
    .state-msg a { color: #3b82f6; text-decoration: underline; font-weight: 700; }

    /* ── Filter bar ── */
    .filter-bar {
      display: flex; align-items: center; gap: 10px; margin-bottom: 24px; flex-wrap: wrap;
    }
    .filter-chip {
      padding: 6px 16px; border-radius: 20px;
      font-size: 12px; font-weight: 600; cursor: pointer; border: none;
      transition: background .18s, color .18s;
    }
    .filter-chip.active { background: #2563eb; color: #fff; }
    .filter-chip:not(.active) { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5); }
    .filter-chip:not(.active):hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }
  </style>
</head>
<body>

<!-- Auth guard -->
<script>
(function() {
  const t = localStorage.getItem('stqc_token');
  const p = localStorage.getItem('stqc_profilo');
  if (!t) { window.location.replace('/login'); return; }
  if (!['Responsabile','Direttore','Admin'].includes(p)) { window.location.replace('/'); }
})();
</script>

<!-- NAV -->
<nav class="nav">
  <a class="nav-back" href="/" onclick="sessionStorage.removeItem('returnPanel')">← Home</a>
  <span class="nav-sep">/</span>
  <span class="nav-title">In corso</span>
  <div class="nav-actions" style="display:flex;align-items:center;gap:10px">
    <a class="btn-new" href="/commesse/nuova">+ Nuova commessa</a>
    <button onclick="logout()" style="padding:6px 13px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.35);font-size:11px;font-weight:600;cursor:pointer;" onmouseover="this.style.color='#fca5a5';this.style.borderColor='rgba(248,113,113,0.3)'" onmouseout="this.style.color='rgba(255,255,255,0.35)';this.style.borderColor='rgba(255,255,255,0.1)'">Esci</button>
  </div>
</nav>

<!-- CONTENT -->
<div class="page">

  <div class="page-header">
    <div class="page-eyebrow">Gestione Commesse</div>
    <div class="page-title">In corso</div>
    <div class="page-sub" id="page-sub">Caricamento…</div>
  </div>

  <!-- Filter bar -->
  <div class="filter-bar">
    <button class="filter-chip active" data-status="ALL" onclick="setFilter('ALL')">Tutte</button>
    <button class="filter-chip" data-status="APERTA" onclick="setFilter('APERTA')">Aperte</button>
    <button class="filter-chip" data-status="SOSPESA" onclick="setFilter('SOSPESA')">Sospese</button>
    <button class="filter-chip" data-status="CHIUSA" onclick="setFilter('CHIUSA')">Chiuse</button>
  </div>

  <div class="grid" id="comm-grid">
    <div class="state-msg">Caricamento commesse…</div>
  </div>

</div>

<script>
function getAuth() { return 'Bearer ' + localStorage.getItem('stqc_token'); }
function logout() {
  localStorage.removeItem('stqc_token');
  localStorage.removeItem('stqc_profilo');
  localStorage.removeItem('stqc_nome');
  window.location.replace('/login');
}

const BG_IMGS = [
  'photo-1504917595217-d4dc5ebe6122',
  'photo-1504328345606-18bbc8c9d7d1',
  'photo-1581091226825-a6a2a5aee158',
  'photo-1553413077-190dd305871c',
  'photo-1565372195458-9de0b320ef04',
  'photo-1558618666-fcd25c85cd64',
];

let allCommesse = [];
let currentFilter = 'ALL';

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getSemaforo(c) {
  if (c.status === 'CHIUSA')  return { color: '#9ca3af', glow: 'none',          label: 'Chiusa',      badge: 'rgba(156,163,175,.15)', badgeText: '#9ca3af' };
  if (c.status === 'SOSPESA') return { color: '#fbbf24', glow: '0 0 6px #fbbf24', label: 'Sospesa',   badge: 'rgba(251,191,36,.15)',  badgeText: '#fbbf24' };
  if (!c.data_consegna_prevista) return { color: '#4ade80', glow: '0 0 6px #4ade80', label: 'OK', badge: 'rgba(74,222,128,.15)', badgeText: '#4ade80' };
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(c.data_consegna_prevista);
  const soon = new Date(today); soon.setDate(today.getDate() + 14);
  if (d < today)  return { color: '#f87171', glow: '0 0 9px #f87171', label: 'Scaduta',      badge: 'rgba(248,113,113,.18)', badgeText: '#f87171' };
  if (d <= soon)  return { color: '#fbbf24', glow: '0 0 6px #fbbf24', label: 'In scadenza',  badge: 'rgba(251,191,36,.15)',  badgeText: '#fbbf24' };
  return { color: '#4ade80', glow: '0 0 6px #4ade80', label: 'OK', badge: 'rgba(74,222,128,.15)', badgeText: '#4ade80' };
}

function getProgress(c) {
  if (c.status === 'CHIUSA') return 100;
  if (!c.data_inizio || !c.data_consegna_prevista) return null;
  const start = new Date(c.data_inizio);
  const end   = new Date(c.data_consegna_prevista);
  const total = end - start;
  if (total <= 0) return null;
  return Math.max(0, Math.min(100, Math.round((new Date() - start) / total * 100)));
}

function fmtDate(d) {
  if (!d) return '';
  return new Date(d).toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' });
}

function setFilter(status) {
  currentFilter = status;
  document.querySelectorAll('.filter-chip').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.status === status);
  });
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('comm-grid');
  const sub  = document.getElementById('page-sub');

  const list = currentFilter === 'ALL'
    ? allCommesse
    : allCommesse.filter(c => c.status === currentFilter);

  sub.textContent = `${allCommesse.length} commess${allCommesse.length === 1 ? 'a' : 'e'} totali · ${list.length} visualizzat${list.length === 1 ? 'a' : 'e'}`;

  if (!list.length) {
    grid.innerHTML = `<div class="state-msg">
      Nessuna commessa trovata.<br>
      <a href="/commesse/nuova">+ Crea la prima commessa →</a>
    </div>`;
    return;
  }

  grid.innerHTML = list.map((c, i) => {
    const sem  = getSemaforo(c);
    const pct  = getProgress(c);
    const pColor = sem.color;
    const img  = BG_IMGS[i % BG_IMGS.length];
    const clienteDesc = [c.cliente, c.descrizione].filter(Boolean).join(' · ');
    const dataLine = c.data_consegna_prevista ? `Consegna ${fmtDate(c.data_consegna_prevista)}` : '';
    const desc = [clienteDesc, dataLine].filter(Boolean).join(' · ') || 'Nessun dettaglio';

    return `
      <div class="comm-card" onclick="enterCommessa(${c.id}, '${esc(c.codice)}')">
        <div class="c-bg" style="background-image:url('https://images.unsplash.com/${img}?auto=format&fit=crop&w=600&q=80')"></div>
        <div class="c-overlay"></div>
        <div class="c-arrow">→</div>
        <button class="c-delete" onclick="event.stopPropagation(); deleteCommessa(${c.id}, '${esc(c.codice)}')" title="Elimina commessa">✕</button>
        <div class="c-status-badge" style="background:${sem.badge};color:${sem.badgeText};border:1px solid ${sem.badgeText}33">
          ${esc(c.status)}
        </div>
        <div class="c-body">
          <div class="c-codice">${esc(c.codice)}</div>
          <div class="c-desc">${esc(desc)}</div>
          <div class="c-semaforo">
            <span class="sem-dot" style="background:${sem.color};box-shadow:${sem.glow}"></span>
            <span class="sem-label" style="color:${sem.color}">${sem.label}</span>
          </div>
          ${pct !== null ? `
            <div class="c-progress-track">
              <div class="c-progress-fill" style="width:${pct}%;background:${pColor}"></div>
            </div>
            <div class="c-progress-pct">${pct}% avanzamento</div>
          ` : ''}
        </div>
      </div>`;
  }).join('');
}

function enterCommessa(id) {
  window.location.href = `/commesse/${id}`;
}

async function deleteCommessa(id, codice) {
  if (!confirm(`Eliminare definitivamente la commessa "${codice}"?\n\nQuesta azione è irreversibile.`)) return;
  try {
    const res = await fetch(`/api/v1/commesse/${id}`, {
      method: 'DELETE',
      headers: { Authorization: getAuth() },
    });
    if (!res.ok && res.status !== 204) throw new Error(`HTTP ${res.status}`);
    allCommesse = allCommesse.filter(c => c.id !== id);
    renderGrid();
  } catch (e) {
    alert(`Errore durante l'eliminazione: ${e.message}`);
  }
}

async function loadCommesse() {
  const grid = document.getElementById('comm-grid');
  try {
    const res = await fetch('/api/v1/commesse?limit=500', { headers: { Authorization: getAuth() } });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    allCommesse = await res.json();

    // Sort: scadute → in scadenza → OK → sospese → chiuse
    const order = { '#f87171': 0, '#fbbf24': 1, '#4ade80': 2, '#9ca3af': 3 };
    allCommesse.sort((a, b) => {
      const oa = order[getSemaforo(a).color] ?? 9;
      const ob = order[getSemaforo(b).color] ?? 9;
      return oa !== ob ? oa - ob : a.codice.localeCompare(b.codice, 'it');
    });

    renderGrid();
  } catch (e) {
    grid.innerHTML = `<div class="state-msg">Errore nel caricamento delle commesse.<br><small style="color:rgba(255,255,255,.18)">${e.message}</small></div>`;
    document.getElementById('page-sub').textContent = '';
  }
}

loadCommesse();
</script>
</body>
</html>
