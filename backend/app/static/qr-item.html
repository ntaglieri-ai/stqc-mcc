<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>STQC · QR</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#09101e;color:#e7edf7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .card{width:min(520px,100%);padding:26px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:#121b2d;box-shadow:0 18px 60px rgba(0,0,0,.35)}
    .ey{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#64748b;font-weight:800}.title{font-size:25px;font-weight:900;margin:8px 0 4px}.sub{color:#94a3b8;font-size:13px;margin-bottom:22px}
    .status{display:inline-flex;padding:5px 10px;border-radius:20px;background:rgba(74,222,128,.1);color:#4ade80;font-size:11px;font-weight:800}.grid{display:grid;grid-template-columns:120px 1fr;gap:10px;margin-top:20px;font-size:13px}.label{color:#64748b}.value{font-weight:700;word-break:break-word}.error{color:#f87171}.back{display:block;margin-top:22px;color:#93c5fd;text-decoration:none;font-size:12px}
  </style>
</head>
<body>
<main class="card" id="root">Lettura QR…</main>
<script>
const uuid=location.pathname.split('/').filter(Boolean).pop();
const token=localStorage.getItem('stqc_token');
if(!token){location.replace('/login?next='+encodeURIComponent(location.pathname));}
const esc=v=>String(v??'—').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
fetch('/api/v1/qr/resolve/'+encodeURIComponent(uuid),{headers:{Authorization:'Bearer '+token}})
  .then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.detail||'QR non riconosciuto');return d})
  .then(d=>{
    if(d.entity==='WAREHOUSE_ITEM'){
      const m=d.material;
      root.innerHTML=`<div class="ey">Elemento di magazzino</div><div class="title">${esc(m.code)} · #${String(d.ordinal).padStart(4,'0')}</div><div class="sub">Identità fisica univoca</div><span class="status">${esc(d.status)}</span><div class="grid"><div class="label">Tipo</div><div class="value">${esc(m.tipo)}</div><div class="label">Profilo</div><div class="value">${esc(m.profilo)}</div><div class="label">Dimensioni</div><div class="value">${esc(m.dimensioni)}</div><div class="label">Qualità</div><div class="value">${esc(m.qualita)}</div><div class="label">Colata</div><div class="value">${esc(m.colata)}</div><div class="label">UUID</div><div class="value">${esc(d.uuid)}</div></div><a class="back" href="/magazzino">← Magazzino</a>`;
    } else {
      root.innerHTML=`<div class="ey">Pezzo di commessa</div><div class="title">${esc(d.part_number)}</div><div class="sub">${esc(d.profilo)}</div><div class="grid"><div class="label">UUID</div><div class="value">${esc(d.uuid)}</div></div><a class="back" href="/commesse">← Commesse</a>`;
    }
  }).catch(e=>root.innerHTML=`<div class="ey">STQC</div><div class="title error">QR non disponibile</div><div class="sub">${esc(e.message)}</div>`);
</script>
</body>
</html>
