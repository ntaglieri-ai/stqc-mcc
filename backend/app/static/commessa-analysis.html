<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Analisi Commessa · MCC</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a1020; --panel: #11192b; --panel2: #161f32;
      --border: rgba(255,255,255,.08); --text: #e7edf7;
      --secondary: #91a0b4; --muted: #536177; --blue: #3b82f6;
      --green: #4ade80; --yellow: #fbbf24; --orange: #fb923c; --red: #f87171;
    }
    html, body {
      min-height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .nav {
      height: 58px; padding: 0 28px; position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 10px;
      background: rgba(8,15,31,.96); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav a { color: var(--secondary); text-decoration: none; font-size: 12px; }
    .nav a:hover { color: var(--text); }
    .nav-sep { color: var(--muted); }
    .nav-current { font-size: 12px; font-weight: 700; }
    .nav-user { margin-left: auto; font-size: 11px; color: var(--muted); }
    .page { max-width: 1320px; margin: 0 auto; padding: 38px 32px 70px; }
    .header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 24px; margin-bottom: 28px;
    }
    .eyebrow {
      color: var(--muted); font-size: 10px; font-weight: 800;
      letter-spacing: .14em; text-transform: uppercase; margin-bottom: 7px;
    }
    h1 { font-size: 31px; letter-spacing: -.035em; line-height: 1.1; }
    .subtitle { margin-top: 8px; color: var(--secondary); font-size: 13px; line-height: 1.5; }
    .status {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 13px; border-radius: 20px;
      font-size: 11px; font-weight: 800; white-space: nowrap;
    }
    .status.ok { color: var(--green); background: rgba(74,222,128,.09); border: 1px solid rgba(74,222,128,.25); }
    .status.warn { color: var(--yellow); background: rgba(251,191,36,.09); border: 1px solid rgba(251,191,36,.25); }
    .pre {
      margin-left: 8px; color: var(--orange); background: rgba(251,146,60,.09);
      border: 1px solid rgba(251,146,60,.25);
    }
    .steps {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 8px; margin-bottom: 26px;
    }
    .step {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 13px; border: 1px solid var(--border);
      border-radius: 11px; background: rgba(255,255,255,.025);
    }
    .step-num {
      width: 25px; height: 25px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(59,130,246,.13); color: #93c5fd;
      font-size: 11px; font-weight: 800;
    }
    .step-label { font-size: 11px; font-weight: 700; color: var(--secondary); }
    .section {
      margin-bottom: 22px; padding: 22px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    }
    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; margin-bottom: 17px;
    }
    .section-title { font-size: 15px; font-weight: 850; }
    .section-sub { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .file-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .file-card {
      min-height: 90px; padding: 14px; border-radius: 11px;
      background: var(--panel2); border: 1px solid var(--border);
    }
    .file-kind { color: var(--muted); font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .09em; }
    .file-name { margin-top: 8px; font-size: 12px; font-weight: 700; word-break: break-word; }
    .file-state { margin-top: 7px; font-size: 10px; color: var(--green); }
    .file-card.empty .file-name, .file-card.empty .file-state { color: var(--muted); }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .kpi {
      padding: 16px; border-radius: 11px;
      background: var(--panel2); border: 1px solid var(--border);
    }
    .kpi-label { color: var(--muted); font-size: 9px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    .kpi-value { margin-top: 6px; font-size: 25px; font-weight: 900; letter-spacing: -.025em; }
    .toolbar { display: flex; gap: 10px; margin: 17px 0 11px; }
    .search {
      flex: 1; padding: 9px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: #0c1322;
      color: var(--text); outline: none; font: inherit; font-size: 12px;
    }
    .search:focus { border-color: rgba(59,130,246,.5); }
    .table-wrap {
      max-height: 390px; overflow: auto; border-radius: 10px;
      border: 1px solid var(--border);
      scrollbar-color: #46556b #101827;
      scrollbar-width: thin;
    }
    .table-wrap::-webkit-scrollbar { width: 8px; height: 8px; }
    .table-wrap::-webkit-scrollbar-track { background: #101827; }
    .table-wrap::-webkit-scrollbar-thumb { background: #46556b; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th {
      position: sticky; top: 0; z-index: 2; padding: 9px 11px;
      text-align: left; background: #1b2538; color: #73849a;
      text-transform: uppercase; letter-spacing: .08em; font-size: 9px;
    }
    td { padding: 9px 11px; color: var(--secondary); border-top: 1px solid rgba(255,255,255,.045); }
    tbody tr:nth-child(even) { background: rgba(255,255,255,.018); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); font-weight: 700; }
    .right { text-align: right; }
    .notice {
      padding: 13px 15px; border-radius: 10px; font-size: 12px; line-height: 1.5;
      background: rgba(74,222,128,.06); border: 1px solid rgba(74,222,128,.16); color: #86efac;
    }
    .notice.warn { background: rgba(251,191,36,.06); border-color: rgba(251,191,36,.18); color: #fcd34d; }
    .explanation {
      margin: 13px 0 16px; padding: 13px 15px; border-radius: 10px;
      background: rgba(59,130,246,.06); border: 1px solid rgba(59,130,246,.16);
      color: var(--secondary); font-size: 11px; line-height: 1.55;
    }
    .explanation strong { color: #bfdbfe; }
    .anomaly-list { display: flex; flex-direction: column; gap: 7px; }
    .anomaly {
      padding: 10px 12px; border-radius: 9px; font-size: 11px;
      background: rgba(248,113,113,.06); border: 1px solid rgba(248,113,113,.16); color: #fca5a5;
    }
    .anomaly.warning {
      background: rgba(251,191,36,.06); border-color: rgba(251,191,36,.16); color: #fcd34d;
    }
    .stock-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
    .stock-kpi {
      padding: 13px; border-radius: 10px; text-align: center; cursor: pointer;
      border: 1px solid var(--border); background: var(--panel2); transition: border-color .15s;
    }
    .stock-kpi:hover, .stock-kpi.active { border-color: rgba(59,130,246,.55); }
    .stock-num { font-size: 22px; font-weight: 900; }
    .stock-label { margin-top: 4px; color: var(--muted); font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; }
    .stock-meta { margin-top: 5px; color: var(--secondary); font-size: 10px; }
    .footer-note {
      margin-top: 22px; padding: 15px; text-align: center;
      color: var(--secondary); font-size: 12px;
      border: 1px dashed var(--border); border-radius: 11px;
    }
    .workflow-card {
      padding: 18px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--panel2);
    }
    .workflow-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .workflow-title { font-size: 14px; font-weight: 850; }
    .workflow-copy { margin-top: 5px; color: var(--secondary); font-size: 11px; line-height: 1.55; }
    .btn {
      border: 1px solid rgba(59,130,246,.38); border-radius: 9px; padding: 10px 15px;
      color: #dbeafe; background: rgba(59,130,246,.16); font: inherit;
      font-size: 11px; font-weight: 800; cursor: pointer; white-space: nowrap;
    }
    .btn:hover { background: rgba(59,130,246,.25); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn.secondary { background: transparent; border-color: var(--border); color: var(--secondary); }
    .revision-form {
      display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px;
      margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border);
    }
    .upload-field {
      padding: 11px; border: 1px dashed rgba(255,255,255,.16);
      border-radius: 9px; background: #0c1322;
    }
    .upload-field label { display: block; margin-bottom: 6px; color: var(--secondary); font-size: 10px; font-weight: 750; }
    .upload-field input { width: 100%; color: var(--secondary); font-size: 10px; }
    .revision-actions { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .feedback { color: var(--secondary); font-size: 11px; }
    .feedback.error { color: var(--red); }
    .qr-summary { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
    .qr-count { font-size: 26px; font-weight: 900; color: var(--green); }
    .qr-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 9px; margin-top: 12px;
    }
    .qr-card {
      display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center;
      min-width: 0; padding: 9px; border: 1px solid var(--border);
      border-radius: 10px; background: #0c1322;
    }
    .qr-card img { width: 64px; height: 64px; padding: 3px; border-radius: 5px; background: #fff; }
    .qr-code { font-size: 10px; font-weight: 850; color: var(--text); overflow-wrap: anywhere; }
    .qr-meta { margin-top: 4px; color: var(--muted); font-size: 9px; line-height: 1.4; }
    .qr-link { display: inline-block; margin-top: 5px; color: #93c5fd; font-size: 9px; text-decoration: none; }
    .pagination { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 12px; color: var(--muted); font-size: 10px; }
    .revision-list { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; }
    .revision-chip {
      padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
      color: var(--secondary); background: rgba(255,255,255,.02); font-size: 10px;
    }
    .revision-chip.current { color: #bfdbfe; border-color: rgba(59,130,246,.35); }
    .loader {
      min-height: 360px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; color: var(--muted);
    }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.08); border-top-color: var(--blue);
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 900px) {
      .steps, .kpis { grid-template-columns: repeat(2, 1fr); }
      .file-grid { grid-template-columns: 1fr; }
      .stock-kpis { grid-template-columns: repeat(2, 1fr); }
      .revision-form { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      .page { padding: 24px 14px 50px; }
      .header { flex-direction: column; }
      .steps, .kpis { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<script>
(function() {
  const token = localStorage.getItem("stqc_token");
  const profile = localStorage.getItem("stqc_profilo");
  if (!token) { location.replace("/login"); return; }
  if (!["Responsabile", "Direttore", "Admin"].includes(profile)) location.replace("/");
})();
</script>

<nav class="nav">
  <a href="/commesse">← In corso</a>
  <span class="nav-sep">/</span>
  <span class="nav-current" id="nav-code">Analisi Commessa</span>
  <span class="nav-user" id="nav-user"></span>
</nav>

<main class="page" id="root">
  <div class="loader"><div class="spinner"></div><span>Analisi della commessa…</span></div>
</main>

<script>
const commessaId = Number(location.pathname.split("/").filter(Boolean).at(-2));
const auth = () => ({ Authorization: "Bearer " + localStorage.getItem("stqc_token") });
let analysisData = null;
let stockData = null;
let revisionData = [];
let stockFilter = "tutti";
let qrPage = 0;
const qrPageSize = 60;
let qrQuery = "";

document.getElementById("nav-user").textContent =
  `${localStorage.getItem("stqc_nome") || ""} · ${localStorage.getItem("stqc_profilo") || ""}`;

function esc(value) {
  return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fmt(value) {
  return Number(value || 0).toLocaleString("it-IT", { maximumFractionDigits: 2 });
}
function basename(path) {
  return path ? String(path).split("/").pop() : null;
}

function fileCard(kind, name, emptyText) {
  return `<div class="file-card${name ? "" : " empty"}">
    <div class="file-kind">${kind}</div>
    <div class="file-name">${esc(name || emptyText)}</div>
    <div class="file-state">${name ? "✓ Acquisito" : "Non caricato"}</div>
  </div>`;
}

function renderPage() {
  const c = analysisData.commessa;
  const r = analysisData.revisione;
  const s = analysisData.summary;
  const report = r.report || {};
  const docs = r.files.documenti || [];
  document.title = `Analisi ${c.codice} · MCC`;
  document.getElementById("nav-code").textContent = `${c.codice} · Analisi`;

  document.getElementById("root").innerHTML = `
    <header class="header">
      <div>
        <div class="eyebrow">Gestione Commesse</div>
        <h1>Analisi ${esc(c.codice)}</h1>
        <div class="subtitle">${esc(c.cliente || "Cliente non specificato")} · Revisione ${esc(r.codice)}</div>
      </div>
      <div>
        <span class="status ${r.stato_analisi === "PRONTA" ? "ok" : "warn"}">
          ${r.stato_analisi === "PRONTA" ? "✓ Analisi coerente" : "⚠ Da verificare"}
        </span>
        ${r.predistinta ? '<span class="status pre">Pre-distinta</span>' : ""}
      </div>
    </header>

    <div class="steps">
      <div class="step"><span class="step-num">1</span><span class="step-label">File acquisiti</span></div>
      <div class="step"><span class="step-num">2</span><span class="step-label">Riepilogo pezzi</span></div>
      <div class="step"><span class="step-num">3</span><span class="step-label">Controllo anomalie</span></div>
      <div class="step"><span class="step-num">4</span><span class="step-label">Classificazione materiali</span></div>
    </div>

    ${renderRevisionWorkflow(r)}

    <section class="section">
      <div class="section-head">
        <div><div class="section-title">File acquisiti</div>
        <div class="section-sub">Documenti originali conservati nella revisione ${esc(r.codice)}</div></div>
      </div>
      <div class="file-grid">
        ${fileCard("Lista pezzi", basename(r.files.lista_pezzi), "File obbligatorio non disponibile")}
        ${fileCard("Pezzi e assemblati", basename(r.files.assemblaggi), "Nessuna gerarchia caricata")}
        ${fileCard("Schemi e disegni", docs.length ? `${docs.length} file` : null, "Nessun disegno caricato")}
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <div><div class="section-title">Riepilogo commessa</div>
        <div class="section-sub">Lettura della Lista pezzi, senza ancora eseguire azioni operative</div></div>
      </div>
      <div class="kpis">
        <div class="kpi"><div class="kpi-label">Pezzi fisici</div><div class="kpi-value">${fmt(s.n_pezzi)}</div></div>
        <div class="kpi"><div class="kpi-label">Part number distinti</div><div class="kpi-value">${fmt(s.n_codici_pezzo)}</div></div>
        <div class="kpi"><div class="kpi-label">Assemblati</div><div class="kpi-value">${fmt(s.n_assemblati)}</div></div>
        <div class="kpi"><div class="kpi-label">Profili / qualità</div><div class="kpi-value">${fmt(s.n_profili)}</div></div>
      </div>
      <div class="explanation">
        <strong>Come leggere i numeri:</strong> il part number identifica un particolare della distinta.
        La quantità indica quante copie fisiche devono essere prodotte. Per esempio, un part number con quantità 26 rappresenta 26 pezzi fisici uguali.
      </div>
      <div class="toolbar"><input class="search" id="position-search" placeholder="Cerca part number, profilo o qualità…" oninput="renderPositions(this.value)"/></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Part number</th><th>Profilo</th><th>Qualità</th><th class="right">Pezzi fisici</th><th>Assemblati</th></tr></thead>
          <tbody id="positions-body"></tbody>
        </table>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <div><div class="section-title">Controllo anomalie</div>
        <div class="section-sub">${esc(report.summary || "Controllo completato")}</div></div>
      </div>
      <div id="anomalies"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <div><div class="section-title">Materiali per categoria</div>
        <div class="section-sub">Distribuzione dei ${fmt(s.n_pezzi)} pezzi fisici per famiglia di materiale, profilo e qualità</div></div>
      </div>
      <div class="explanation">
        <strong>Questa tabella raggruppa i dati:</strong> ogni riga riunisce tutti i part number che utilizzano lo stesso tipo di materiale, profilo e qualità.
        “Part number distinti” indica quanti codici diversi sono compresi nel gruppo, non quanti pezzi contiene.
      </div>
      <div id="stock-content"><div class="loader"><div class="spinner"></div><span>Classificazione materiali…</span></div></div>
    </section>

    <section class="section" id="step-5-1">
      <div class="section-head">
        <div><div class="section-title">Step 5.1 · QR dei pezzi di commessa</div>
        <div class="section-sub">Un record e un QR univoco per ogni pezzo fisico della revisione corrente</div></div>
      </div>
      <div class="workflow-card">
        <div class="workflow-head">
          <div>
            <div class="workflow-title">${r.step51_completato ? "QR generati" : "Pronto per generare i QR"}</div>
            <div class="workflow-copy">
              ${r.step51_completato
                ? `${fmt(s.n_qr_attivi)} pezzi sono identificati e nello stato DA PRODURRE. Nessun materiale è stato associato o movimentato.`
                : "L'operazione attiva gli UUID già assegnati ai pezzi e li porta nello stato DA PRODURRE. Non interviene sul magazzino."}
            </div>
          </div>
          ${r.step51_completato
            ? `<div class="qr-count">${fmt(s.n_qr_attivi)}</div>`
            : `<button class="btn" id="generate-qr-btn" onclick="generateStep51()" ${r.stato_analisi !== "PRONTA" ? "disabled" : ""}>Genera QR pezzi</button>`}
        </div>
        <div id="step51-feedback" class="feedback"></div>
        ${r.step51_completato ? `
          <div class="toolbar">
            <input class="search" placeholder="Cerca part number, profilo, qualità o assemblato…" oninput="searchQrItems(this.value)"/>
          </div>
          <div id="qr-items"><div class="loader"><div class="spinner"></div><span>Caricamento QR…</span></div></div>
        ` : ""}
      </div>
    </section>

    <div class="footer-note">
      Lo Step 5.1 identifica i pezzi della commessa. Associazione ai grezzi, copertura, piano di taglio e sfrido appartengono agli step successivi.
    </div>`;

  renderPositions("");
  renderAnomalies();
  renderStock();
  if (r.step51_completato) loadQrItems();
}

function renderRevisionWorkflow(revision) {
  const chips = revisionData.map(row => `
    <div class="revision-chip${row.corrente ? " current" : ""}">
      ${esc(row.codice)} · ${row.predistinta ? "pre-distinta" : "definitiva"}
      ${row.corrente ? " · corrente" : " · archiviata"}
    </div>`).join("");
  if (!revision.predistinta) {
    return `<section class="section">
      <div class="section-head"><div><div class="section-title">Versione della distinta</div>
      <div class="section-sub">La revisione corrente è definitiva</div></div></div>
      <div class="revision-list">${chips}</div>
    </section>`;
  }
  return `<section class="section">
    <div class="section-head"><div><div class="section-title">Pre-distinta · analisi preliminare</div>
    <div class="section-sub">Step 4 e Step 5.1 possono essere eseguiti, ma la produzione resterà bloccata fino alla distinta definitiva</div></div></div>
    <div class="notice warn">
      Caricando la distinta definitiva verrà creata una nuova revisione: lo Step 4 sarà rieseguito e gli eventuali QR preliminari saranno archiviati e disattivati.
    </div>
    <div class="revision-list">${chips}</div>
    <form class="revision-form" onsubmit="uploadDefinitive(event)">
      <div class="upload-field"><label>Lista pezzi definitiva *</label><input type="file" id="def-lista" accept=".xls,.xlsx,.xlsm" required/></div>
      <div class="upload-field"><label>Pezzi e assemblati</label><input type="file" id="def-assemblaggi" accept=".xls,.xlsx,.xlsm"/></div>
      <div class="upload-field"><label>Schemi e disegni</label><input type="file" id="def-disegni" multiple accept=".pdf,.dwg,.jpg,.jpeg,.png"/></div>
      <div class="revision-actions">
        <span class="feedback" id="revision-feedback"></span>
        <button class="btn" id="revision-submit" type="submit">Carica distinta definitiva e riesegui Step 4</button>
      </div>
    </form>
  </section>`;
}

async function uploadDefinitive(event) {
  event.preventDefault();
  const button = document.getElementById("revision-submit");
  const feedback = document.getElementById("revision-feedback");
  const lista = document.getElementById("def-lista").files[0];
  if (!lista) return;
  button.disabled = true;
  feedback.className = "feedback";
  feedback.textContent = "Caricamento e nuova analisi in corso…";
  const body = new FormData();
  body.append("lista_pezzi", lista);
  const assemblaggi = document.getElementById("def-assemblaggi").files[0];
  if (assemblaggi) body.append("assemblaggi", assemblaggi);
  for (const file of document.getElementById("def-disegni").files) body.append("disegni", file);
  body.append("predistinta", "false");
  try {
    const response = await fetch(`/api/v1/commesse/${commessaId}/analisi`, {
      method: "POST", headers: auth(), body,
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || "Impossibile analizzare la distinta definitiva");
    location.reload();
  } catch (error) {
    feedback.className = "feedback error";
    feedback.textContent = error.message || String(error);
    button.disabled = false;
  }
}

async function generateStep51() {
  const button = document.getElementById("generate-qr-btn");
  const feedback = document.getElementById("step51-feedback");
  button.disabled = true;
  feedback.textContent = "Generazione dei record QR in corso…";
  try {
    const response = await fetch(`/api/v1/commesse/${commessaId}/step-5-1`, {
      method: "POST", headers: auth(),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || "Impossibile completare lo Step 5.1");
    await load();
  } catch (error) {
    feedback.className = "feedback error";
    feedback.textContent = error.message || String(error);
    button.disabled = false;
  }
}

function searchQrItems(value) {
  qrQuery = String(value || "").trim();
  qrPage = 0;
  loadQrItems();
}

async function changeQrPage(delta) {
  qrPage = Math.max(0, qrPage + delta);
  await loadQrItems();
}

async function loadQrItems() {
  const target = document.getElementById("qr-items");
  if (!target) return;
  const params = new URLSearchParams({
    skip: String(qrPage * qrPageSize),
    limit: String(qrPageSize),
  });
  if (qrQuery) params.set("q", qrQuery);
  try {
    const response = await fetch(`/api/v1/commesse/${commessaId}/step-5-1/items?${params}`, { headers: auth() });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || "QR non disponibili");
    const pages = Math.max(1, Math.ceil(data.total / data.limit));
    target.innerHTML = `
      <div class="qr-grid">
        ${data.items.map(item => `<div class="qr-card">
          <img src="${esc(item.qr_image_url)}" alt="QR ${esc(item.qr_code || item.part_number)}"/>
          <div>
            <div class="qr-code">${esc(item.qr_code || item.part_number || "SENZA CODICE")}</div>
            <div class="qr-meta">${esc(item.profilo || "—")}<br/>${esc(item.stato)}</div>
            <a class="qr-link" href="#" onclick="printCommessaLabel('${esc(item.label_url)}',event)">Stampa etichetta</a>
          </div>
        </div>`).join("")}
      </div>
      <div class="pagination">
        <span>${fmt(data.total)} QR · pagina ${qrPage + 1} di ${pages}</span>
        <button class="btn secondary" onclick="changeQrPage(-1)" ${qrPage === 0 ? "disabled" : ""}>Indietro</button>
        <button class="btn secondary" onclick="changeQrPage(1)" ${qrPage + 1 >= pages ? "disabled" : ""}>Avanti</button>
      </div>`;
  } catch (error) {
    target.innerHTML = `<div class="notice warn">${esc(error.message || error)}</div>`;
  }
}

async function printCommessaLabel(url, event) {
  event.preventDefault();
  try {
    const response = await fetch(url, { headers: auth() });
    const data = response.ok ? await response.blob() : await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || "Etichetta non disponibile");
    const objectUrl = URL.createObjectURL(data);
    window.open(objectUrl, "_blank", "noopener");
    setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);
  } catch (error) {
    alert(error.message || String(error));
  }
}

function renderPositions(query) {
  const q = String(query || "").trim().toLowerCase();
  const rows = analysisData.positions.filter(row =>
    [row.part_number, row.profilo, row.qualita, ...(row.assemblati || [])]
      .some(value => String(value || "").toLowerCase().includes(q))
  );
  document.getElementById("positions-body").innerHTML = rows.map(row => `
    <tr>
      <td class="mono">${esc(row.part_number)}</td>
      <td>${esc(row.profilo || "—")}</td>
      <td>${esc(row.qualita || "—")}</td>
      <td class="right">${fmt(row.quantita)}</td>
      <td>${row.assemblati.length ? esc(row.assemblati.join(", ")) : "—"}</td>
    </tr>`).join("") || '<tr><td colspan="5">Nessun part number trovato</td></tr>';
}

function renderAnomalies() {
  const report = analysisData.revisione.report || {};
  const errors = report.errors || [];
  const warnings = report.warnings || [];
  const target = document.getElementById("anomalies");
  if (!errors.length && !warnings.length) {
    target.innerHTML = '<div class="notice">✓ File coerenti: codici, quantità e gerarchia risultano allineati.</div>';
    return;
  }
  target.innerHTML = `<div class="anomaly-list">
    ${errors.map(message => `<div class="anomaly">✕ ${esc(message)}</div>`).join("")}
    ${warnings.map(message => `<div class="anomaly warning">⚠ ${esc(message)}</div>`).join("")}
  </div>`;
}

function setStockFilter(value) {
  stockFilter = value;
  renderStock();
}

function renderStock() {
  const target = document.getElementById("stock-content");
  if (!stockData) return;
  const rows = stockData.groups.filter(row => stockFilter === "tutti" || row.tipo === stockFilter);
  target.innerHTML = `
    <div class="stock-kpis">
      ${stockData.types.map(row => `<div class="stock-kpi${stockFilter === row.tipo ? " active" : ""}" onclick="setStockFilter('${esc(row.tipo)}')">
        <div class="stock-num">${fmt(row.n_pezzi)}</div>
        <div class="stock-label">${esc(row.tipo)}</div>
        <div class="stock-meta">${fmt(row.n_codici_pezzo)} part number distinti · ${fmt(row.n_gruppi)} profili/qualità</div>
      </div>`).join("")}
    </div>
    <div class="toolbar">
      <input class="search" id="stock-search" placeholder="Cerca tipo, profilo o qualità…" oninput="renderStockRows(this.value)"/>
      ${stockFilter !== "tutti" ? '<button class="search" style="flex:0;cursor:pointer" onclick="setStockFilter(\'tutti\')">Tutti</button>' : ""}
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Tipo materiale</th><th>Profilo</th><th>Qualità</th><th class="right">Pezzi fisici</th><th class="right">Part number distinti</th></tr></thead>
        <tbody id="stock-body"></tbody>
      </table>
    </div>`;
  renderStockRows("");
}

function renderStockRows(query) {
  const q = String(query || "").trim().toLowerCase();
  const rows = stockData.groups.filter(row =>
    (stockFilter === "tutti" || row.tipo === stockFilter) &&
    [row.tipo, row.profilo, row.qualita].some(value => String(value || "").toLowerCase().includes(q))
  );
  document.getElementById("stock-body").innerHTML = rows.map(row => `
    <tr>
      <td>${esc(row.tipo)}</td>
      <td class="mono">${esc(row.profilo)}</td>
      <td>${esc(row.qualita || "—")}</td>
      <td class="right">${fmt(row.n_pezzi)}</td>
      <td class="right">${fmt(row.n_codici_pezzo)}</td>
    </tr>`).join("") || '<tr><td colspan="5">Nessun profilo in questa categoria</td></tr>';
}

async function load() {
  try {
    const [analysisResponse, stockResponse, revisionsResponse] = await Promise.all([
      fetch(`/api/v1/commesse/${commessaId}/analisi`, { headers: auth() }),
      fetch(`/api/v1/commesse/${commessaId}/analisi/materiali`, { headers: auth() }),
      fetch(`/api/v1/commesse/${commessaId}/revisioni`, { headers: auth() }),
    ]);
    const analysis = await analysisResponse.json().catch(() => ({}));
    const stock = await stockResponse.json().catch(() => ({}));
    const revisions = await revisionsResponse.json().catch(() => ([]));
    if (!analysisResponse.ok) throw new Error(analysis.detail || "Analisi non disponibile");
    if (!stockResponse.ok) throw new Error(stock.detail || "Classificazione materiali non disponibile");
    if (!revisionsResponse.ok) throw new Error(revisions.detail || "Revisioni non disponibili");
    analysisData = analysis;
    stockData = stock;
    revisionData = revisions;
    renderPage();
  } catch (error) {
    document.getElementById("root").innerHTML = `<div class="notice warn">⚠ ${esc(error.message || error)}</div>`;
  }
}
load();
</script>

</html>
