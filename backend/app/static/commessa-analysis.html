<!DOCTYPE html>
<html lang="it">
<head>
  <script src="/static/commessa-embed.js?v=commessa-shell1"></script>
  <link rel="stylesheet" href="/static/qr-drawer.css?v=scan4">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Analisi Commessa · MCC</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a1020; --panel: #11192b; --panel2: #161f32;
      --border: rgba(255,255,255,.08); --text: #e7edf7;
      --secondary: #91a0b4; --muted: #536177; --blue: #3b82f6;

    }

    .macro-flow {
      position: relative;
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 18px; margin: 34px 0 34px; padding-top: 32px;
    }
    .macro-flow::before {
      content: ""; position: absolute; left: 7%; right: 7%; top: 17px; height: 2px;
      background: linear-gradient(90deg, rgba(251,191,36,.75), rgba(147,197,253,.28), rgba(147,197,253,.12));

    .btn {

      color: #dbeafe; background: rgba(59,130,246,.16); font: inherit;

    .btn:hover { background: rgba(59,130,246,.25); }

    .modal-sub { margin-top: 6px; color: var(--secondary); font-size: 12px; }
    .modal-close {
      width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border);
      background: rgba(255,255,255,.04); color: var(--secondary); cursor: pointer;
      font-size: 20px; font-weight: 700;
    }
    .modal-body { padding: 22px 26px 26px; overflow: auto; }
    .detail-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
    .detail-card {
      padding: 13px; border-radius: 13px; border: 1px solid var(--border);
      background: rgba(255,255,255,.025);
    }
    .piece-status-dot {
      display: inline-flex; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px;
      background: var(--muted);
    }
    .piece-status-dot.done { background: var(--green); }
    .piece-status-dot.progress { background: var(--blue); }
    .qr-detail { display: grid; grid-template-columns: 190px 1fr; gap: 22px; align-items: start; }
    .qr-detail img { width: 190px; height: 190px; padding: 10px; border-radius: 15px; background: #fff; image-rendering: pixelated; }
    .qr-edit-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
    .qr-edit-field label { display:block; color:var(--muted); font-size:9px; font-weight:850; letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; }
    .qr-edit-field input {
      width:100%; padding:10px 11px; border-radius:10px; border:1px solid var(--border);
      background:#0c1322; color:var(--text); font:inherit; font-size:12px; outline:none;
    }
    .qr-edit-field input:disabled { opacity:.55; cursor:not-allowed; }
    .qr-edit-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:14px; }
    .revision-list { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; }
    .revision-chip {
      padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
      color: var(--secondary); background: rgba(255,255,255,.02); font-size: 10px;
    }
    .revision-chip.current { color: #bfdbfe; border-color: rgba(59,130,246,.35); }
    .loader {
      min-height: 360px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; color: var(--muted);
    }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.08); border-top-color: var(--blue);
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 900px) {
      .steps, .macro-flow, .kpis { grid-template-columns: repeat(2, 1fr); }
      .assembly-overview { grid-template-columns: repeat(2, 1fr); }
      .detail-grid { grid-template-columns: repeat(2, 1fr); }
      .qr-summary-card { grid-template-columns: 1fr; }
      .file-grid { grid-template-columns: 1fr; }
      .revision-form { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      .page { padding: 24px 14px 50px; }
      .header { flex-direction: column; }
      .steps, .macro-flow, .kpis, .assembly-overview, .detail-grid, .qr-detail, .qr-edit-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<script>
const commessaRef = decodeURIComponent(location.pathname.split("/").filter(Boolean)[1] || "");
let commessaId = null;
let commessaCode = commessaRef;
const auth = () => ({ Authorization: "Bearer " + sessionStorage.getItem("stqc_token") });
let analysisData = null;
let assemblyData = null;
let revisionData = [];
let qrPage = 0;
const qrPageSize = 5000;
let qrQuery = "";
let currentQrItems = [];
let currentQrDetail = null;
let qrEditUnlocked = false;
const selectedQrPieces = new Set();
let fabbisognoDetailsOpen = false;

function commessaUrl(page) {
  return `/commesse/${encodeURIComponent(commessaCode || commessaRef)}/${page}`;
}

async function resolveCommessa() {
  if (commessaId) return;
  const response = await fetch(`/api/v1/commesse/resolve/${encodeURIComponent(commessaRef)}`, { headers: auth() });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.detail || "Commessa non trovata");
  commessaId = data.id;
  commessaCode = data.codice || commessaRef;
}

document.getElementById("nav-user").textContent =
  `${sessionStorage.getItem("stqc_nome") || ""} · ${sessionStorage.getItem("stqc_profilo") || ""}`;

function esc(value) {
  return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fmt(value) {
  return Number(value || 0).toLocaleString("it-IT", { maximumFractionDigits: 2 });
}
function basename(path) {
  return path ? String(path).split("/").pop() : null;
}
function jsArg(value) {
  return String(value ?? "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
}

function fileCard(kind, name, emptyText) {
  return `<div class="file-card${name ? "" : " empty"}">
    <div class="file-kind">${kind}</div>
    <div class="file-name">${esc(name || emptyText)}</div>
    <div class="file-state">${name ? "✓ Acquisito" : "Non caricato"}</div>
  </div>`;
}

function macroStateClass(state) {
  return state === "COMPLETATA" ? "done" : state === "IN_CORSO" ? "progress" : "idle";
}
function macroStateLabel(state) {
  return state === "COMPLETATA" ? "Completata" : state === "IN_CORSO" ? "In corso" : "Non iniziata";
}
function renderMacroFlow() {
  const r = analysisData.revisione || {};
  const summary = analysisData.summary || {};
  const assemblySummary = assemblyData?.summary || {};
  const assemblyProgress = Number(assemblySummary.progress || 0);
  const officeState = r.step51_completato || Number(summary.n_qr_attivi || 0) > 0 ? "IN_CORSO" : "NON_INIZIATA";
  const assemblyState = assemblyProgress >= 100 ? "COMPLETATA" : assemblyProgress > 0 ? "IN_CORSO" : "NON_INIZIATA";
  const cards = [
    { title: "Analisi commessa", state: "COMPLETATA", sub: "File acquisiti e distinta pronta", href: commessaUrl("analisi") },
    { title: "Officina", state: officeState, sub: `${fmt(summary.n_qr_attivi || 0)} QR pezzi attivi`, href: commessaUrl("officina") },
    { title: "Assemblaggio", state: assemblyState, sub: assemblyProgress > 0 ? `${fmt(assemblyProgress)}% avanzamento assemblati` : "In attesa scan assemblaggio", href: commessaUrl("assemblaggi") },
    { title: "Lavorazioni", state: "NON_INIZIATA", sub: "Post-officina e lavorazioni esterne", href: commessaUrl("lavorazioni") },
    { title: "Spedizione", state: "NON_INIZIATA", sub: "Uscita finale", href: commessaUrl("in-cantiere") },
  ];
  return `<div class="macro-flow">${cards.map((card, index) => `
    <${card.href ? `a href="${esc(card.href)}"` : "div"} class="macro-card ${macroStateClass(card.state)}">
      <div class="macro-kicker"><span>${index + 1}</span><span class="macro-state">${macroStateLabel(card.state)}</span></div>
      <div class="macro-title">${esc(card.title)}</div>
      <div class="macro-sub">${esc(card.sub)}</div>
    </${card.href ? "a" : "div"}>
  `).join("")}</div>`;
}

function renderPage() {
  const c = analysisData.commessa;
  const r = analysisData.revisione;
  const s = analysisData.summary;
  document.title = `Analisi ${c.codice} · MCC`;
  document.getElementById("nav-code").textContent = `${c.codice} · Analisi`;

  document.getElementById("root").innerHTML = `
    <header class="header">
      <div>
        <div class="eyebrow">Gestione Commesse</div>
        <h1>Analisi ${esc(c.codice)}</h1>
        <div class="subtitle">${esc(c.cliente || "Cliente non specificato")} · Distinta acquisita</div>
      </div>
      <div class="header-actions">
        <div class="header-status-row">
          <span class="status ${r.stato_analisi === "PRONTA" ? "ok" : "warn"}">
            ${r.stato_analisi === "PRONTA" ? "✓ Analisi coerente" : "⚠ Da verificare"}
          </span>
          ${r.predistinta ? '<span class="status pre">Pre-distinta</span>' : ""}
        </div>
        ${r.step51_completato ? `
          <button class="btn cta header-office-btn" onclick="openQrRegistry()">
            Apri In officina
            <small>${fmt(s.n_qr_attivi)} QR pezzi attivi</small>
          </button>
        ` : ""}
      </div>
    </header>

    ${renderMacroFlow()}

    ${r.predistinta ? renderPredistintaWarning(r) : ""}
    ${renderFileWarnings(r)}

    <section class="section">
      <div class="section-head">
        <div><div class="section-title">File acquisiti</div>
        <div class="section-sub">Documenti originali conservati per questa commessa</div></div>
      </div>
      <div class="file-grid">
        ${fileCard("Lista pezzi", basename(r.files.lista_pezzi), "File obbligatorio non disponibile")}
        ${fileCard("Pezzi e assemblati", basename(r.files.assemblaggi), "Nessuna gerarchia caricata")}
        ${fileCard("Lista spedizione", basename(r.files.spedizione), "Non caricata · non bloccante")}
        ${fileCard("Bulloneria", basename(r.files.bulloneria), "Opzionale · nessun QR associato")}
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <div><div class="section-title">Sintesi distinta acquisita</div>
        <div class="section-sub">Numeri base letti dai file caricati. Il dettaglio materiali è nella sezione Fabbisogno commessa.</div></div>
      </div>
      <div class="kpis">
        <div class="kpi"><div class="kpi-label">Pezzi fisici</div><div class="kpi-value">${fmt(s.n_pezzi)}</div></div>
        <div class="kpi"><div class="kpi-label">Part number distinti</div><div class="kpi-value">${fmt(s.n_codici_pezzo)}</div></div>
        <div class="kpi"><div class="kpi-label">Assemblati</div><div class="kpi-value">${fmt(s.n_assemblati)}</div></div>
        <div class="kpi"><div class="kpi-label">Profili / qualità</div><div class="kpi-value">${fmt(s.n_profili)}</div></div>
      </div>
      <div class="explanation">
        <strong>Nota:</strong> questa è solo una sintesi di controllo. La vista operativa dei materiali necessari,
        compresa la bulloneria da file dedicato e gli elementi presenti nel file pezzi, è raccolta sotto “Fabbisogno commessa”.
      </div>
    </section>

    ${renderFabbisognoSection()}

    ${r.step51_completato ? "" : `
      <section class="section production-section" id="step-5-1">
        <div class="section-head">
          <div><div class="section-title">In officina</div>
          <div class="section-sub">Genera i QR operativi dei pezzi fisici in produzione.</div></div>
        </div>
        <div class="workflow-card qr-cta">
          <div class="workflow-head">
            <div>
              <div class="qr-cta-title">Genera QR commessa</div>
              <div class="qr-cta-copy">Crea i QR dei singoli pezzi fisici e prepara la commessa alla produzione. Non interviene sul magazzino.</div>
            </div>
            <button class="btn cta" id="generate-qr-btn" onclick="generateStep51()" ${r.stato_analisi !== "PRONTA" ? "disabled" : ""}>Genera QR commessa</button>
          </div>
          <div id="step51-feedback" class="feedback"></div>
        </div>
      </section>
    `}

    <div class="footer-note">
      La commessa viene aggiornata dagli eventi reali generati dagli scan in officina.
    </div>`;

  renderFabbisognoRows("");
  renderAssemblyRows("");
}

function stateLabel(value) {
  const map = {
    DA_PRODURRE: "Da produrre",
    IN_ASSEMBLAGGIO: "In assemblaggio",
    COMPLETO: "Completo",
  };
  return map[value] || value || "—";
}

function stateClass(value) {
  if (value === "COMPLETO") return "done";
  if (value === "IN_ASSEMBLAGGIO") return "progress";
  return "";
}

function renderProgress(value) {
  const pct = Math.max(0, Math.min(100, Number(value || 0)));
  return `<div class="assembly-mini-progress">
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <span>${fmt(pct)}%</span>
  </div>`;
}

let fabbisognoCategory = "Tutte";

function renderFabbisognoSection() {
  const data = analysisData?.fabbisogno || { summary: [], detail: [], totals: {} };
  const summary = data.summary || [];
  const detail = data.detail || [];
  const totals = data.totals || {};
  const qrPieces = detail
    .filter(row => row.qr_scope === "PEZZO")
    .reduce((sum, row) => sum + Number(row.quantita || 0), 0);
  const noQrPieces = detail
    .filter(row => row.qr_scope !== "PEZZO")
    .reduce((sum, row) => sum + Number(row.quantita || 0), 0);
  const cards = [
    `<div class="need-card" onclick="filterFabbisogno('Tutte')">
      <div class="need-label">Totale fabbisogno documentale</div>
      <div class="need-value">${fmt(totals.quantita)}</div>
      <div class="need-sub">${fmt(qrPieces)} pezzi con QR + ${fmt(noQrPieces)} senza QR<br>${fmt(totals.righe)} righe aggregate · ${fmt(totals.peso_kg)} kg</div>
    </div>`,
    ...summary.map(row => `
      <div class="need-card" onclick="filterFabbisogno('${jsArg(row.categoria)}')">
        <div class="need-label">${esc(row.categoria)}</div>
        <div class="need-value">${fmt(row.quantita)}</div>
        <div class="need-sub">${row.origini?.includes("File bulloneria") ? "senza QR" : "pezzi con QR"} · ${fmt(row.righe)} righe · ${fmt(row.peso_kg)} kg<br>${esc((row.origini || []).join(" + ") || "—")}</div>
      </div>`)
  ].join("");
  return `<section class="section fabbisogno-section" id="fabbisogno-section">
    <div class="section-head">
      <div><div class="section-title">Fabbisogno commessa</div>
      <div class="section-sub">Materiali necessari ricavati dai file caricati. È una vista documentale: non modifica i QR.</div></div>
      <button class="btn details-toggle ${fabbisognoDetailsOpen ? "open" : ""}" id="fabbisogno-detail-btn" onclick="toggleFabbisognoDetails()">
        ${fabbisognoDetailsOpen ? "Nascondi" : "Dettagli"}
      </button>
    </div>
    <div class="needs-overview">${cards}</div>
    <div class="explanation">
      <strong>Nota operativa:</strong> i QR sono generati solo per i pezzi da distinta (${fmt(qrPieces)}). Il totale fabbisogno include anche la bulloneria/minuteria senza QR (${fmt(noQrPieces)}).
    </div>
    <div class="details-panel ${fabbisognoDetailsOpen ? "open" : ""}" id="fabbisogno-detail-panel">
      <div class="toolbar"><input class="search" id="fabbisogno-search" placeholder="Cerca categoria, profilo, norma, dimensione, origine…" oninput="renderFabbisognoRows(this.value)"/></div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Categoria</th><th>Codice</th><th>Descrizione</th><th>Materiale / norma</th><th>Dimensioni</th>
            <th class="right">Quantità</th><th class="right">Peso kg</th><th>Origine</th><th>QR</th>
          </tr></thead>
          <tbody id="fabbisogno-body"></tbody>
        </table>
      </div>
    </div>
  </section>`;
}

function toggleFabbisognoDetails() {
  fabbisognoDetailsOpen = !fabbisognoDetailsOpen;
  const panel = document.getElementById("fabbisogno-detail-panel");
  const button = document.getElementById("fabbisogno-detail-btn");
  if (panel) panel.classList.toggle("open", fabbisognoDetailsOpen);
  if (button) {
    button.classList.toggle("open", fabbisognoDetailsOpen);
    button.textContent = fabbisognoDetailsOpen ? "Nascondi" : "Dettagli";
  }
  if (fabbisognoDetailsOpen) renderFabbisognoRows(document.getElementById("fabbisogno-search")?.value || "");
}

function filterFabbisogno(category) {
  fabbisognoCategory = category || "Tutte";
  if (!fabbisognoDetailsOpen) toggleFabbisognoDetails();
  const input = document.getElementById("fabbisogno-search");
  renderFabbisognoRows(input?.value || "");
}

function renderFabbisognoRows(query) {
  const body = document.getElementById("fabbisogno-body");
  if (!body) return;
  const q = String(query || "").trim().toLowerCase();
  const rows = (analysisData?.fabbisogno?.detail || []).filter(row => {
    const categoryOk = fabbisognoCategory === "Tutte" || row.categoria === fabbisognoCategory;
    const text = [row.categoria, row.codice, row.descrizione, row.materiale_norma, row.dimensioni, row.origine_label, row.qr_scope]
      .map(value => String(value || "").toLowerCase()).join(" ");
    return categoryOk && (!q || text.includes(q));
  });
  body.innerHTML = rows.map(row => `
    <tr>
      <td><span class="mono">${esc(row.categoria || "—")}</span></td>
      <td>${esc(row.codice || "—")}</td>
      <td>${esc(row.descrizione || "—")}</td>
      <td>${esc(row.materiale_norma || "—")}</td>
      <td>${esc(row.dimensioni || "—")}</td>
      <td class="right">${fmt(row.quantita)} ${esc(row.unita || "pz")}</td>
      <td class="right">${fmt(row.peso_kg)}</td>
      <td><span class="origin-pill">${esc(row.origine_label || row.origine || "—")}</span></td>
      <td><span class="qr-pill ${row.qr_scope === "NESSUN_QR" ? "no" : ""}">${row.qr_scope === "NESSUN_QR" ? "No QR" : "QR pezzo"}</span></td>
    </tr>`).join("") || '<tr><td colspan="9">Nessun fabbisogno trovato</td></tr>';
}

function renderAssemblyRows(query) {
  const body = document.getElementById("assembly-body");
  if (!body) return;
  const q = String(query || "").trim().toLowerCase();
  const rows = (assemblyData?.assemblati || []).filter(row => {
    const pieceHit = (row.pieces || []).some(piece => [piece.qr_code, piece.marca_pos, piece.profilo].some(value => String(value || "").toLowerCase().includes(q)));
    return !q || String(row.assemblato || "").toLowerCase().includes(q) || pieceHit;
  });
  body.innerHTML = rows.map(row => `
    <tr onclick="openAssemblyModal('${jsArg(row.assemblato)}')">
      <td><span class="assembly-code">${esc(row.assemblato)}</span></td>
      <td class="right">${fmt(row.pezzi_previsti)}</td>
      <td class="right">${fmt(row.qr_attivi)}</td>
      <td class="right">${fmt(row.pezzi_entrati)}</td>
      <td class="right">${fmt(row.pezzi_completati)}</td>
      <td>${renderProgress(row.progress)}</td>
      <td><span class="assembly-state ${stateClass(row.stato)}">${stateLabel(row.stato)}</span></td>
    </tr>`).join("") || '<tr><td colspan="7">Nessun assemblato trovato</td></tr>';
}

function renderFileWarnings(revision) {
  const warnings = revision?.report?.file_warnings || [];
  if (!warnings.length) return "";
  return `<section class="section">
    <div class="section-head"><div><div class="section-title">Warning file non bloccanti</div>
    <div class="section-sub">L'analisi commessa è proseguita. Questi file possono essere inviati per verifica parsing/maintenance.</div></div></div>
    <div class="notice warn">
      ${warnings.map(item => `<div><strong>${esc(item.file || "File")}:</strong> ${esc(item.message || "Verifica file/parsing")}</div>`).join("")}
    </div>
  </section>`;
}

function renderPredistintaWarning(revision) {
  const chips = revisionData.map(row => `
    <div class="revision-chip${row.corrente ? " current" : ""}">
      ${esc(row.codice)} · ${row.predistinta ? "pre-distinta" : "definitiva"}
      ${row.corrente ? " · corrente" : " · archiviata"}
    </div>`).join("");
  return `<section class="section">
    <div class="section-head"><div><div class="section-title">Pre-distinta · analisi preliminare</div>
    <div class="section-sub">Analisi e QR possono essere preparati, ma la produzione resterà bloccata fino alla distinta definitiva</div></div></div>
    <div class="notice warn">
      Caricando la distinta definitiva verrà creata una nuova revisione: lo Step 4 sarà rieseguito e gli eventuali QR preliminari saranno archiviati e disattivati.
    </div>
    <div class="revision-list">${chips}</div>
    <form class="revision-form" onsubmit="uploadDefinitive(event)">
      <div class="upload-field"><label>Lista pezzi definitiva *</label><input type="file" id="def-lista" accept=".xls,.xlsx,.xlsm" required/></div>
      <div class="upload-field"><label>Pezzi e assemblati *</label><input type="file" id="def-assemblaggi" accept=".xls,.xlsx,.xlsm" required/></div>
      <div class="upload-field"><label>Lista spedizione non bloccante</label><input type="file" id="def-spedizione" accept=".xls,.xlsx,.xlsm"/></div>
      <div class="upload-field"><label>Bulloneria senza QR</label><input type="file" id="def-bulloneria" accept=".xls,.xlsx,.xlsm,.csv,.pdf"/></div>
      <div class="revision-actions">
        <span class="feedback" id="revision-feedback"></span>
        <button class="btn" id="revision-submit" type="submit">Carica distinta definitiva e riesegui Step 4</button>
      </div>
    </form>
  </section>`;
}

async function uploadDefinitive(event) {
  event.preventDefault();
  const button = document.getElementById("revision-submit");
  const feedback = document.getElementById("revision-feedback");
  const lista = document.getElementById("def-lista").files[0];
  const assemblaggi = document.getElementById("def-assemblaggi").files[0];
  const spedizione = document.getElementById("def-spedizione").files[0];
  const bulloneria = document.getElementById("def-bulloneria").files[0];
  if (!lista || !assemblaggi) return;
  button.disabled = true;
  feedback.className = "feedback";
  feedback.textContent = "Caricamento e nuova analisi in corso…";
  const body = new FormData();
  body.append("lista_pezzi", lista);
  body.append("assemblaggi", assemblaggi);
  if (spedizione) body.append("spedizione", spedizione);
  if (bulloneria) body.append("bulloneria", bulloneria);
  body.append("predistinta", "false");
  try {
    const response = await fetch(`/api/v1/commesse/${commessaId}/analisi`, {
      method: "POST", headers: auth(), body,
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const detail = data.detail || "Impossibile analizzare la distinta definitiva";
      throw new Error(response.status === 422 ? `File non importabile. Verifica file/parsing. ${detail}` : detail);
    }
    location.reload();
  } catch (error) {
    feedback.className = "feedback error";
    feedback.textContent = error.message || String(error);
    button.disabled = false;
  }
}

async function generateStep51() {
  const button = document.getElementById("generate-qr-btn");
  const feedback = document.getElementById("step51-feedback");
  button.disabled = true;
  feedback.textContent = "Generazione dei record QR in corso…";
  try {
    const response = await fetch(`/api/v1/commesse/${commessaId}/step-5-1`, {
      method: "POST", headers: auth(),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || "Impossibile generare i QR della commessa");
    await load();
  } catch (error) {
    feedback.className = "feedback error";
    feedback.textContent = error.message || String(error);
    button.disabled = false;
  }
}

function searchQrItems(value) {
  qrQuery = String(value || "").trim();
  qrPage = 0;
  loadQrItems();
}

async function changeQrPage(delta) {
  qrPage = Math.max(0, qrPage + delta);
  await loadQrItems();
}

function openQrRegistry() {
  if (window.stqcNavigate) return window.stqcNavigate(commessaUrl("officina"));
  location.href = commessaUrl("officina");
}

function closeQrRegistry() {
  document.getElementById("qr-registry-modal").classList.remove("open");
}

async function loadQrItems() {
  const target = document.getElementById("qr-items");
  if (!target) return;
  const params = new URLSearchParams({
    skip: String(qrPage * qrPageSize),
    limit: String(qrPageSize),
  });
  if (qrQuery) params.set("q", qrQuery);
  try {
    const response = await fetch(`/api/v1/commesse/${commessaId}/step-5-1/items?${params}`, { headers: auth() });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || "QR non disponibili");
    currentQrItems = data.items || [];
    const count = document.getElementById("qr-registry-count");
    if (count) count.textContent = `${fmt(data.total)} QR`;
    renderQrRegistryCards();
  } catch (error) {
    target.innerHTML = `<div class="notice warn">${esc(error.message || error)}</div>`;
  }
}

function renderQrRegistryCards() {
  const target = document.getElementById("qr-items");
  if (!target) return;
  target.innerHTML = `
    <div class="qr-grid">
      ${currentQrItems.map(item => `<div class="qr-card" onclick="QrDrawer.open('${jsArg(item.uuid)}')">
        <input type="checkbox" ${selectedQrPieces.has(item.uuid) ? "checked" : ""} onclick="togglePieceQrSelection('${jsArg(item.uuid)}',event)" style="position:absolute;right:12px;top:12px;width:20px;height:20px">
        <img src="${esc(item.qr_image_url)}" alt="QR ${esc(item.qr_code || item.part_number)}"/>
        <div>
          <div class="qr-field-label">Marca pezzo</div>
          <div class="qr-code">${esc(item.qr_code || item.part_number || "SENZA CODICE")}</div>
          <div class="qr-meta" style="margin-top:10px">
            <div class="qr-field-label">Tipo</div>
            <div class="qr-field-value">${esc(item.tipo || "—")}</div>
          </div>
          <a class="qr-link" href="#" onclick="printCommessaLabel('${esc(item.label_url)}',event)">Stampa etichetta</a>
        </div>
      </div>`).join("")}
    </div>`;
}

function togglePieceQrSelection(uuid,event) {
  event.stopPropagation();
  if (selectedQrPieces.has(uuid)) selectedQrPieces.delete(uuid); else selectedQrPieces.add(uuid);
  renderQrRegistryCards();
}

function openSelectedPieceDetails() {
  const values = [...selectedQrPieces];
  if (!values.length) return;
  if (values.length === 1) QrDrawer.open(values[0]); else QrDrawer.openMany(values);
}

function openAssemblyModal(assemblato) {
  const row = (assemblyData?.assemblati || []).find(item => String(item.assemblato) === String(assemblato));
  if (!row) return;
  document.getElementById("assembly-modal-title").textContent = row.assemblato;
  document.getElementById("assembly-modal-sub").textContent =
    `${fmt(row.pezzi_previsti)} pezzi previsti · ${fmt(row.pezzi_completati)} completati · ${fmt(row.progress)}%`;
  document.getElementById("assembly-modal-body").innerHTML = `
    <div class="detail-grid">
      <div class="detail-card"><div class="assembly-card-label">Pezzi previsti</div><div class="assembly-card-value">${fmt(row.pezzi_previsti)}</div></div>
      <div class="detail-card"><div class="assembly-card-label">Entrati in assemblaggio</div><div class="assembly-card-value">${fmt(row.pezzi_entrati)}</div></div>
      <div class="detail-card"><div class="assembly-card-label">Completati</div><div class="assembly-card-value">${fmt(row.pezzi_completati)}</div></div>
      <div class="detail-card"><div class="assembly-card-label">Stato</div><div class="assembly-card-value" style="font-size:18px">${stateLabel(row.stato)}</div></div>
    </div>
    <div class="assembly-progress-card" style="margin-bottom:16px">
      <div class="assembly-card-label">Avanzamento assemblato</div>
      <div class="assembly-card-value">${fmt(row.progress)}%</div>
      <div class="progress-track"><div class="progress-fill" style="width:${Math.max(0, Math.min(100, Number(row.progress || 0)))}%"></div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Pezzo</th><th>Profilo</th><th>Qualità</th><th>Stato</th><th>Ultima postazione</th><th>Ultimo evento</th></tr></thead>
        <tbody>
          ${(row.pieces || []).map(piece => `
            <tr>
              <td class="mono"><span class="piece-status-dot ${piece.completed_assembly ? "done" : piece.entered_assembly ? "progress" : ""}"></span>${esc(piece.qr_code || piece.marca_pos)}</td>
              <td>${esc(piece.profilo || "—")}</td>
              <td>${esc(piece.qualita || "—")}</td>
              <td>${esc(piece.stato || "—")}</td>
              <td>${esc(piece.ultima_postazione || "—")}</td>
              <td>${esc(piece.ultimo_evento || "—")}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>`;
  document.getElementById("assembly-modal").classList.add("open");
}

function closeAssemblyModal() {
  document.getElementById("assembly-modal").classList.remove("open");
}

function openQrModal(qrCode) {
  const item = currentQrItems.find(row => String(row.qr_code) === String(qrCode));
  if (!item) return;
  currentQrDetail = { ...item };
  qrEditUnlocked = false;
  renderQrModal();
  document.getElementById("qr-modal").classList.add("open");
}

function renderQrModal() {
  const item = currentQrDetail;
  if (!item) return;
  document.getElementById("qr-modal-title").textContent = item.qr_code || item.part_number || "QR pezzo";
  document.getElementById("qr-modal-sub").textContent = `Marca pezzo ${item.part_number || "—"} · Tipo ${item.tipo || "—"}`;
  document.getElementById("qr-modal-body").innerHTML = `
    <div class="qr-detail">
      <img src="${esc(item.qr_image_url)}" alt="QR ${esc(item.qr_code || item.part_number)}"/>
      <div>
        <div class="detail-grid" style="grid-template-columns:repeat(2,1fr)">
          <div class="detail-card"><div class="assembly-card-label">Marca pezzo / QR</div><div class="assembly-card-value" style="font-size:19px">${esc(item.qr_code || "—")}</div></div>
          <div class="detail-card"><div class="assembly-card-label">Tipo</div><div class="assembly-card-value" style="font-size:19px">${esc(item.tipo || "—")}</div></div>
          <div class="detail-card"><div class="assembly-card-label">Assemblato</div><div class="assembly-card-value" style="font-size:19px">${esc(item.assemblato || "—")}</div></div>
          <div class="detail-card"><div class="assembly-card-label">Stato</div><div class="assembly-card-value" style="font-size:19px">${esc(item.stato || "—")}</div></div>
        </div>
        <div class="qr-edit-grid">
          <div class="qr-edit-field"><label>Tipo</label><input id="qr-edit-tipo" value="${esc(item.tipo || "")}" ${qrEditUnlocked ? "" : "disabled"}/></div>
          <div class="qr-edit-field"><label>Assemblato</label><input id="qr-edit-assemblato" value="${esc(item.assemblato || "")}" ${qrEditUnlocked ? "" : "disabled"}/></div>
          <div class="qr-edit-field"><label>Profilo interno</label><input id="qr-edit-profilo" value="${esc(item.profilo || "")}" ${qrEditUnlocked ? "" : "disabled"}/></div>
          <div class="qr-edit-field"><label>Qualità</label><input id="qr-edit-qualita" value="${esc(item.qualita || "")}" ${qrEditUnlocked ? "" : "disabled"}/></div>
          <div class="qr-edit-field"><label>Stato</label><input id="qr-edit-stato" value="${esc(item.stato || "")}" ${qrEditUnlocked ? "" : "disabled"}/></div>
        </div>
        <div class="feedback" id="qr-edit-feedback"></div>
        <div class="qr-edit-actions">
          <button class="btn secondary" onclick="toggleQrEdit()">${qrEditUnlocked ? "🔒 Blocca modifiche" : "🔓 Abilita modifiche"}</button>
          ${qrEditUnlocked ? `<button class="btn" id="qr-save-btn" onclick="saveQrManualEdit()">Salva modifiche</button>` : ""}
          <button class="btn cta" style="min-width:0" onclick="printCommessaLabel('${esc(item.label_url)}',event)">Stampa etichetta</button>
        </div>
      </div>
    </div>`;
}

function closeQrModal() {
  document.getElementById("qr-modal").classList.remove("open");
  currentQrDetail = null;
  qrEditUnlocked = false;
}

function toggleQrEdit() {
  qrEditUnlocked = !qrEditUnlocked;
  renderQrModal();
  if (qrEditUnlocked) setTimeout(() => document.getElementById("qr-edit-tipo")?.focus(), 40);
}

async function saveQrManualEdit() {
  if (!currentQrDetail?.id) return;
  const feedback = document.getElementById("qr-edit-feedback");
  const button = document.getElementById("qr-save-btn");
  feedback.className = "feedback";
  feedback.textContent = "Salvataggio modifiche…";
  button.disabled = true;
  try {
    const payload = {
      tipo: document.getElementById("qr-edit-tipo").value.trim() || null,
      assemblato: document.getElementById("qr-edit-assemblato").value.trim() || null,
      profilo: document.getElementById("qr-edit-profilo").value.trim() || null,
      qualita: document.getElementById("qr-edit-qualita").value.trim() || null,
      stato: document.getElementById("qr-edit-stato").value.trim() || null,
    };
    const response = await fetch(`/api/v1/commesse/${commessaId}/step-5-1/items/${currentQrDetail.id}`, {
      method: "PATCH",
      headers: { ...auth(), "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || "Salvataggio non riuscito");
    currentQrDetail = data;
    currentQrItems = currentQrItems.map(item => item.id === data.id ? data : item);
    qrEditUnlocked = false;
    renderQrModal();
    renderQrRegistryCards();
    const refreshed = await fetch(`/api/v1/commesse/${commessaId}/analisi/assemblati`, { headers: auth() });
    if (refreshed.ok) {
      assemblyData = await refreshed.json();
      renderAssemblyRows(document.getElementById("assembly-search")?.value || "");
    }
  } catch (error) {
    feedback.className = "feedback error";
    feedback.textContent = error.message || String(error);
    button.disabled = false;
  }
}

async function printCommessaLabel(url, event) {
  event.preventDefault();
  event.stopPropagation();
  try {
    const response = await fetch(url, { headers: auth() });
    const data = response.ok ? await response.blob() : await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || "Etichetta non disponibile");
    const objectUrl = URL.createObjectURL(data);
    window.open(objectUrl, "_blank", "noopener");
    setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);
  } catch (error) {
    alert(error.message || String(error));
  }
}

function renderPositions(query) {
  const q = String(query || "").trim().toLowerCase();
  const rows = analysisData.positions.filter(row =>
    [row.part_number, row.profilo, row.qualita, ...(row.assemblati || [])]
      .some(value => String(value || "").toLowerCase().includes(q))
  );
  document.getElementById("positions-body").innerHTML = rows.map(row => `
    <tr>
      <td class="mono">${esc(row.part_number)}</td>
      <td>${esc(row.profilo || "—")}</td>
      <td>${esc(row.qualita || "—")}</td>
      <td class="right">${fmt(row.quantita)}</td>
      <td>${row.assemblati.length ? esc(row.assemblati.join(", ")) : "—"}</td>
    </tr>`).join("") || '<tr><td colspan="5">Nessun part number trovato</td></tr>';
}

async function load() {
  try {
    await resolveCommessa();
    const [analysisResponse, assembliesResponse, revisionsResponse] = await Promise.all([
      fetch(`/api/v1/commesse/${commessaId}/analisi`, { headers: auth() }),
      fetch(`/api/v1/commesse/${commessaId}/analisi/assemblati`, { headers: auth() }),
      fetch(`/api/v1/commesse/${commessaId}/revisioni`, { headers: auth() }),
    ]);
    const analysis = await analysisResponse.json().catch(() => ({}));
    const assemblies = await assembliesResponse.json().catch(() => ({}));
    const revisions = await revisionsResponse.json().catch(() => ([]));
    if (!analysisResponse.ok) throw new Error(analysis.detail || "Analisi non disponibile");
    if (!assembliesResponse.ok) throw new Error(assemblies.detail || "Assemblati non disponibili");
    if (!revisionsResponse.ok) throw new Error(revisions.detail || "Revisioni non disponibili");
    analysisData = analysis;
    commessaCode = analysisData?.commessa?.codice || commessaCode;
    assemblyData = assemblies;
    revisionData = revisions;
    renderPage();
  } catch (error) {
    document.getElementById("root").innerHTML = `<div class="notice warn">⚠ ${esc(error.message || error)}</div>`;
  }
}
load();
</script>
