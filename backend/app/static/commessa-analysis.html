<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="stylesheet" href="/static/qr-drawer.css">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Analisi Commessa · MCC</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a1020; --panel: #11192b; --panel2: #161f32;
      --border: rgba(255,255,255,.08); --text: #e7edf7;
      --secondary: #91a0b4; --muted: #536177; --blue: #3b82f6;
      --green: #4ade80; --yellow: #fbbf24; --orange: #fb923c; --red: #f87171;
    }
    html, body {
      min-height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .nav {
      height: 58px; padding: 0 28px; position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 10px;
      background: rgba(8,15,31,.96); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav a { color: var(--secondary); text-decoration: none; font-size: 12px; }
    .nav a:hover { color: var(--text); }
    .nav-sep { color: var(--muted); }
    .nav-current { font-size: 12px; font-weight: 700; }
    .nav-user { margin-left: auto; font-size: 11px; color: var(--muted); }
    .page { max-width: 1320px; margin: 0 auto; padding: 38px 32px 70px; }
    .header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 24px; margin-bottom: 28px;
    }
    .eyebrow {
      color: var(--muted); font-size: 10px; font-weight: 800;
      letter-spacing: .14em; text-transform: uppercase; margin-bottom: 7px;
    }
    h1 { font-size: 31px; letter-spacing: -.035em; line-height: 1.1; }
    .subtitle { margin-top: 8px; color: var(--secondary); font-size: 13px; line-height: 1.5; }
    .status {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 13px; border-radius: 20px;
      font-size: 11px; font-weight: 800; white-space: nowrap;
    }
    .status.ok { color: var(--green); background: rgba(74,222,128,.09); border: 1px solid rgba(74,222,128,.25); }
    .status.warn { color: var(--yellow); background: rgba(251,191,36,.09); border: 1px solid rgba(251,191,36,.25); }
    .pre {
      margin-left: 8px; color: var(--orange); background: rgba(251,146,60,.09);
      border: 1px solid rgba(251,146,60,.25);
    }
    .steps {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 8px; margin-bottom: 26px;
    }
    .step {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 13px; border: 1px solid var(--border);
      border-radius: 11px; background: rgba(255,255,255,.025);
    }
    .step-num {
      width: 25px; height: 25px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(59,130,246,.13); color: #93c5fd;
      font-size: 11px; font-weight: 800;
    }
    .step-label { font-size: 11px; font-weight: 700; color: var(--secondary); }
    .section {
      margin-bottom: 22px; padding: 22px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    }
    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; margin-bottom: 17px;
    }
    .section-title { font-size: 15px; font-weight: 850; }
    .section-sub { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .file-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .file-card {
      min-height: 90px; padding: 14px; border-radius: 11px;
      background: var(--panel2); border: 1px solid var(--border);
    }
    .file-kind { color: var(--muted); font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .09em; }
    .file-name { margin-top: 8px; font-size: 12px; font-weight: 700; word-break: break-word; }
    .file-state { margin-top: 7px; font-size: 10px; color: var(--green); }
    .file-card.empty .file-name, .file-card.empty .file-state { color: var(--muted); }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .kpi {
      padding: 16px; border-radius: 11px;
      background: var(--panel2); border: 1px solid var(--border);
    }
    .kpi-label { color: var(--muted); font-size: 9px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    .kpi-value { margin-top: 6px; font-size: 25px; font-weight: 900; letter-spacing: -.025em; }
    .toolbar { display: flex; gap: 10px; margin: 17px 0 11px; }
    .search {
      flex: 1; padding: 9px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: #0c1322;
      color: var(--text); outline: none; font: inherit; font-size: 12px;
    }
    .search:focus { border-color: rgba(59,130,246,.5); }
    .table-wrap {
      max-height: 390px; overflow: auto; border-radius: 10px;
      border: 1px solid var(--border);
      scrollbar-color: #46556b #101827;
      scrollbar-width: thin;
    }
    .table-wrap::-webkit-scrollbar { width: 8px; height: 8px; }
    .table-wrap::-webkit-scrollbar-track { background: #101827; }
    .table-wrap::-webkit-scrollbar-thumb { background: #46556b; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th {
      position: sticky; top: 0; z-index: 2; padding: 9px 11px;
      text-align: left; background: #1b2538; color: #73849a;
      text-transform: uppercase; letter-spacing: .08em; font-size: 9px;
    }
    td { padding: 9px 11px; color: var(--secondary); border-top: 1px solid rgba(255,255,255,.045); }
    tbody tr:nth-child(even) { background: rgba(255,255,255,.018); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); font-weight: 700; }
    .right { text-align: right; }
    .notice {
      padding: 13px 15px; border-radius: 10px; font-size: 12px; line-height: 1.5;
      background: rgba(74,222,128,.06); border: 1px solid rgba(74,222,128,.16); color: #86efac;
    }
    .notice.warn { background: rgba(251,191,36,.06); border-color: rgba(251,191,36,.18); color: #fcd34d; }
    .explanation {
      margin: 13px 0 16px; padding: 13px 15px; border-radius: 10px;
      background: rgba(59,130,246,.06); border: 1px solid rgba(59,130,246,.16);
      color: var(--secondary); font-size: 11px; line-height: 1.55;
    }
    .explanation strong { color: #bfdbfe; }
    .anomaly-list { display: flex; flex-direction: column; gap: 7px; }
    .anomaly {
      padding: 10px 12px; border-radius: 9px; font-size: 11px;
      background: rgba(248,113,113,.06); border: 1px solid rgba(248,113,113,.16); color: #fca5a5;
    }
    .anomaly.warning {
      background: rgba(251,191,36,.06); border-color: rgba(251,191,36,.16); color: #fcd34d;
    }
    .stock-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
    .stock-kpi {
      padding: 13px; border-radius: 10px; text-align: center; cursor: pointer;
      border: 1px solid var(--border); background: var(--panel2); transition: border-color .15s;
    }
    .stock-kpi:hover, .stock-kpi.active { border-color: rgba(59,130,246,.55); }
    .stock-num { font-size: 22px; font-weight: 900; }
    .stock-label { margin-top: 4px; color: var(--muted); font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; }
    .stock-meta { margin-top: 5px; color: var(--secondary); font-size: 10px; }
    .footer-note {
      margin-top: 22px; padding: 15px; text-align: center;
      color: var(--secondary); font-size: 12px;
      border: 1px dashed var(--border); border-radius: 11px;
    }
    .workflow-card {
      padding: 18px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--panel2);
    }
    .workflow-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .workflow-title { font-size: 14px; font-weight: 850; }
    .workflow-copy { margin-top: 5px; color: var(--secondary); font-size: 11px; line-height: 1.55; }
    .btn {
      border: 1px solid rgba(59,130,246,.38); border-radius: 9px; padding: 10px 15px;
      color: #dbeafe; background: rgba(59,130,246,.16); font: inherit;
      font-size: 11px; font-weight: 800; cursor: pointer; white-space: nowrap;
    }
    .btn:hover { background: rgba(59,130,246,.25); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn.secondary { background: transparent; border-color: var(--border); color: var(--secondary); }
    .btn.cta {
      min-width: 240px; padding: 15px 24px; border-radius: 14px;
      background: linear-gradient(135deg, #3b82f6, #5b5cf6);
      border-color: rgba(147,197,253,.45);
      color: #fff; font-size: 13px;
      box-shadow: 0 16px 40px rgba(59,130,246,.24), inset 0 1px 0 rgba(255,255,255,.18);
    }
    .btn.cta:hover {
      background: linear-gradient(135deg, #4f8df8, #6868ff);
      box-shadow: 0 20px 54px rgba(59,130,246,.32), inset 0 1px 0 rgba(255,255,255,.22);
    }
    .qr-cta {
      position: relative; overflow: hidden;
      padding: 28px; border-radius: 18px;
      background:
        radial-gradient(circle at 82% 18%, rgba(59,130,246,.22), transparent 34%),
        linear-gradient(135deg, rgba(59,130,246,.10), rgba(255,255,255,.025)),
        var(--panel2);
      border: 1px solid rgba(147,197,253,.20);
    }
    .qr-cta::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(110deg, rgba(255,255,255,.05), transparent 38%);
    }
    .qr-cta .workflow-head { position: relative; z-index: 1; }
    .qr-cta-title { font-size: 23px; font-weight: 900; letter-spacing: -.035em; }
    .qr-cta-copy { margin-top: 8px; max-width: 720px; color: var(--secondary); font-size: 12px; line-height: 1.55; }
    .revision-form {
      display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px;
      margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border);
    }
    .upload-field {
      padding: 11px; border: 1px dashed rgba(255,255,255,.16);
      border-radius: 9px; background: #0c1322;
    }
    .upload-field label { display: block; margin-bottom: 6px; color: var(--secondary); font-size: 10px; font-weight: 750; }
    .upload-field input { width: 100%; color: var(--secondary); font-size: 10px; }
    .revision-actions { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .feedback { color: var(--secondary); font-size: 11px; }
    .feedback.error { color: var(--red); }
    .qr-summary { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
    .qr-count { font-size: 26px; font-weight: 900; color: var(--green); }
    .qr-summary-card {
      display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 22px;
      padding: 24px; border-radius: 18px; border: 1px solid rgba(147,197,253,.18);
      background:
        radial-gradient(circle at 90% 15%, rgba(74,222,128,.15), transparent 34%),
        linear-gradient(135deg, rgba(59,130,246,.08), rgba(255,255,255,.025)),
        var(--panel2);
    }
    .qr-summary-number { font-size: 44px; line-height: 1; font-weight: 950; color: var(--green); letter-spacing: -.04em; }
    .qr-summary-actions { display: flex; align-items: center; gap: 18px; }
    .registry-modal { width: min(1480px, 96vw); }
    .registry-tools {
      display: flex; align-items: center; gap: 12px; padding: 0 26px 20px;
      border-bottom: 1px solid var(--border);
    }
    .registry-count { color: var(--secondary); font-size: 11px; font-weight: 800; white-space: nowrap; }
    .registry-scroll { max-height: calc(88vh - 175px); overflow: auto; padding: 22px 26px 26px; }
    .qr-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px; margin-top: 12px;
    }
    .qr-card {
      position: relative;
      display: grid; grid-template-columns: 88px 1fr; gap: 14px; align-items: center;
      min-width: 0; padding: 13px; border: 1px solid var(--border);
      border-radius: 14px; background: #0c1322; cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }
    .qr-card:hover { transform: translateY(-1px); border-color: rgba(147,197,253,.26); background: #10192b; }
    .qr-card img { width: 88px; height: 88px; padding: 5px; border-radius: 8px; background: #fff; image-rendering: pixelated; }
    .qr-code { font-size: 12px; font-weight: 900; color: var(--text); overflow-wrap: anywhere; }
    .qr-field-label { color: var(--muted); font-size: 8px; font-weight: 900; letter-spacing: .09em; text-transform: uppercase; }
    .qr-field-value { margin-top: 3px; color: var(--secondary); font-size: 11px; font-weight: 800; overflow-wrap: anywhere; }
    .qr-meta { margin-top: 6px; color: var(--muted); font-size: 10px; line-height: 1.45; }
    .qr-link { display: inline-block; margin-top: 8px; color: #93c5fd; font-size: 10px; font-weight: 800; text-decoration: none; }
    .pagination { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 12px; color: var(--muted); font-size: 10px; }
    .assembly-overview {
      display: grid; grid-template-columns: 1.1fr repeat(4, minmax(120px, .7fr));
      gap: 10px; margin-bottom: 15px;
    }
    .assembly-progress-card {
      padding: 16px; border-radius: 13px; border: 1px solid rgba(147,197,253,.14);
      background:
        radial-gradient(circle at 85% 10%, rgba(59,130,246,.16), transparent 36%),
        var(--panel2);
    }
    .assembly-card-label { color: var(--muted); font-size: 9px; font-weight: 850; letter-spacing: .09em; text-transform: uppercase; }
    .assembly-card-value { margin-top: 7px; font-size: 25px; font-weight: 950; letter-spacing: -.035em; }
    .assembly-card-sub { margin-top: 5px; color: var(--secondary); font-size: 10px; }
    .progress-track {
      height: 9px; margin-top: 12px; border-radius: 999px; overflow: hidden;
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.05);
    }
    .progress-fill {
      height: 100%; border-radius: inherit;
      background: linear-gradient(90deg, #3b82f6, #4ade80);
      box-shadow: 0 0 18px rgba(74,222,128,.22);
    }
    .assembly-table tbody tr { cursor: pointer; }
    .assembly-table tbody tr:hover { background: rgba(59,130,246,.055); }
    .assembly-code { font-size: 12px; font-weight: 900; color: var(--text); }
    .assembly-state {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 118px; padding: 5px 9px; border-radius: 999px;
      font-size: 9px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase;
      border: 1px solid var(--border); background: rgba(255,255,255,.035); color: var(--secondary);
    }
    .assembly-state.progress { color: #bfdbfe; background: rgba(59,130,246,.10); border-color: rgba(59,130,246,.26); }
    .assembly-state.done { color: var(--green); background: rgba(74,222,128,.09); border-color: rgba(74,222,128,.25); }
    .assembly-mini-progress { display: grid; grid-template-columns: 1fr 42px; align-items: center; gap: 9px; }
    .assembly-mini-progress .progress-track { margin: 0; height: 7px; }
    .assembly-mini-progress span { text-align: right; color: var(--text); font-size: 11px; font-weight: 850; }
    .modal-backdrop {
      display: none; position: fixed; inset: 0; z-index: 50;
      background: rgba(2,6,16,.74); backdrop-filter: blur(14px);
      align-items: center; justify-content: center; padding: 28px;
    }
    .modal-backdrop.open { display: flex; }
    .premium-modal {
      width: min(1050px, 96vw); max-height: 88vh; overflow: hidden;
      border-radius: 22px; border: 1px solid rgba(147,197,253,.18);
      background:
        radial-gradient(circle at 85% 0%, rgba(59,130,246,.13), transparent 34%),
        #101827;
      box-shadow: 0 28px 90px rgba(0,0,0,.66);
      display: flex; flex-direction: column;
    }
    .modal-head {
      display: flex; justify-content: space-between; gap: 18px;
      padding: 24px 26px 18px; border-bottom: 1px solid var(--border);
    }
    .modal-title { font-size: 24px; font-weight: 950; letter-spacing: -.04em; }
    .modal-sub { margin-top: 6px; color: var(--secondary); font-size: 12px; }
    .modal-close {
      width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border);
      background: rgba(255,255,255,.04); color: var(--secondary); cursor: pointer;
      font-size: 20px; font-weight: 700;
    }
    .modal-body { padding: 22px 26px 26px; overflow: auto; }
    .detail-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
    .detail-card {
      padding: 13px; border-radius: 13px; border: 1px solid var(--border);
      background: rgba(255,255,255,.025);
    }
    .piece-status-dot {
      display: inline-flex; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px;
      background: var(--muted);
    }
    .piece-status-dot.done { background: var(--green); }
    .piece-status-dot.progress { background: var(--blue); }
    .qr-detail { display: grid; grid-template-columns: 190px 1fr; gap: 22px; align-items: start; }
    .qr-detail img { width: 190px; height: 190px; padding: 10px; border-radius: 15px; background: #fff; image-rendering: pixelated; }
    .qr-edit-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
    .qr-edit-field label { display:block; color:var(--muted); font-size:9px; font-weight:850; letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; }
    .qr-edit-field input {
      width:100%; padding:10px 11px; border-radius:10px; border:1px solid var(--border);
      background:#0c1322; color:var(--text); font:inherit; font-size:12px; outline:none;
    }
    .qr-edit-field input:disabled { opacity:.55; cursor:not-allowed; }
    .qr-edit-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:14px; }
    .revision-list { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; }
    .revision-chip {
      padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
      color: var(--secondary); background: rgba(255,255,255,.02); font-size: 10px;
    }
    .revision-chip.current { color: #bfdbfe; border-color: rgba(59,130,246,.35); }
    .loader {
      min-height: 360px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; color: var(--muted);
    }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.08); border-top-color: var(--blue);
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 900px) {
      .steps, .kpis { grid-template-columns: repeat(2, 1fr); }
      .assembly-overview { grid-template-columns: repeat(2, 1fr); }
      .detail-grid { grid-template-columns: repeat(2, 1fr); }
      .qr-summary-card { grid-template-columns: 1fr; }
      .file-grid { grid-template-columns: 1fr; }
      .stock-kpis { grid-template-columns: repeat(2, 1fr); }
      .revision-form { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      .page { padding: 24px 14px 50px; }
      .header { flex-direction: column; }
      .steps, .kpis, .assembly-overview, .detail-grid, .qr-detail, .qr-edit-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<script>
(function() {
  const token = sessionStorage.getItem("stqc_token");
  const profile = sessionStorage.getItem("stqc_profilo");
  if (!token) { location.replace("/login"); return; }
  if (!["Direttore", "Capo Officina", "Progettazione", "Admin"].includes(profile)) location.replace("/");
})();
</script>

<nav class="nav">
  <a href="/commesse">← In corso</a>
  <span class="nav-sep">/</span>
  <span class="nav-current" id="nav-code">Analisi Commessa</span>
  <span class="nav-user" id="nav-user"></span>
</nav>

<main class="page" id="root">
  <div class="loader"><div class="spinner"></div><span>Analisi della commessa…</span></div>
</main>

<div class="modal-backdrop" id="assembly-modal" onclick="closeAssemblyModal()">
  <div class="premium-modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div>
        <div class="eyebrow">Assemblato</div>
        <div class="modal-title" id="assembly-modal-title">—</div>
        <div class="modal-sub" id="assembly-modal-sub">Dettaglio pezzi collegati</div>
      </div>
      <button class="modal-close" onclick="closeAssemblyModal()">×</button>
    </div>
    <div class="modal-body" id="assembly-modal-body"></div>
  </div>
</div>

<div class="modal-backdrop" id="qr-modal" onclick="closeQrModal()">
  <div class="premium-modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div>
        <div class="eyebrow">QR pezzo</div>
        <div class="modal-title" id="qr-modal-title">—</div>
        <div class="modal-sub" id="qr-modal-sub">Scheda pezzo fisico</div>
      </div>
      <button class="modal-close" onclick="closeQrModal()">×</button>
    </div>
    <div class="modal-body" id="qr-modal-body"></div>
  </div>
</div>

<div class="modal-backdrop" id="qr-registry-modal" onclick="closeQrRegistry()">
  <div class="premium-modal registry-modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div>
        <div class="eyebrow">QR commessa</div>
        <div class="modal-title">Registro QR pezzi</div>
        <div class="modal-sub">Marca pezzo, tipo e QR scannerizzabile</div>
      </div>
      <button class="modal-close" onclick="closeQrRegistry()">×</button>
    </div>
    <div class="registry-tools">
      <input class="search" id="qr-registry-search" placeholder="Cerca marca pezzo, tipo, assemblato o stato…" oninput="searchQrItems(this.value)"/>
      <button class="btn secondary" onclick="openSelectedPieceDetails()">Dettagli selezionati</button>
      <span class="registry-count" id="qr-registry-count">—</span>
    </div>
    <div class="registry-scroll" id="qr-items">
      <div class="loader"><div class="spinner"></div><span>Caricamento QR…</span></div>
    </div>
  </div>
</div>

<script>
const commessaId = Number(location.pathname.split("/").filter(Boolean).at(-2));
const auth = () => ({ Authorization: "Bearer " + sessionStorage.getItem("stqc_token") });
let analysisData = null;
let stockData = null;
let assemblyData = null;
let revisionData = [];
let stockFilter = "tutti";
let qrPage = 0;
const qrPageSize = 5000;
let qrQuery = "";
let currentQrItems = [];
let currentQrDetail = null;
let qrEditUnlocked = false;
const selectedQrPieces = new Set();

document.getElementById("nav-user").textContent =
  `${sessionStorage.getItem("stqc_nome") || ""} · ${sessionStorage.getItem("stqc_profilo") || ""}`;

function esc(value) {
  return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fmt(value) {
  return Number(value || 0).toLocaleString("it-IT", { maximumFractionDigits: 2 });
}
function basename(path) {
  return path ? String(path).split("/").pop() : null;
}
function jsArg(value) {
  return String(value ?? "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
}

function fileCard(kind, name, emptyText) {
  return `<div class="file-card${name ? "" : " empty"}">
    <div class="file-kind">${kind}</div>
    <div class="file-name">${esc(name || emptyText)}</div>
    <div class="file-state">${name ? "✓ Acquisito" : "Non caricato"}</div>
  </div>`;
}

function renderPage() {
  const c = analysisData.commessa;
  const r = analysisData.revisione;
  const s = analysisData.summary;
  document.title = `Analisi ${c.codice} · MCC`;
  document.getElementById("nav-code").textContent = `${c.codice} · Analisi`;

  document.getElementById("root").innerHTML = `
    <header class="header">
      <div>
        <div class="eyebrow">Gestione Commesse</div>
        <h1>Analisi ${esc(c.codice)}</h1>
        <div class="subtitle">${esc(c.cliente || "Cliente non specificato")} · Distinta acquisita</div>
      </div>
      <div>
        <span class="status ${r.stato_analisi === "PRONTA" ? "ok" : "warn"}">
          ${r.stato_analisi === "PRONTA" ? "✓ Analisi coerente" : "⚠ Da verificare"}
        </span>
        ${r.predistinta ? '<span class="status pre">Pre-distinta</span>' : ""}
      </div>
    </header>

    <div class="steps">
      <div class="step"><span class="step-num">1</span><span class="step-label">File acquisiti</span></div>
      <div class="step"><span class="step-num">2</span><span class="step-label">Distinta letta</span></div>
      <div class="step"><span class="step-num">3</span><span class="step-label">Assemblati</span></div>
      <div class="step"><span class="step-num">4</span><span class="step-label">QR commessa</span></div>
    </div>

    ${r.predistinta ? renderPredistintaWarning(r) : ""}

    <section class="section">
      <div class="section-head">
        <div><div class="section-title">File acquisiti</div>
        <div class="section-sub">Documenti originali conservati per questa commessa</div></div>
      </div>
      <div class="file-grid">
        ${fileCard("Lista pezzi", basename(r.files.lista_pezzi), "File obbligatorio non disponibile")}
        ${fileCard("Pezzi e assemblati", basename(r.files.assemblaggi), "Nessuna gerarchia caricata")}
        ${fileCard("Lista spedizione", basename(r.files.spedizione), "File obbligatorio non disponibile")}
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <div><div class="section-title">Distinta letta</div>
        <div class="section-sub">Pezzi, assemblati e profili raggruppati in un'unica vista di controllo</div></div>
      </div>
      <div class="kpis">
        <div class="kpi"><div class="kpi-label">Pezzi fisici</div><div class="kpi-value">${fmt(s.n_pezzi)}</div></div>
        <div class="kpi"><div class="kpi-label">Part number distinti</div><div class="kpi-value">${fmt(s.n_codici_pezzo)}</div></div>
        <div class="kpi"><div class="kpi-label">Assemblati</div><div class="kpi-value">${fmt(s.n_assemblati)}</div></div>
        <div class="kpi"><div class="kpi-label">Profili / qualità</div><div class="kpi-value">${fmt(s.n_profili)}</div></div>
      </div>
      <div class="explanation">
        <strong>Come leggere la tabella:</strong> ogni riga raggruppa i pezzi che condividono tipo materiale, profilo e qualità.
        "Part number distinti" indica quanti codici diversi sono compresi nel gruppo; "Assemblati" indica quanti assemblati risultano collegati a quei codici.
      </div>
      <div class="toolbar"><input class="search" id="unified-search" placeholder="Cerca tipo, profilo, qualità o assemblato…" oninput="renderUnifiedRows(this.value)"/></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Tipo materiale</th><th>Profilo</th><th>Qualità</th><th class="right">Pezzi fisici</th><th class="right">Part number distinti</th><th class="right">Assemblati</th></tr></thead>
          <tbody id="unified-body"></tbody>
        </table>
      </div>
    </section>

    ${renderAssemblatiSection()}

    <section class="section" id="step-5-1">
      <div class="section-head">
        <div><div class="section-title">QR commessa</div>
        <div class="section-sub">Un QR univoco per ogni pezzo fisico. Gli scan aggiorneranno lo stato reale del pezzo.</div></div>
      </div>
      <div class="workflow-card ${r.step51_completato ? "" : "qr-cta"}">
        ${r.step51_completato ? `
          <div class="qr-summary-card">
            <div>
              <div class="workflow-title">QR pezzi commessa</div>
              <div class="workflow-copy">
                ${fmt(s.n_qr_attivi)} pezzi sono identificati. Apri il registro per consultare, scansionare, stampare o correggere i dati manuali dei singoli QR.
              </div>
            </div>
            <div class="qr-summary-actions">
              <div class="qr-summary-number">${fmt(s.n_qr_attivi)}</div>
              <button class="btn cta" onclick="openQrRegistry()">Apri registro QR</button>
            </div>
          </div>
        ` : `
          <div class="workflow-head">
            <div>
              <div class="qr-cta-title">Genera QR commessa</div>
              <div class="qr-cta-copy">Crea i QR dei singoli pezzi fisici e prepara la commessa alla produzione. Non interviene sul magazzino.</div>
            </div>
            <button class="btn cta" id="generate-qr-btn" onclick="generateStep51()" ${r.stato_analisi !== "PRONTA" ? "disabled" : ""}>Genera QR commessa</button>
          </div>
        `}
        <div id="step51-feedback" class="feedback"></div>
      </div>
    </section>

    <div class="footer-note">
      La commessa viene aggiornata dagli eventi reali generati dagli scan in officina.
    </div>`;

  renderUnifiedRows("");
  renderAssemblyRows("");
}

function stateLabel(value) {
  const map = {
    DA_PRODURRE: "Da produrre",
    IN_ASSEMBLAGGIO: "In assemblaggio",
    COMPLETO: "Completo",
  };
  return map[value] || value || "—";
}

function stateClass(value) {
  if (value === "COMPLETO") return "done";
  if (value === "IN_ASSEMBLAGGIO") return "progress";
  return "";
}

function renderProgress(value) {
  const pct = Math.max(0, Math.min(100, Number(value || 0)));
  return `<div class="assembly-mini-progress">
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <span>${fmt(pct)}%</span>
  </div>`;
}

function renderAssemblatiSection() {
  const data = assemblyData || { summary: {}, assemblati: [] };
  const s = data.summary || {};
  return `<section class="section" id="assemblati-section">
    <div class="section-head">
      <div><div class="section-title">Avanzamento assemblati</div>
      <div class="section-sub">Monitoring per assemblato: il progresso nasce dagli scan reali dei pezzi collegati</div></div>
    </div>
    <div class="assembly-overview">
      <div class="assembly-progress-card">
        <div class="assembly-card-label">Avanzamento complessivo</div>
        <div class="assembly-card-value">${fmt(s.progress)}%</div>
        <div class="assembly-card-sub">${fmt(s.pezzi_completati)} / ${fmt(s.pezzi_previsti)} pezzi completati in assemblaggio</div>
        <div class="progress-track"><div class="progress-fill" style="width:${Math.max(0, Math.min(100, Number(s.progress || 0)))}%"></div></div>
      </div>
      <div class="assembly-progress-card"><div class="assembly-card-label">Assemblati</div><div class="assembly-card-value">${fmt(s.totali)}</div><div class="assembly-card-sub">totali da distinta</div></div>
      <div class="assembly-progress-card"><div class="assembly-card-label">Da produrre</div><div class="assembly-card-value">${fmt(s.da_produrre)}</div><div class="assembly-card-sub">nessuno scan assemblaggio</div></div>
      <div class="assembly-progress-card"><div class="assembly-card-label">In assemblaggio</div><div class="assembly-card-value">${fmt(s.in_assemblaggio)}</div><div class="assembly-card-sub">almeno un pezzo entrato</div></div>
      <div class="assembly-progress-card"><div class="assembly-card-label">Completi</div><div class="assembly-card-value">${fmt(s.completi)}</div><div class="assembly-card-sub">pezzi completati</div></div>
    </div>
    <div class="toolbar"><input class="search" id="assembly-search" placeholder="Cerca assemblato o pezzo…" oninput="renderAssemblyRows(this.value)"/></div>
    <div class="table-wrap">
      <table class="assembly-table">
        <thead><tr>
          <th>Assemblato</th><th class="right">Pezzi</th><th class="right">QR</th>
          <th class="right">Entrati</th><th class="right">Completati</th><th>Avanzamento</th><th>Stato</th>
        </tr></thead>
        <tbody id="assembly-body"></tbody>
      </table>
    </div>
  </section>`;
}

function renderAssemblyRows(query) {
  const body = document.getElementById("assembly-body");
  if (!body) return;
  const q = String(query || "").trim().toLowerCase();
  const rows = (assemblyData?.assemblati || []).filter(row => {
    const pieceHit = (row.pieces || []).some(piece => [piece.qr_code, piece.marca_pos, piece.profilo].some(value => String(value || "").toLowerCase().includes(q)));
    return !q || String(row.assemblato || "").toLowerCase().includes(q) || pieceHit;
  });
  body.innerHTML = rows.map(row => `
    <tr onclick="openAssemblyModal('${jsArg(row.assemblato)}')">
      <td><span class="assembly-code">${esc(row.assemblato)}</span></td>
      <td class="right">${fmt(row.pezzi_previsti)}</td>
      <td class="right">${fmt(row.qr_attivi)}</td>
      <td class="right">${fmt(row.pezzi_entrati)}</td>
      <td class="right">${fmt(row.pezzi_completati)}</td>
      <td>${renderProgress(row.progress)}</td>
      <td><span class="assembly-state ${stateClass(row.stato)}">${stateLabel(row.stato)}</span></td>
    </tr>`).join("") || '<tr><td colspan="7">Nessun assemblato trovato</td></tr>';
}

function renderPredistintaWarning(revision) {
  const chips = revisionData.map(row => `
    <div class="revision-chip${row.corrente ? " current" : ""}">
      ${esc(row.codice)} · ${row.predistinta ? "pre-distinta" : "definitiva"}
      ${row.corrente ? " · corrente" : " · archiviata"}
    </div>`).join("");
  return `<section class="section">
    <div class="section-head"><div><div class="section-title">Pre-distinta · analisi preliminare</div>
    <div class="section-sub">Analisi e QR possono essere preparati, ma la produzione resterà bloccata fino alla distinta definitiva</div></div></div>
    <div class="notice warn">
      Caricando la distinta definitiva verrà creata una nuova revisione: lo Step 4 sarà rieseguito e gli eventuali QR preliminari saranno archiviati e disattivati.
    </div>
    <div class="revision-list">${chips}</div>
    <form class="revision-form" onsubmit="uploadDefinitive(event)">
      <div class="upload-field"><label>Lista pezzi definitiva *</label><input type="file" id="def-lista" accept=".xls,.xlsx,.xlsm" required/></div>
      <div class="upload-field"><label>Pezzi e assemblati *</label><input type="file" id="def-assemblaggi" accept=".xls,.xlsx,.xlsm" required/></div>
      <div class="upload-field"><label>Lista spedizione *</label><input type="file" id="def-spedizione" accept=".xls,.xlsx,.xlsm" required/></div>
      <div class="revision-actions">
        <span class="feedback" id="revision-feedback"></span>
        <button class="btn" id="revision-submit" type="submit">Carica distinta definitiva e riesegui Step 4</button>
      </div>
    </form>
  </section>`;
}

async function uploadDefinitive(event) {
  event.preventDefault();
  const button = document.getElementById("revision-submit");
  const feedback = document.getElementById("revision-feedback");
  const lista = document.getElementById("def-lista").files[0];
  const assemblaggi = document.getElementById("def-assemblaggi").files[0];
  const spedizione = document.getElementById("def-spedizione").files[0];
  if (!lista || !assemblaggi || !spedizione) return;
  button.disabled = true;
  feedback.className = "feedback";
  feedback.textContent = "Caricamento e nuova analisi in corso…";
  const body = new FormData();
  body.append("lista_pezzi", lista);
  body.append("assemblaggi", assemblaggi);
  body.append("spedizione", spedizione);
  body.append("predistinta", "false");
  try {
    const response = await fetch(`/api/v1/commesse/${commessaId}/analisi`, {
      method: "POST", headers: auth(), body,
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || "Impossibile analizzare la distinta definitiva");
    location.reload();
  } catch (error) {
    feedback.className = "feedback error";
    feedback.textContent = error.message || String(error);
    button.disabled = false;
  }
}

async function generateStep51() {
  const button = document.getElementById("generate-qr-btn");
  const feedback = document.getElementById("step51-feedback");
  button.disabled = true;
  feedback.textContent = "Generazione dei record QR in corso…";
  try {
    const response = await fetch(`/api/v1/commesse/${commessaId}/step-5-1`, {
      method: "POST", headers: auth(),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || "Impossibile generare i QR della commessa");
    await load();
  } catch (error) {
    feedback.className = "feedback error";
    feedback.textContent = error.message || String(error);
    button.disabled = false;
  }
}

function searchQrItems(value) {
  qrQuery = String(value || "").trim();
  qrPage = 0;
  loadQrItems();
}

async function changeQrPage(delta) {
  qrPage = Math.max(0, qrPage + delta);
  await loadQrItems();
}

function openQrRegistry() {
  location.href = `/commesse/${commessaId}/qr-registry`;
}

function closeQrRegistry() {
  document.getElementById("qr-registry-modal").classList.remove("open");
}

async function loadQrItems() {
  const target = document.getElementById("qr-items");
  if (!target) return;
  const params = new URLSearchParams({
    skip: String(qrPage * qrPageSize),
    limit: String(qrPageSize),
  });
  if (qrQuery) params.set("q", qrQuery);
  try {
    const response = await fetch(`/api/v1/commesse/${commessaId}/step-5-1/items?${params}`, { headers: auth() });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || "QR non disponibili");
    currentQrItems = data.items || [];
    const count = document.getElementById("qr-registry-count");
    if (count) count.textContent = `${fmt(data.total)} QR`;
    renderQrRegistryCards();
  } catch (error) {
    target.innerHTML = `<div class="notice warn">${esc(error.message || error)}</div>`;
  }
}

function renderQrRegistryCards() {
  const target = document.getElementById("qr-items");
  if (!target) return;
  target.innerHTML = `
    <div class="qr-grid">
      ${currentQrItems.map(item => `<div class="qr-card" onclick="QrDrawer.open('${jsArg(item.uuid)}')">
        <input type="checkbox" ${selectedQrPieces.has(item.uuid) ? "checked" : ""} onclick="togglePieceQrSelection('${jsArg(item.uuid)}',event)" style="position:absolute;right:12px;top:12px;width:20px;height:20px">
        <img src="${esc(item.qr_image_url)}" alt="QR ${esc(item.qr_code || item.part_number)}"/>
        <div>
          <div class="qr-field-label">Marca pezzo</div>
          <div class="qr-code">${esc(item.qr_code || item.part_number || "SENZA CODICE")}</div>
          <div class="qr-meta" style="margin-top:10px">
            <div class="qr-field-label">Tipo</div>
            <div class="qr-field-value">${esc(item.tipo || "—")}</div>
          </div>
          <a class="qr-link" href="#" onclick="printCommessaLabel('${esc(item.label_url)}',event)">Stampa etichetta</a>
        </div>
      </div>`).join("")}
    </div>`;
}

function togglePieceQrSelection(uuid,event) {
  event.stopPropagation();
  if (selectedQrPieces.has(uuid)) selectedQrPieces.delete(uuid); else selectedQrPieces.add(uuid);
  renderQrRegistryCards();
}

function openSelectedPieceDetails() {
  const values = [...selectedQrPieces];
  if (!values.length) return;
  if (values.length === 1) QrDrawer.open(values[0]); else QrDrawer.openMany(values);
}

function openAssemblyModal(assemblato) {
  const row = (assemblyData?.assemblati || []).find(item => String(item.assemblato) === String(assemblato));
  if (!row) return;
  document.getElementById("assembly-modal-title").textContent = row.assemblato;
  document.getElementById("assembly-modal-sub").textContent =
    `${fmt(row.pezzi_previsti)} pezzi previsti · ${fmt(row.pezzi_completati)} completati · ${fmt(row.progress)}%`;
  document.getElementById("assembly-modal-body").innerHTML = `
    <div class="detail-grid">
      <div class="detail-card"><div class="assembly-card-label">Pezzi previsti</div><div class="assembly-card-value">${fmt(row.pezzi_previsti)}</div></div>
      <div class="detail-card"><div class="assembly-card-label">Entrati in assemblaggio</div><div class="assembly-card-value">${fmt(row.pezzi_entrati)}</div></div>
      <div class="detail-card"><div class="assembly-card-label">Completati</div><div class="assembly-card-value">${fmt(row.pezzi_completati)}</div></div>
      <div class="detail-card"><div class="assembly-card-label">Stato</div><div class="assembly-card-value" style="font-size:18px">${stateLabel(row.stato)}</div></div>
    </div>
    <div class="assembly-progress-card" style="margin-bottom:16px">
      <div class="assembly-card-label">Avanzamento assemblato</div>
      <div class="assembly-card-value">${fmt(row.progress)}%</div>
      <div class="progress-track"><div class="progress-fill" style="width:${Math.max(0, Math.min(100, Number(row.progress || 0)))}%"></div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Pezzo</th><th>Profilo</th><th>Qualità</th><th>Stato</th><th>Ultima postazione</th><th>Ultimo evento</th></tr></thead>
        <tbody>
          ${(row.pieces || []).map(piece => `
            <tr>
              <td class="mono"><span class="piece-status-dot ${piece.completed_assembly ? "done" : piece.entered_assembly ? "progress" : ""}"></span>${esc(piece.qr_code || piece.marca_pos)}</td>
              <td>${esc(piece.profilo || "—")}</td>
              <td>${esc(piece.qualita || "—")}</td>
              <td>${esc(piece.stato || "—")}</td>
              <td>${esc(piece.ultima_postazione || "—")}</td>
              <td>${esc(piece.ultimo_evento || "—")}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>`;
  document.getElementById("assembly-modal").classList.add("open");
}

function closeAssemblyModal() {
  document.getElementById("assembly-modal").classList.remove("open");
}

function openQrModal(qrCode) {
  const item = currentQrItems.find(row => String(row.qr_code) === String(qrCode));
  if (!item) return;
  currentQrDetail = { ...item };
  qrEditUnlocked = false;
  renderQrModal();
  document.getElementById("qr-modal").classList.add("open");
}

function renderQrModal() {
  const item = currentQrDetail;
  if (!item) return;
  document.getElementById("qr-modal-title").textContent = item.qr_code || item.part_number || "QR pezzo";
  document.getElementById("qr-modal-sub").textContent = `Marca pezzo ${item.part_number || "—"} · Tipo ${item.tipo || "—"}`;
  document.getElementById("qr-modal-body").innerHTML = `
    <div class="qr-detail">
      <img src="${esc(item.qr_image_url)}" alt="QR ${esc(item.qr_code || item.part_number)}"/>
      <div>
        <div class="detail-grid" style="grid-template-columns:repeat(2,1fr)">
          <div class="detail-card"><div class="assembly-card-label">Marca pezzo / QR</div><div class="assembly-card-value" style="font-size:19px">${esc(item.qr_code || "—")}</div></div>
          <div class="detail-card"><div class="assembly-card-label">Tipo</div><div class="assembly-card-value" style="font-size:19px">${esc(item.tipo || "—")}</div></div>
          <div class="detail-card"><div class="assembly-card-label">Assemblato</div><div class="assembly-card-value" style="font-size:19px">${esc(item.assemblato || "—")}</div></div>
          <div class="detail-card"><div class="assembly-card-label">Stato</div><div class="assembly-card-value" style="font-size:19px">${esc(item.stato || "—")}</div></div>
        </div>
        <div class="qr-edit-grid">
          <div class="qr-edit-field"><label>Tipo</label><input id="qr-edit-tipo" value="${esc(item.tipo || "")}" ${qrEditUnlocked ? "" : "disabled"}/></div>
          <div class="qr-edit-field"><label>Assemblato</label><input id="qr-edit-assemblato" value="${esc(item.assemblato || "")}" ${qrEditUnlocked ? "" : "disabled"}/></div>
          <div class="qr-edit-field"><label>Profilo interno</label><input id="qr-edit-profilo" value="${esc(item.profilo || "")}" ${qrEditUnlocked ? "" : "disabled"}/></div>
          <div class="qr-edit-field"><label>Qualità</label><input id="qr-edit-qualita" value="${esc(item.qualita || "")}" ${qrEditUnlocked ? "" : "disabled"}/></div>
          <div class="qr-edit-field"><label>Stato</label><input id="qr-edit-stato" value="${esc(item.stato || "")}" ${qrEditUnlocked ? "" : "disabled"}/></div>
        </div>
        <div class="feedback" id="qr-edit-feedback"></div>
        <div class="qr-edit-actions">
          <button class="btn secondary" onclick="toggleQrEdit()">${qrEditUnlocked ? "🔒 Blocca modifiche" : "🔓 Abilita modifiche"}</button>
          ${qrEditUnlocked ? `<button class="btn" id="qr-save-btn" onclick="saveQrManualEdit()">Salva modifiche</button>` : ""}
          <button class="btn cta" style="min-width:0" onclick="printCommessaLabel('${esc(item.label_url)}',event)">Stampa etichetta</button>
        </div>
      </div>
    </div>`;
}

function closeQrModal() {
  document.getElementById("qr-modal").classList.remove("open");
  currentQrDetail = null;
  qrEditUnlocked = false;
}

function toggleQrEdit() {
  qrEditUnlocked = !qrEditUnlocked;
  renderQrModal();
  if (qrEditUnlocked) setTimeout(() => document.getElementById("qr-edit-tipo")?.focus(), 40);
}

async function saveQrManualEdit() {
  if (!currentQrDetail?.id) return;
  const feedback = document.getElementById("qr-edit-feedback");
  const button = document.getElementById("qr-save-btn");
  feedback.className = "feedback";
  feedback.textContent = "Salvataggio modifiche…";
  button.disabled = true;
  try {
    const payload = {
      tipo: document.getElementById("qr-edit-tipo").value.trim() || null,
      assemblato: document.getElementById("qr-edit-assemblato").value.trim() || null,
      profilo: document.getElementById("qr-edit-profilo").value.trim() || null,
      qualita: document.getElementById("qr-edit-qualita").value.trim() || null,
      stato: document.getElementById("qr-edit-stato").value.trim() || null,
    };
    const response = await fetch(`/api/v1/commesse/${commessaId}/step-5-1/items/${currentQrDetail.id}`, {
      method: "PATCH",
      headers: { ...auth(), "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || "Salvataggio non riuscito");
    currentQrDetail = data;
    currentQrItems = currentQrItems.map(item => item.id === data.id ? data : item);
    qrEditUnlocked = false;
    renderQrModal();
    renderQrRegistryCards();
    const refreshed = await fetch(`/api/v1/commesse/${commessaId}/analisi/assemblati`, { headers: auth() });
    if (refreshed.ok) {
      assemblyData = await refreshed.json();
      renderAssemblyRows(document.getElementById("assembly-search")?.value || "");
    }
  } catch (error) {
    feedback.className = "feedback error";
    feedback.textContent = error.message || String(error);
    button.disabled = false;
  }
}

async function printCommessaLabel(url, event) {
  event.preventDefault();
  event.stopPropagation();
  try {
    const response = await fetch(url, { headers: auth() });
    const data = response.ok ? await response.blob() : await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || "Etichetta non disponibile");
    const objectUrl = URL.createObjectURL(data);
    window.open(objectUrl, "_blank", "noopener");
    setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);
  } catch (error) {
    alert(error.message || String(error));
  }
}

function getUnifiedRows() {
  if (!stockData || !Array.isArray(stockData.groups)) return [];
  return stockData.groups.map(group => {
    const assemblati = new Set();
    const matchingPositions = (analysisData.positions || []).filter(position =>
      String(position.profilo || "") === String(group.profilo || "") &&
      String(position.qualita || "") === String(group.qualita || "")
    );
    matchingPositions.forEach(position => {
      (position.assemblati || []).forEach(ass => {
        if (ass) assemblati.add(String(ass));
      });
    });
    return {
      ...group,
      n_assemblati: assemblati.size,
      assemblati_label: Array.from(assemblati).slice(0, 5).join(", "),
    };
  });
}

function renderUnifiedRows(query) {
  const q = String(query || "").trim().toLowerCase();
  const rows = getUnifiedRows().filter(row =>
    [row.tipo, row.profilo, row.qualita, row.assemblati_label]
      .some(value => String(value || "").toLowerCase().includes(q))
  );
  document.getElementById("unified-body").innerHTML = rows.map(row => `
    <tr>
      <td>${esc(row.tipo || "—")}</td>
      <td class="mono">${esc(row.profilo || "—")}</td>
      <td>${esc(row.qualita || "—")}</td>
      <td class="right">${fmt(row.n_pezzi)}</td>
      <td class="right">${fmt(row.n_codici_pezzo)}</td>
      <td class="right">${fmt(row.n_assemblati)}</td>
    </tr>`).join("") || '<tr><td colspan="6">Nessun gruppo trovato</td></tr>';
}

function renderPositions(query) {
  const q = String(query || "").trim().toLowerCase();
  const rows = analysisData.positions.filter(row =>
    [row.part_number, row.profilo, row.qualita, ...(row.assemblati || [])]
      .some(value => String(value || "").toLowerCase().includes(q))
  );
  document.getElementById("positions-body").innerHTML = rows.map(row => `
    <tr>
      <td class="mono">${esc(row.part_number)}</td>
      <td>${esc(row.profilo || "—")}</td>
      <td>${esc(row.qualita || "—")}</td>
      <td class="right">${fmt(row.quantita)}</td>
      <td>${row.assemblati.length ? esc(row.assemblati.join(", ")) : "—"}</td>
    </tr>`).join("") || '<tr><td colspan="5">Nessun part number trovato</td></tr>';
}

function setStockFilter(value) {
  stockFilter = value;
  renderStock();
}

function renderStock() {
  const target = document.getElementById("stock-content");
  if (!stockData) return;
  const rows = stockData.groups.filter(row => stockFilter === "tutti" || row.tipo === stockFilter);
  target.innerHTML = `
    <div class="stock-kpis">
      ${stockData.types.map(row => `<div class="stock-kpi${stockFilter === row.tipo ? " active" : ""}" onclick="setStockFilter('${esc(row.tipo)}')">
        <div class="stock-num">${fmt(row.n_pezzi)}</div>
        <div class="stock-label">${esc(row.tipo)}</div>
        <div class="stock-meta">${fmt(row.n_codici_pezzo)} part number distinti · ${fmt(row.n_gruppi)} profili/qualità</div>
      </div>`).join("")}
    </div>
    <div class="toolbar">
      <input class="search" id="stock-search" placeholder="Cerca tipo, profilo o qualità…" oninput="renderStockRows(this.value)"/>
      ${stockFilter !== "tutti" ? '<button class="search" style="flex:0;cursor:pointer" onclick="setStockFilter(\'tutti\')">Tutti</button>' : ""}
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Tipo materiale</th><th>Profilo</th><th>Qualità</th><th class="right">Pezzi fisici</th><th class="right">Part number distinti</th></tr></thead>
        <tbody id="stock-body"></tbody>
      </table>
    </div>`;
  renderStockRows("");
}

function renderStockRows(query) {
  const q = String(query || "").trim().toLowerCase();
  const rows = stockData.groups.filter(row =>
    (stockFilter === "tutti" || row.tipo === stockFilter) &&
    [row.tipo, row.profilo, row.qualita].some(value => String(value || "").toLowerCase().includes(q))
  );
  document.getElementById("stock-body").innerHTML = rows.map(row => `
    <tr>
      <td>${esc(row.tipo)}</td>
      <td class="mono">${esc(row.profilo)}</td>
      <td>${esc(row.qualita || "—")}</td>
      <td class="right">${fmt(row.n_pezzi)}</td>
      <td class="right">${fmt(row.n_codici_pezzo)}</td>
    </tr>`).join("") || '<tr><td colspan="5">Nessun profilo in questa categoria</td></tr>';
}

async function load() {
  try {
    const [analysisResponse, stockResponse, assembliesResponse, revisionsResponse] = await Promise.all([
      fetch(`/api/v1/commesse/${commessaId}/analisi`, { headers: auth() }),
      fetch(`/api/v1/commesse/${commessaId}/analisi/materiali`, { headers: auth() }),
      fetch(`/api/v1/commesse/${commessaId}/analisi/assemblati`, { headers: auth() }),
      fetch(`/api/v1/commesse/${commessaId}/revisioni`, { headers: auth() }),
    ]);
    const analysis = await analysisResponse.json().catch(() => ({}));
    const stock = await stockResponse.json().catch(() => ({}));
    const assemblies = await assembliesResponse.json().catch(() => ({}));
    const revisions = await revisionsResponse.json().catch(() => ([]));
    if (!analysisResponse.ok) throw new Error(analysis.detail || "Analisi non disponibile");
    if (!stockResponse.ok) throw new Error(stock.detail || "Classificazione materiali non disponibile");
    if (!assembliesResponse.ok) throw new Error(assemblies.detail || "Assemblati non disponibili");
    if (!revisionsResponse.ok) throw new Error(revisions.detail || "Revisioni non disponibili");
    analysisData = analysis;
    stockData = stock;
    assemblyData = assemblies;
    revisionData = revisions;
    renderPage();
  } catch (error) {
    document.getElementById("root").innerHTML = `<div class="notice warn">⚠ ${esc(error.message || error)}</div>`;
  }
}
load();
</script>
<script src="/static/qr-drawer.js"></script>
</body>
