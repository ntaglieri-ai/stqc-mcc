<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Stampa QR</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#182442;font:14px system-ui;color:#eef4ff}aside{padding:20px;position:sticky;top:0;background:#1a2d4b;z-index:2;border-bottom:1px solid #476184}h1{font-size:22px;margin:0 0 12px}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end}label{display:grid;gap:5px;font-size:12px}input,select,button{padding:9px;border:1px solid #6684ab;border-radius:7px;background:#223b60;color:white}input{width:100px}button{cursor:pointer;background:#2563eb}#profileName{width:190px}.note{margin:12px 0 0;color:#d7e4f5}#error{color:#fecaca}main{padding:20px;overflow:auto}.sheet{background:white;color:#111;margin:0 auto 20px;display:grid;break-after:page}.sheet:last-child{break-after:auto}.label{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1mm;padding:2mm;overflow:hidden;outline:.15mm solid #bbb;text-align:center}.label img{flex-shrink:0;object-fit:contain}.text{width:100%;overflow-wrap:anywhere;line-height:1.15}.title{font-weight:800}.detail{font-size:.85em}.label img{image-rendering:pixelated} @media print{aside{display:none}body,main{margin:0;padding:0;background:white;overflow:visible}.sheet{margin:0;outline:none}.label{outline:none}}
</style><style id="dimensions"></style></head><body><aside><h1>Stampa QR</h1><div class="controls">
<label>Profilo<select id="profiles"><option value="">Personalizzato</option></select></label><label>Nome profilo<input id="profileName" placeholder="Stampante magazzino"></label><button id="save">Salva profilo</button>
<label>Formato<select id="format"><option value="a4">A4</option><option value="a5">A5</option><option value="label">Etichetta 100 × 50</option><option value="custom">Personalizzato</option></select></label>
<label>Larghezza mm<input id="width" type="number" min="20" max="600" value="210"></label><label>Altezza mm<input id="height" type="number" min="20" max="600" value="297"></label><button id="rotate">Ruota foglio</button>
<label>Margini mm<input id="margin" type="number" min="0" max="50" value="5"></label><label>Colonne<input id="cols" type="number" min="1" max="12" value="1"></label><label>Righe<input id="rows" type="number" min="1" max="20" value="1"></label>
<label>QR<select id="sizeMode"><option value="auto">Adatta allo spazio</option><option value="fixed">Misura fissa</option></select></label><label>QR mm<input id="qr" type="number" min="10" max="500" value="60"></label><label>Testo pt<input id="font" type="number" min="6" max="40" value="12"></label>
<button id="print">Stampa / Salva PDF</button></div><p class="note">Scegli la stampante nella finestra del browser: stesso formato carta, scala 100%, una pagina per foglio, intestazioni disattivate. I profili sono salvati in questo browser.</p><p id="error" role="status"></p></aside><main id="preview"></main><script src="/static/qr-print-page.js"></script></body></html>
