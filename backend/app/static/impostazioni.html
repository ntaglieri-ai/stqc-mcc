<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Impostazioni · MCC STQC</title><style>
* { box-sizing:border-box; } body { margin:0; background:#0f1c39; color:#e5edf8; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; } main { max-width:1400px; margin:auto; padding:32px; } header { display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:28px; } h1 { margin:6px 0 0; } nav { display:flex; gap:10px; } nav a { text-decoration:none; } .eyebrow { color:#94a3b8; font-size:12px; letter-spacing:.12em; }
    .scan-settings { display: none; flex: 1; min-height: 0; overflow-y: auto; padding-right: 4px; }
    .scan-settings.open { display: block; }
    .scan-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .scan-tab {
      border: 1px solid rgba(147,197,253,.16); background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.72); border-radius: 999px; padding: 8px 11px;
      font-size: 11px; font-weight: 800; cursor: pointer;
    }
    .scan-tab.active { color: #dbeafe; border-color: rgba(96,165,250,.42); background: rgba(59,130,246,.14); }
    .scan-mini-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; margin: 0 0 14px; }
    .scan-mini-card { border: 1px solid rgba(147,197,253,.14); border-radius: 14px; background: rgba(255,255,255,.035); padding: 13px; }
    .scan-mini-card strong { display: block; font-size: 20px; color: rgba(255,255,255,.92); letter-spacing: -.03em; }
    .scan-mini-card span { display: block; margin-top: 4px; font-size: 10px; color: rgba(255,255,255,.72); text-transform: uppercase; letter-spacing: .1em; font-weight: 800; }
    .scan-panel { border: 1px solid rgba(147,197,253,.14); border-radius: 18px; background: linear-gradient(145deg, rgba(23,47,81,.82), rgba(16,29,53,.72)); overflow: hidden; }
    .scan-panel-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding: 15px 16px; border-bottom: 1px solid rgba(147,197,253,.12); }
    .scan-panel-title { font-size: 15px; font-weight: 900; color: rgba(255,255,255,.9); }
    .scan-panel-sub { margin-top: 4px; font-size: 11px; color: rgba(255,255,255,.72); line-height: 1.4; }
    .scan-list { display: grid; gap: 10px; padding: 14px; }
    .scan-row { border: 1px solid rgba(147,197,253,.12); border-radius: 14px; background: rgba(16,29,53,.54); padding: 12px; }
    .scan-row-top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
    .scan-row-title { font-size: 14px; font-weight: 900; color: #eaf2ff; }
    .scan-row-sub { margin-top: 4px; font-size: 11px; color: rgba(255,255,255,.72); line-height: 1.4; }
    .scan-badge { display:inline-flex; align-items:center; border-radius:999px; border:1px solid rgba(147,197,253,.16); padding:4px 8px; font-size:9px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; color:#bfdbfe; background:rgba(59,130,246,.08); white-space:nowrap; }
    .scan-badge.ok { color:#86efac; border-color:rgba(74,222,128,.28); background:rgba(74,222,128,.09); }
    .scan-badge.off { color:#fca5a5; border-color:rgba(248,113,113,.24); background:rgba(248,113,113,.08); }
    .scan-qr-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
    .scan-qr { display:flex; gap:10px; align-items:center; border:1px solid rgba(255,255,255,.08); border-radius:13px; background:rgba(255,255,255,.035); padding:9px; cursor:pointer; }
    .scan-qr:hover { border-color:rgba(96,165,250,.42); background:rgba(59,130,246,.09); }
    .scan-qr img { width:58px; height:58px; border-radius:8px; background:#fff; padding:4px; flex-shrink:0; }
    .scan-payload { margin-top:3px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; color:rgba(219,234,254,.52); word-break:break-all; }
    .scan-form { display:grid; gap:9px; padding:14px; }
    .scan-form input,.scan-form select,.scan-form textarea {
      width:100%; border:1px solid rgba(147,197,253,.14); border-radius:12px;
      background:rgba(16,29,53,.72); color:#eaf2ff; padding:10px 11px; font-size:12px; outline:none;
    }
    .scan-form textarea { min-height:70px; resize:vertical; }
    .scan-form-two { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .scan-empty { padding: 26px; text-align:center; color: rgba(255,255,255,.72); font-size:12px; }
    @media (max-width: 680px) { .scan-mini-grid,.scan-form-two,.scan-qr-grid { grid-template-columns: 1fr; } }

.scan-settings { overflow:visible; padding:0; } @media(max-width:680px) { main { padding:20px 14px; } }
.scan-action { border-radius:10px; padding:10px 16px; font-size:12px; transition:background .15s,border-color .15s; }
.scan-action.new { background:#2563eb; border-color:#3b82f6; color:#fff; }
.scan-action.edit { background:rgba(245,158,11,.14); border-color:rgba(245,158,11,.4); color:#fcd34d; }
.scan-action.delete { background:rgba(239,68,68,.14); border-color:rgba(239,68,68,.4); color:#fca5a5; }
.scan-action:hover { filter:brightness(1.2); } .scan-tab:focus-visible { outline:2px solid #93c5fd; outline-offset:3px; } .scan-tab:disabled { opacity:.5; cursor:wait; }
.station-toggle { display:flex; align-items:center; gap:10px; flex:1; min-width:0; border:0; padding:2px 0; background:none; color:#eaf2ff; text-align:left; cursor:pointer; font:inherit; }
.station-toggle::before { content:'▸'; color:#93c5fd; font-size:18px; }
.station-toggle[aria-expanded="true"]::before { content:'▾'; }
.station-toggle:focus-visible { outline:2px solid #93c5fd; outline-offset:4px; border-radius:6px; }
.station-row .scan-row-top { align-items:center; }
.station-row .scan-action { padding:7px 12px; }
.station-row .scan-row-sub { color:#b8c7dd; }
.station-row .scan-qr-grid[hidden] { display:none; }
@media(max-width:540px) { .station-row .scan-row-top { flex-wrap:wrap; } .station-toggle { flex-basis:100%; } }
</style></head><body><main><header><div><div class="eyebrow">VISTA DIRETTORE</div><h1>Impostazioni</h1></div><nav><button class="scan-tab" onclick="goBack()">← Indietro</button><a class="scan-tab" href="/">Home</a></nav></header>  <div class="scan-settings open" id="scanner-settings-view">
    <div class="scan-toolbar">
      
      <button class="scan-tab active" data-scan-tab="codes" onclick="setScannerSettingsTab('codes')">Gestione Postazioni</button>
      <button class="scan-tab" data-scan-tab="scanners" onclick="setScannerSettingsTab('scanners')">Scanner Configuration</button>
      <button class="scan-tab" style="margin-left:auto" onclick="loadScannerSettings()">Aggiorna</button>
    </div>
    <div class="scan-mini-grid" id="scanner-settings-stats">
      <div class="scan-mini-card"><strong>—</strong><span>Postazioni</span></div>
      <div class="scan-mini-card"><strong>—</strong><span>Scanner attivi</span></div>
    </div>
    <div class="scan-panel">
      <div class="scan-panel-head">
        <div>
          <div class="scan-panel-title" id="scanner-settings-heading">Gestione Postazioni</div>
          <div class="scan-panel-sub" id="scanner-settings-sub">QR INIZIO e FINE per lavorare con pistola scanner.</div>
        </div>
        <button id="station-new-action" class="scan-tab scan-action new" style="flex-shrink:0" onclick="renderStationForm()">+ Nuova</button>
        <button id="scanner-new-action" class="scan-tab scan-action new" style="flex-shrink:0" onclick="renderNewScannerSettings()" hidden>+ Nuovo</button>
      </div>
      <div id="scanner-settings-body"><div class="scan-empty">Caricamento impostazioni scanner…</div></div>
    </div>
  </div></main><script>
const TOKEN = sessionStorage.getItem('stqc_token');
if (!TOKEN) window.location.replace('/login');
function goBack() { if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) history.back(); else location.href = '/'; }
let editingScannerId = null;
let scannerSettingsLoaded = false;
let scannerSettingsTab = 'codes';
let scannerWorkstations = [], scannerQrCodes = [], scannerDevices = [];
function getAuth() { return 'Bearer ' + TOKEN; }
function go(url) { window.location.href = url; }
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Logout ────────────────────────────────────────────────────────────────────
function logout() {
  sessionStorage.removeItem('stqc_token');
  sessionStorage.removeItem('stqc_profilo');
  sessionStorage.removeItem('stqc_nome');
  window.location.replace('/login');
}

async function scannerApi(path, options = {}) {
  const res = await fetch('/api/v1/admin' + path, {
    ...options,
    headers: {
      Authorization: getAuth(),
      ...(options.body ? { 'Content-Type': 'application/json' } : {}),
      ...(options.headers || {}),
    },
  });
  if (res.status === 401) logout();
  return res;
}

function workstationName(id) {
  const row = scannerWorkstations.find(x => Number(x.id) === Number(id));
  return row ? `${row.code} · ${row.name}` : 'Nessuna';
}

async function loadScannerSettings() {
  const body = document.getElementById('scanner-settings-body');
  body.innerHTML = '<div class="scan-empty">Caricamento impostazioni scanner…</div>';
  try {
    const [wsRes, qrRes, scRes] = await Promise.all([
      scannerApi('/workstations?include_inactive=true'),
      scannerApi('/workstations/qr-codes?include_inactive=false'),
      scannerApi('/scanner-devices?include_inactive=true'),
    ]);
    const wsData = await wsRes.json();
    const qrData = await qrRes.json();
    const scData = await scRes.json();
    if (!wsRes.ok) throw new Error(wsData.detail || 'Errore postazioni');
    if (!qrRes.ok) throw new Error(qrData.detail || 'Errore codici postazione');
    if (!scRes.ok) throw new Error(scData.detail || 'Errore scanner');
    scannerWorkstations = wsData || [];
    scannerQrCodes = qrData.items || [];
    scannerDevices = scData || [];
    scannerSettingsLoaded = true;
    renderScannerStats();
    renderScannerSettingsTab();
  } catch (err) {
    body.innerHTML = `<div class="scan-empty" style="color:#fca5a5">${esc(err.message || err)}</div>`;
  }
}

function renderScannerStats() {
  const activeScanners = scannerDevices.filter(x => x.active).length;
  const activeStations = scannerWorkstations.filter(x => x.active).length;
  document.getElementById('scanner-settings-stats').innerHTML = `
    <div class="scan-mini-card"><strong>${activeStations}</strong><span>Postazioni attive</span></div>
    <div class="scan-mini-card"><strong>${activeScanners}</strong><span>Scanner attivi</span></div>
  `;
}

function setScannerSettingsTab(tab) {
  scannerSettingsTab = ['codes', 'scanners'].includes(tab) ? tab : 'codes';
  renderScannerSettingsTab();
}

function renderScannerSettingsTab() {
  document.querySelectorAll('[data-scan-tab]').forEach(btn => btn.classList.toggle('active', btn.dataset.scanTab === scannerSettingsTab));
  if (scannerSettingsTab === 'codes') return renderStationQrSettings();
  if (scannerSettingsTab === 'scanners') return renderScannerDeviceSettings();
  renderStationQrSettings();
}

function renderStationQrSettings() {
  document.getElementById('station-new-action').hidden = false;
  document.getElementById('scanner-new-action').hidden = true;
  document.getElementById('scanner-settings-heading').textContent = 'Gestione Postazioni';
  document.getElementById('scanner-settings-sub').textContent = 'Clicca una postazione per mostrare i QR, poi un QR per stamparlo.';
  document.getElementById('scanner-settings-body').innerHTML = `<div class="scan-list">${
    scannerQrCodes.map((ws, i) => `
      <div class="scan-row station-row">
        <div class="scan-row-top">
          <button class="station-toggle" aria-expanded="false" aria-controls="station-codes-${Number(ws.id)}" onclick="toggleStationCodes(this)">
            <span><span class="scan-row-title">${esc(ws.name || ws.code)}</span>
            <span class="scan-row-sub" style="display:block">${esc(ws.code)} · ${(ws.codes || []).length} QR</span></span>
          </button>
          <div class="scan-toolbar" style="margin:0;justify-content:flex-end">
            <button class="scan-tab scan-action edit" onclick="renderStationForm(${Number(ws.id)})">Modifica</button>
            <button class="scan-tab scan-action delete" onclick="deleteStation(${Number(ws.id)},this)">Elimina</button>
          </div>
        </div>
        <div class="scan-qr-grid" id="station-codes-${Number(ws.id)}" hidden>
          ${(ws.codes || []).map((code, j) => `
            <div class="scan-qr" onclick="printScannerStationCode(${i},${j})">
              <img src="${esc(code.qr_image_url)}" alt="${esc(code.label)} ${esc(ws.code)}">
              <div>
                <div class="scan-row-title" style="font-size:12px">${esc(code.label)}</div>
                <div class="scan-payload">${esc(code.payload)}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('') || '<div class="scan-empty">Nessuna postazione attiva.</div>'
  }</div>`;
}

function toggleStationCodes(button) {
  const expanded = button.getAttribute('aria-expanded') !== 'true';
  button.setAttribute('aria-expanded', String(expanded));
  document.getElementById(button.getAttribute('aria-controls')).hidden = !expanded;
}

function renderStationForm(id = null) {
  const ws = scannerWorkstations.find(x => Number(x.id) === id);
  if (id !== null && !ws) return;
  document.getElementById('station-new-action').hidden = true;
  document.getElementById('scanner-new-action').hidden = true;
  document.getElementById('scanner-settings-heading').textContent = ws ? 'Modifica postazione' : 'Nuova postazione';
  document.getElementById('scanner-settings-sub').textContent = 'Nome, codice e descrizione della postazione. I QR vengono generati automaticamente.';
  document.getElementById('scanner-settings-body').innerHTML = `<form class="scan-form" onsubmit="saveStation(event,${id})">
    <div class="scan-form-two"><label>Codice<input name="code" required value="${esc(ws?.code || '')}"></label><label>Nome<input name="name" required value="${esc(ws?.name || '')}"></label></div>
    <label>Descrizione<textarea name="description">${esc(ws?.description || '')}</textarea></label>
    <div class="scan-toolbar" style="margin:0"><button type="submit" class="scan-tab scan-action new">${ws ? 'Salva modifiche' : 'Crea postazione'}</button><button type="button" class="scan-tab scan-action" onclick="renderStationQrSettings()">Annulla</button></div>
    <div id="station-result" role="status" class="scan-panel-sub"></div></form>`;
  if (ws) {
    const codes = scannerQrCodes.find(x => Number(x.id) === id)?.codes || [];
    document.getElementById('scanner-settings-body').insertAdjacentHTML('beforeend', `<section class="scan-list">
      <div class="scan-row-top"><div class="scan-row-title">QR e azioni</div><button class="scan-tab scan-action new" onclick="stationQrForm(${id})">+ Nuovo QR</button></div>
      ${codes.map(q => `<div class="scan-row"><div class="scan-row-top"><div><div class="scan-row-title">${esc(q.label)}</div><div class="scan-row-sub">${q.actions.map(esc).join(' · ')}</div></div><div class="scan-toolbar" style="margin:0"><button class="scan-tab scan-action edit" onclick="stationQrForm(${id},${q.id})">Rinnova</button><button class="scan-tab scan-action delete" onclick="removeStationQr(${id},${q.id})">Rimuovi</button></div></div></div>`).join('') || '<div class="scan-empty">Nessun QR configurato.</div>'}
      <div id="station-qr-editor"></div></section>`);
  }

}

function stationQrForm(stationId, qrId = null) {
  const qr = scannerQrCodes.find(x => Number(x.id) === stationId)?.codes.find(x => x.id === qrId);
  document.getElementById('station-qr-editor').innerHTML = `<form class="scan-form scan-row" onsubmit="saveStationQr(event,${stationId},${qrId})">
    <div class="scan-row-title">${qr ? 'Rinnova QR' : 'Nuovo QR'}</div>
    <label>Nome QR<input name="label" maxlength="160" required value="${esc(qr?.label || '')}" placeholder="Es. Controllo dimensionale"></label>
    <label>Azioni o stati (una voce per riga)<textarea name="actions" required placeholder="Controllo eseguito&#10;Pronto per spedizione">${esc((qr?.actions || []).join('\n'))}</textarea></label>
    <label>Informazioni aggiuntive<textarea name="description" maxlength="2000">${esc(qr?.description || '')}</textarea></label>
    ${qr ? '<div class="scan-panel-sub">Il codice precedente non sarà più valido. Stampa il nuovo QR dopo il salvataggio.</div>' : ''}
    <div class="scan-toolbar"><button type="submit" class="scan-tab scan-action new">${qr ? 'Rinnova e salva' : 'Crea QR'}</button><button type="button" class="scan-tab" onclick="document.getElementById('station-qr-editor').innerHTML=''">Annulla</button></div><div role="status" class="scan-panel-sub"></div></form>`;
  document.getElementById('station-qr-editor').scrollIntoView({behavior:'smooth',block:'nearest'});
}

async function saveStationQr(event, stationId, qrId) {
  event.preventDefault();
  const form = event.target, button = form.querySelector('[type=submit]');
  const body = {label:form.elements.label.value.trim(), actions:form.elements.actions.value.split('\n').map(x=>x.trim()).filter(Boolean), description:form.elements.description.value.trim() || null};
  button.disabled = true;
  try {
    const res = await scannerApi(`/workstations/${stationId}/qr-codes` + (qrId === null ? '' : `/${qrId}/renew`), {method:'POST',body:JSON.stringify(body)});
    const data = await res.json().catch(()=>({}));
    if (!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Controlla nome e azioni: massimo 12 voci di 100 caratteri.');
    await loadScannerSettings(); renderStationForm(stationId);
  } catch(err) { form.querySelector('[role=status]').textContent = err.message; }
  finally { button.disabled = false; }
}

async function removeStationQr(stationId, qrId) {
  if (!confirm('Rimuovere questo QR? Il codice stampato non sarà più valido.')) return;
  try {
    const res = await scannerApi(`/workstations/${stationId}/qr-codes/${qrId}`, {method:'DELETE'});
    if (!res.ok) throw new Error('Rimozione non riuscita');
    await loadScannerSettings(); renderStationForm(stationId);
  } catch(err) { alert(err.message); }
}

async function saveStation(event, id) {
  event.preventDefault();
  const form = event.target;
  const button = form.querySelector('[type=submit]');
  const result = document.getElementById('station-result');
  const body = {code:form.elements.code.value.trim(), name:form.elements.name.value.trim(), description:form.elements.description.value.trim() || null};
  button.disabled = true;
  try {
    const res = await scannerApi('/workstations' + (id === null ? '' : '/' + id), {method:id === null ? 'POST' : 'PATCH',body:JSON.stringify(body)});
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || 'Salvataggio non riuscito');
    await loadScannerSettings();
  } catch (err) { result.textContent = err.message || String(err); }
  finally { button.disabled = false; }
}

async function deleteStation(id, button) {
  const ws = scannerWorkstations.find(x => Number(x.id) === id);
  if (!ws || !confirm(`Eliminare ${ws.name} dalle postazioni attive? Gli scanner associati saranno scollegati; lo storico delle scansioni sarà conservato.`)) return;
  button.disabled = true;
  try {
    const res = await scannerApi('/workstations/' + id, {method:'DELETE'});
    if (!res.ok) { const data = await res.json().catch(() => ({})); throw new Error(data.detail || 'Eliminazione non riuscita'); }
    await loadScannerSettings();
  } catch (err) { alert(err.message || String(err)); }
  finally { button.disabled = false; }
}

function renderScannerDeviceSettings() {
  document.getElementById('station-new-action').hidden = true;
  document.getElementById('scanner-new-action').hidden = false;
  document.getElementById('scanner-settings-heading').textContent = 'Scanner Configuration';
  document.getElementById('scanner-settings-sub').textContent = 'Scanner fisici configurati, modalità operativa, postazione associata e URL utili.';
  document.getElementById('scanner-settings-body').innerHTML = `<div class="scan-list">${
    scannerDevices.map(scanner => `
      <div class="scan-row">
        <div class="scan-row-top">
          <div>
            <div class="scan-row-title">${esc(scanner.scanner_code)} · ${esc(scanner.name || scanner.scanner_code)}</div>
            <div class="scan-row-sub">${esc(scanner.scan_mode || 'OFFICINA')} · ${esc(workstationName(scanner.postazione_id))}<br>IP ${esc(scanner.ip_address || '—')} · seriale ${esc(scanner.serial_number || '—')}</div>
          </div>
          <span class="scan-badge ${scanner.active ? 'ok' : 'off'}">${scanner.active ? 'Attivo' : 'Disattivo'}</span>
        </div>
        <div class="scan-toolbar" style="margin:12px 0 0">
          <button class="scan-tab scan-action edit" onclick="renderNewScannerSettings(${Number(scanner.id)})">Modifica</button>
          <button class="scan-tab scan-action delete" onclick="deleteScannerFromSettings(${Number(scanner.id)}, this)">Cancella</button>
          <button class="scan-tab" onclick="copyScannerUrl('${esc(scanner.device_token || '')}','scan')">Copia scan</button>
          <button class="scan-tab" onclick="copyScannerUrl('${esc(scanner.device_token || '')}','read')">Copia read</button>
        </div>
      </div>
    `).join('') || '<div class="scan-empty">Nessuno scanner configurato.</div>'
  }</div>`;
}

function renderNewScannerSettings(id = null) {
  document.getElementById('station-new-action').hidden = true;
  document.getElementById('scanner-new-action').hidden = true;
  editingScannerId = id;
  const scanner = scannerDevices.find(x => Number(x.id) === id);
  if (id !== null && !scanner) return;

  document.getElementById('scanner-settings-heading').textContent = scanner ? 'Modifica scanner' : 'Nuovo scanner';
  document.getElementById('scanner-settings-sub').textContent = 'Crea una pistola scanner e associa subito modalità e postazione predefinita.';
  const options = '<option value="">Nessuna postazione</option>' + scannerWorkstations.filter(x => x.active || Number(x.id) === Number(scanner?.postazione_id)).map(x => `<option value="${Number(x.id)}">${esc(x.code)} · ${esc(x.name)}</option>`).join('');
  document.getElementById('scanner-settings-body').innerHTML = `
    <form class="scan-form" onsubmit="createScannerFromSettings(event)">
      <div class="scan-form-two">
        <input id="scan-new-code" placeholder="SCN-OFF-01" required oninput="this.value=this.value.toUpperCase()">
        <input id="scan-new-name" placeholder="Nome scanner" required>
      </div>
      <div class="scan-form-two">
        <select id="scan-new-mode">
          <option value="OFFICINA">OFFICINA</option>
          <option value="MAGAZZINO">MAGAZZINO</option>
          <option value="SPEDIZIONE_AD_HOC">SPEDIZIONE AD HOC</option>
        </select>
        <select id="scan-new-workstation">${options}</select>
      </div>
      <div class="scan-form-two">
        <input id="scan-new-ip" placeholder="IP opzionale">
        <input id="scan-new-serial" placeholder="Seriale opzionale">
      </div>
      <textarea id="scan-new-desc" placeholder="Note operative opzionali"></textarea>
      <div class="scan-toolbar"><button class="scan-tab scan-action new" type="submit">${scanner ? 'Salva modifiche' : 'Crea scanner'}</button><button class="scan-tab scan-action" type="button" onclick="renderScannerDeviceSettings()">Annulla</button></div>
      <div class="scan-panel-sub" id="scan-new-result"></div>
    </form>`;
  if (scanner) {
    const fields = {code:'scanner_code', name:'name', mode:'scan_mode', workstation:'postazione_id', ip:'ip_address', serial:'serial_number', desc:'description'};
    Object.entries(fields).forEach(([field, key]) => { document.getElementById('scan-new-' + field).value = scanner[key] ?? ''; });
  }
}

async function createScannerFromSettings(event) {
  event.preventDefault();
  const result = document.getElementById('scan-new-result');
  const body = {
    scanner_code: document.getElementById('scan-new-code').value.trim().toUpperCase(),
    name: document.getElementById('scan-new-name').value.trim(),
    scan_mode: document.getElementById('scan-new-mode').value,
    postazione_id: Number(document.getElementById('scan-new-workstation').value) || null,
    ip_address: document.getElementById('scan-new-ip').value.trim() || null,
    serial_number: document.getElementById('scan-new-serial').value.trim() || null,
    description: document.getElementById('scan-new-desc').value.trim() || null,
    active: editingScannerId === null ? true : scannerDevices.find(x => Number(x.id) === editingScannerId).active,
  };
  const id = editingScannerId;
  const submit = event.target.querySelector('[type=submit]');
  submit.disabled = true;
  result.textContent = 'Salvataggio scanner…';
  try {
    const res = await scannerApi('/scanner-devices' + (id === null ? '' : '/' + id), { method: id === null ? 'POST' : 'PATCH', body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || 'Salvataggio non riuscito');
    result.textContent = `Scanner creato: ${data.scanner_code}`;
    scannerSettingsTab = 'scanners';
    scannerSettingsLoaded = false;
    await loadScannerSettings();
  } catch (err) {
    result.textContent = err.message || String(err);
  } finally {
    submit.disabled = false;
  }
}

async function deleteScannerFromSettings(id, button) {
  const scanner = scannerDevices.find(x => Number(x.id) === id);
  if (!scanner || !confirm(`Cancellare lo scanner ${scanner.scanner_code}?`)) return;
  button.disabled = true;
  try {
    const res = await scannerApi('/scanner-devices/' + id, { method: 'DELETE' });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.detail || 'Cancellazione non riuscita');
    }
    await loadScannerSettings();
  } catch (err) { alert(err.message || String(err)); }
  finally { button.disabled = false; }
}

async function copyScannerUrl(token, mode) {
  if (!token) return alert('Token scanner mancante.');
  const path = mode === 'read' ? 'read' : 'scan';
  const url = `${location.origin}/api/v1/scanner/netum/${encodeURIComponent(token)}/${path}`;
  await navigator.clipboard.writeText(url);
}


if (TOKEN) loadScannerSettings();
