<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Scanner mobile · MCC</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#06101d;color:#eaf2ff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
    .top{padding:calc(14px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid rgba(147,197,253,.14);background:linear-gradient(180deg,#0c1728,#08111f)}
    .title{font-size:20px;font-weight:950;letter-spacing:-.03em}
    .meta{margin-top:4px;color:#9db0ca;font-size:12px;word-break:break-all}
    .stage{position:relative;min-height:0;display:grid;grid-template-rows:1fr auto;background:#030913}
    #reader{min-height:0;width:100%;height:100%;display:grid;place-items:center;overflow:hidden}
    #reader video{width:100%!important;height:100%!important;object-fit:cover!important}
    #reader__dashboard_section,#reader__scan_region img{display:none!important}
    #reader__scan_region{width:100%!important;min-height:100%!important;display:grid!important;place-items:center!important}
    .frame{pointer-events:none;position:absolute;left:50%;top:45%;width:min(78vw,360px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid rgba(96,165,250,.85);border-radius:28px;box-shadow:0 0 0 999px rgba(2,6,23,.28),0 0 34px rgba(59,130,246,.25)}
    .frame:before,.frame:after{content:"";position:absolute;inset:16px;border-radius:18px;border:1px solid rgba(255,255,255,.22)}
    .hint{position:absolute;left:16px;right:16px;bottom:18px;padding:12px 14px;border:1px solid rgba(147,197,253,.18);border-radius:18px;background:rgba(7,17,31,.82);backdrop-filter:blur(16px);color:#c9d8ee;font-size:14px;text-align:center}
    .hint.armed{border-color:rgba(94,234,212,.45);background:rgba(15,118,110,.28);color:#f0fdfa;font-weight:850}
    .result{min-height:116px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid rgba(147,197,253,.14);background:#0a1424}
    .status{border:1px solid rgba(147,197,253,.16);border-radius:18px;padding:14px;background:#101f35}
    .status.ok{border-color:rgba(74,222,128,.5);background:linear-gradient(135deg,rgba(22,101,52,.85),rgba(6,78,59,.82))}
    .status.err{border-color:rgba(248,113,113,.55);background:linear-gradient(135deg,rgba(127,29,29,.86),rgba(69,10,10,.82))}
    .status.wait{border-color:rgba(250,204,21,.42);background:linear-gradient(135deg,rgba(113,63,18,.78),rgba(66,32,6,.76))}
    .status-title{font-size:18px;font-weight:950}
    .status-msg{margin-top:5px;color:rgba(234,242,255,.82);font-size:14px;line-height:1.35;word-break:break-word}
    .controls{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;margin-top:10px}
    button{border:1px solid rgba(147,197,253,.22);background:#13243b;color:#eef5ff;border-radius:16px;min-height:48px;padding:0 14px;font-weight:950;font-size:15px}
    button.primary{background:linear-gradient(135deg,#0f766e,#2563eb);border-color:#5eead4}
    button.capture{background:linear-gradient(135deg,#16a34a,#2563eb);border-color:#86efac}
    button:disabled{opacity:.42;filter:saturate(.65);cursor:not-allowed}
    .manual{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
    input{min-width:0;border:1px solid rgba(147,197,253,.22);background:#07111f;color:#eef5ff;border-radius:15px;padding:0 12px;font-size:15px;font-weight:780}
    .hidden{display:none}
  </style>
</head>
<body>
  <header class="top">
    <div class="title">Scanner mobile</div>
    <div class="meta" id="meta">Token in lettura...</div>
  </header>
  <main class="stage">
    <div id="reader"></div>
    <div class="frame"></div>
    <div class="hint" id="hint">Inquadra un QR o barcode. Quando lo vede, premi Acquisisci.</div>
  </main>
  <footer class="result">
    <div class="status wait" id="status">
      <div class="status-title" id="statusTitle">Pronto</div>
      <div class="status-msg" id="statusMsg">Avvio fotocamera in corso...</div>
    </div>
    <div class="controls">
      <button class="primary" type="button" onclick="startScanner()">Avvia</button>
      <button class="capture" id="captureBtn" type="button" onclick="captureOnce()">Acquisisci</button>
      <button type="button" onclick="stopScanner()">Stop</button>
    </div>
    <div class="manual">
      <input id="manualPayload" autocomplete="off" placeholder="Payload manuale">
      <button type="button" onclick="sendManual()">Invia</button>
    </div>
  </footer>
<script>
const token=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');
const meta=document.getElementById('meta');
const statusBox=document.getElementById('status');
const statusTitle=document.getElementById('statusTitle');
const statusMsg=document.getElementById('statusMsg');
const hint=document.getElementById('hint');
const captureBtn=document.getElementById('captureBtn');
const manualPayload=document.getElementById('manualPayload');
let scanner=null;
let running=false;
let lastPayload='';
let lastAt=0;
let armed=false;
let sending=false;
meta.textContent=token?`Scanner token: ${token}`:'Token mancante';

function setStatus(type,title,msg){
  statusBox.className=`status ${type}`;
  statusTitle.textContent=title;
  statusMsg.textContent=msg||'';
}
function setArmed(value){
  armed=!!value;
  captureBtn.disabled=armed||sending;
  hint.classList.toggle('armed',armed);
  hint.textContent=armed
    ? 'Acquisizione attiva: inquadra UN solo codice.'
    : 'Inquadra il codice e premi Acquisisci solo quando vuoi leggerlo.';
}
function buzz(ok){
  if(!navigator.vibrate)return;
  navigator.vibrate(ok?[45]:[90,45,90]);
}
async function handleDetectedScan(payload){
  if(!armed||sending)return;
  const clean=String(payload||'').trim();
  if(!clean)return;
  setArmed(false);
  await postScan(clean);
}
async function postScan(payload){
  const clean=String(payload||'').trim();
  if(!clean)return;
  const now=Date.now();
  if(clean===lastPayload && now-lastAt<1800)return;
  lastPayload=clean; lastAt=now;
  sending=true;
  captureBtn.disabled=true;
  setStatus('wait','Invio scan',clean);
  try{
    await stopScanner(true);
    const r=await fetch(`/api/v1/scanner/netum/${encodeURIComponent(token)}/scan`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:`MOBILE-${now}`,msg:clean})
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok || data.ok===false)throw new Error(data.detail||data.msg||`Errore ${r.status}`);
    setStatus('ok','Acquisito',data.msg||clean);
    buzz(true);
  }catch(err){
    setStatus('err','Errore scan',err.message||String(err));
    buzz(false);
  }finally{
    sending=false;
    captureBtn.disabled=false;
    setArmed(false);
  }
}
async function startScanner(){
  if(!token){setStatus('err','Token mancante','Apri la pagina con /mobile-scan/TOKEN.');return}
  if(!window.Html5Qrcode){setStatus('err','Libreria scanner non caricata','Controlla connessione internet e HTTPS. Puoi usare input manuale.');return}
  if(running)return;
  try{
    scanner=scanner||new Html5Qrcode('reader',{verbose:false});
    await scanner.start(
      {facingMode:'environment'},
      {fps:8,qrbox:(w,h)=>{const size=Math.floor(Math.min(w,h)*0.72);return{width:size,height:size}},aspectRatio:1},
      text=>handleDetectedScan(text),
      ()=>{}
    );
    running=true;
    setArmed(false);
    setStatus('wait','Camera attiva','Premi Acquisisci quando vuoi leggere il codice.');
  }catch(err){
    setStatus('err','Camera non disponibile',err.message||String(err));
  }
}
async function stopScanner(silent=false){
  if(!scanner||!running)return;
  try{
    setArmed(false);
    await scanner.stop();
    running=false;
    if(!silent)setStatus('wait','Scanner fermo','Premi Avvia o Acquisisci per ripartire.');
  }catch(err){
    if(!silent)setStatus('err','Stop non riuscito',err.message||String(err))
  }
}
async function captureOnce(){
  if(sending)return;
  if(!running)await startScanner();
  if(!running)return;
  setArmed(true);
  setStatus('wait','Acquisizione attiva','Inquadra un solo codice. Dopo la lettura si ferma da solo.');
}
function sendManual(){
  const value=manualPayload.value.trim();
  manualPayload.value='';
  setArmed(false);
  postScan(value);
}
window.addEventListener('pagehide',()=>{stopScanner().catch(()=>{})});
startScanner();
</script>
</body>
</html>
