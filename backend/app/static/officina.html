<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>F2 · Officina</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f172a;--surf:#1e293b;--surf2:#263347;
  --border:rgba(255,255,255,.08);--text:rgba(255,255,255,.9);--muted:rgba(255,255,255,.38);
  --green:#22c55e;--blue:#3b82f6;--amber:#f59e0b;--red:#ef4444;--purple:#a855f7;
  --r:14px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overscroll-behavior:none}
.screen{display:none;flex-direction:column;height:100dvh}
.screen.active{display:flex}

/* topbar */
.top{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--surf);border-bottom:1px solid var(--border);flex-shrink:0}
.top-back{background:none;border:none;color:var(--blue);font-size:24px;cursor:pointer;padding:2px 6px;border-radius:8px;line-height:1;-webkit-tap-highlight-color:transparent}
.top-info{flex:1;min-width:0}
.top-title{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-sub{font-size:11px;color:var(--muted);margin-top:1px}
.top-user{font-size:12px;color:var(--muted);white-space:nowrap}

/* scroll body */
.body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}

/* card list */
.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:16px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .12s,transform .12s}
.card:active{opacity:.7;transform:scale(.98)}
.card-title{font-size:18px;font-weight:800}
.card-sub{font-size:13px;color:var(--muted);margin-top:4px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px;margin-top:8px}
.badge-green{background:rgba(34,197,94,.15);color:var(--green)}
.badge-blue {background:rgba(59,130,246,.15);color:var(--blue)}
.badge-amber{background:rgba(245,158,11,.15);color:var(--amber)}

/* ── Postazioni ── */
.pst-group-label{
  font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;
  color:var(--muted);padding:18px 4px 8px;
}
.pst-card{
  display:flex;align-items:center;gap:16px;
  background:var(--surf);border:1px solid var(--border);border-radius:16px;
  padding:18px 16px;min-height:76px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background .12s,transform .1s;
  position:relative;overflow:hidden;
}
.pst-card:active{background:var(--surf2);transform:scale(.98)}
.pst-icon-wrap{
  width:50px;height:50px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;flex-shrink:0;
}
.pst-name{font-size:18px;font-weight:800;line-height:1.2}
.pst-meta{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.pst-badge{
  font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;
  background:rgba(255,255,255,.08);color:rgba(255,255,255,.55);
}
.pst-badge.has-work{background:rgba(59,130,246,.18);color:#93c5fd}
.pst-dot-corso{
  width:9px;height:9px;border-radius:50%;background:var(--amber);flex-shrink:0;
  box-shadow:0 0 0 3px rgba(245,158,11,.25);animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(245,158,11,.25)}50%{box-shadow:0 0 0 6px rgba(245,158,11,.1)}}
.pst-in-corso-label{font-size:11px;font-weight:700;color:var(--amber)}
.pst-arrow{margin-left:auto;color:rgba(255,255,255,.18);font-size:18px;flex-shrink:0}

/* group header — lasciato per compatibilità */
.group-hdr{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:8px 4px 6px}

/* stato dots */
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot-attesa{background:rgba(255,255,255,.2)}
.dot-corso{background:var(--amber);box-shadow:0 0 0 3px rgba(245,158,11,.25)}
.dot-fatto{background:var(--green)}

/* pezzo card */
.pz-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:opacity .25s}
.pz-card.completato{opacity:.45}
.pz-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pz-head:active{background:rgba(255,255,255,.04)}
.pz-info{flex:1;min-width:0}
.pz-part{font-size:18px;font-weight:900;font-family:monospace}
.pz-desc{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pz-stato{font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px;margin-top:5px}
.stato-attesa{color:var(--muted)}
.stato-corso{color:var(--amber)}
.stato-fatto{color:var(--green)}

/* scan button */
.pz-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.btn-scan{
  width:100%;padding:18px;border-radius:12px;border:none;
  font-size:16px;font-weight:800;letter-spacing:.03em;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
  -webkit-tap-highlight-color:transparent;transition:opacity .15s,transform .1s
}
.btn-scan:active{opacity:.8;transform:scale(.98)}
.btn-scan.scan-idle{background:var(--green);color:#fff}
.btn-scan.scan-corso{background:var(--amber);color:#fff}
.btn-scan.scan-fatto{background:rgba(34,197,94,.15);color:var(--green);cursor:not-allowed}
.ts{font-size:11px;color:var(--muted);text-align:center}

/* camera overlay */
.cam-ov{position:fixed;inset:0;background:#000;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center}
.cam-ov.open{display:flex}
.cam-wrap{position:relative;width:100%;max-width:480px;aspect-ratio:1}
#cam-video{width:100%;height:100%;object-fit:cover}
#cam-canvas{display:none}
.cam-frame{position:absolute;inset:12%;border:3px solid var(--green);border-radius:12px;box-shadow:0 0 0 4000px rgba(0,0,0,.6)}
.cam-line{position:absolute;left:0;right:0;height:2px;background:var(--green);animation:scan 1.8s ease-in-out infinite}
@keyframes scan{0%,100%{top:0}50%{top:calc(100% - 2px)}}
.cam-status{color:#fff;margin-top:20px;font-size:15px;font-weight:600;text-align:center;padding:0 24px}
.cam-close{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:22px;width:46px;height:46px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}

/* toast */
.toast-wrap{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:300;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px}
.toast{padding:14px 22px;border-radius:14px;font-size:15px;font-weight:700;text-align:center;max-width:calc(100vw - 32px);box-shadow:0 8px 32px rgba(0,0,0,.4);animation:tin .25s ease;white-space:nowrap}
.toast.ok{background:var(--green);color:#fff}
.toast.err{background:var(--red);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(16px)}}

/* misc */
.empty{text-align:center;padding:60px 24px;color:var(--muted);font-size:15px}
.spin-wrap{display:flex;justify-content:center;padding:60px}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.login-wall{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px;text-align:center}
.btn-primary{background:var(--blue);color:#fff;border:none;border-radius:12px;padding:14px 32px;font-size:16px;font-weight:700;cursor:pointer;width:100%}
</style>
</head>
<body>

<!-- auth wall -->
<div class="screen active" id="s-auth">
  <div class="login-wall">
    <div style="font-size:52px">🔩</div>
    <div style="font-size:26px;font-weight:900">F2 · Officina</div>
    <p style="color:var(--muted)">Accedi per continuare.</p>
    <button class="btn-primary" onclick="location.href='/login'">Vai al login</button>
  </div>
</div>

<!-- s1: commesse -->
<div class="screen" id="s1">
  <div class="top">
    <div class="top-info">
      <div class="top-title">🔩 F2 · Officina</div>
      <div class="top-sub">Seleziona commessa</div>
    </div>
    <span class="top-user" id="lbl-user"></span>
  </div>
  <div class="body" id="list-commesse"><div class="spin-wrap"><div class="spin"></div></div></div>
</div>

<!-- s2: postazioni -->
<div class="screen" id="s2">
  <div class="top">
    <button class="top-back" onclick="goTo('s1')">←</button>
    <div class="top-info">
      <div class="top-title" id="lbl-commessa">—</div>
      <div class="top-sub">Seleziona postazione</div>
    </div>
  </div>
  <div class="body" id="list-postazioni"><div class="spin-wrap"><div class="spin"></div></div></div>
</div>

<!-- s3: pezzi -->
<div class="screen" id="s3">
  <div class="top">
    <button class="top-back" onclick="goTo('s2')">←</button>
    <div class="top-info">
      <div class="top-title" id="lbl-postazione">—</div>
      <div class="top-sub" id="lbl-postazione-sub">—</div>
    </div>
    <button onclick="loadPezzi()" style="background:none;border:none;color:var(--blue);font-size:18px;cursor:pointer;padding:4px">↻</button>
  </div>
  <div class="body" id="list-pezzi"><div class="spin-wrap"><div class="spin"></div></div></div>
</div>

<!-- camera -->
<div class="cam-ov" id="cam-ov">
  <button class="cam-close" onclick="camClose()">✕</button>
  <div class="cam-wrap">
    <video id="cam-video" autoplay playsinline muted></video>
    <canvas id="cam-canvas"></canvas>
    <div class="cam-frame"><div class="cam-line"></div></div>
  </div>
  <div class="cam-status" id="cam-status">Inquadra il QR code del pezzo</div>
</div>

<!-- toasts -->
<div class="toast-wrap" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
'use strict';

/* ── Auth ──────────────────────────────────────────────────────────────────── */
const TOKEN = sessionStorage.getItem('stqc_token');
const NOME  = sessionStorage.getItem('stqc_nome') || sessionStorage.getItem('stqc_profilo') || 'Utente';
function auth(){ return {'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'} }

if (!TOKEN) { /* s-auth già attivo */ }
else {
  document.getElementById('lbl-user').textContent = NOME;
  loadCommesse();
  goTo('s1');
}

/* ── State ─────────────────────────────────────────────────────────────────── */
let _commessa   = null;  // {id, codice}
let _postazione = null;  // string
let _camStream  = null;
let _rafId      = null;
let _scanTarget = null;  // {uuid, part_number, description} del pezzo corrente

/* ── Navigation ────────────────────────────────────────────────────────────── */
function goTo(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ── Toast ─────────────────────────────────────────────────────────────────── */
function toast(msg, type='ok', ms=3200){
  const wrap = document.getElementById('toasts');
  const el   = document.createElement('div');
  el.className = 'toast '+type;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), ms);
}

/* ── S1: Commesse ──────────────────────────────────────────────────────────── */
async function loadCommesse(){
  const el = document.getElementById('list-commesse');
  try {
    const r = await fetch('/api/v1/officina/commesse',{headers:auth()});
    const data = await r.json();
    if(!data.length){ el.innerHTML='<div class="empty">Nessuna commessa in produzione.</div>'; return; }
    el.innerHTML = data.map(c=>`
      <div class="card" onclick="selCommessa(${c.id},'${esc(c.codice)}','${esc(c.cliente||'')}')">
        <div class="card-title">${esc(c.codice)}</div>
        <div class="card-sub">${esc(c.cliente||'—')}</div>
        <span class="badge badge-green">● In produzione</span>
      </div>`).join('');
  } catch(e){ el.innerHTML='<div class="empty">Errore caricamento.</div>'; }
}

async function selCommessa(id, codice, cliente){
  _commessa = {id, codice, cliente};
  document.getElementById('lbl-commessa').textContent = codice;
  goTo('s2');
  await loadPostazioni(id);
}

/* ── Icone postazioni ──────────────────────────────────────────────────────── */
const PST_ICON = {
  'Taglio Laser':                    { emoji:'⚡', bg:'rgba(250,204,21,.15)',  color:'#fde047' },
  'Taglio Standard':                 { emoji:'🔪', bg:'rgba(248,113,113,.15)', color:'#fca5a5' },
  'Forature':                        { emoji:'🔩', bg:'rgba(96,165,250,.15)',  color:'#93c5fd' },
  'Puntature':                       { emoji:'📌', bg:'rgba(167,139,250,.15)', color:'#c4b5fd' },
  'Saldature Finali / Assemblaggio': { emoji:'🔥', bg:'rgba(251,146,60,.15)',  color:'#fdba74' },
  'Verniciatura':                    { emoji:'🎨', bg:'rgba(52,211,153,.15)',  color:'#6ee7b7' },
  'Zincatura':                       { emoji:'🛡️', bg:'rgba(148,163,184,.15)', color:'#cbd5e1' },
  'Consegna cantiere':               { emoji:'🚚', bg:'rgba(34,211,238,.15)',  color:'#67e8f9' },
};
const PST_DEFAULT = { emoji:'🔧', bg:'rgba(255,255,255,.08)', color:'rgba(255,255,255,.6)' };

/* ── S2: Postazioni ────────────────────────────────────────────────────────── */
async function loadPostazioni(cid){
  const el = document.getElementById('list-postazioni');
  el.innerHTML = '<div class="spin-wrap"><div class="spin"></div></div>';
  try {
    const r = await fetch(`/api/v1/officina/${cid}/postazioni`,{headers:auth()});
    const gruppi = await r.json();
    if(!gruppi.length){ el.innerHTML='<div class="empty">Nessuna postazione disponibile.</div>'; return; }

    el.innerHTML = gruppi.map(g=>`
      <div class="pst-group-label">${esc(g.gruppo)}</div>
      ${g.postazioni.map(p=>{
        const ic = PST_ICON[p.nome] || PST_DEFAULT;
        const totAttesa = p.attesa + p.in_corso + p.completati;

        const badgeLbl  = p.attesa > 0
          ? `${p.attesa} in attesa`
          : totAttesa > 0
            ? `${p.completati}/${totAttesa} completati`
            : 'Nessun pezzo';
        const badgeCls  = p.attesa > 0 ? 'pst-badge has-work' : 'pst-badge';

        const corsoHtml = p.in_corso > 0
          ? `<span class="pst-dot-corso"></span><span class="pst-in-corso-label">${p.in_corso} in corso</span>`
          : '';

        return `
        <div class="pst-card" onclick="selPostazione('${esc(p.nome)}')">
          <div class="pst-icon-wrap" style="background:${ic.bg}">
            <span>${ic.emoji}</span>
          </div>
          <div style="flex:1;min-width:0">
            <div class="pst-name">${esc(p.nome)}</div>
            <div class="pst-meta">
              <span class="${badgeCls}">${badgeLbl}</span>
              ${corsoHtml}
            </div>
          </div>
          <div class="pst-arrow">›</div>
        </div>`;
      }).join('')}`).join('');
  } catch(e){ el.innerHTML='<div class="empty">Errore caricamento.</div>'; }
}

function selPostazione(nome){
  _postazione = nome;
  const ic = PST_ICON[nome] || PST_DEFAULT;
  document.getElementById('lbl-postazione').textContent = ic.emoji + ' ' + nome;
  document.getElementById('lbl-postazione-sub').textContent = _commessa.codice;
  goTo('s3');
  loadPezzi();
}

/* ── S3: Pezzi ─────────────────────────────────────────────────────────────── */
async function loadPezzi(){
  const el = document.getElementById('list-pezzi');
  el.innerHTML = '<div class="spin-wrap"><div class="spin"></div></div>';
  try {
    const pst = encodeURIComponent(_postazione);
    const r   = await fetch(`/api/v1/officina/${_commessa.id}/postazioni/${pst}/pezzi`,{headers:auth()});
    const pezzi = await r.json();
    if(!pezzi.length){ el.innerHTML='<div class="empty">Nessun pezzo assegnato a questa postazione.</div>'; return; }
    el.innerHTML = pezzi.map(p=>pezzoCard(p)).join('');
  } catch(e){ el.innerHTML='<div class="empty">Errore caricamento pezzi.</div>'; }
}

function pezzoCard(p){
  const { stato, dotCls, statoCls, statoLabel, btnCls, btnLabel, collapsed } = statoConfig(p.stato);
  const ts = p.timestamp ? `<div class="ts">${fmtTs(p.timestamp)}</div>` : '';
  const body = collapsed ? '' : `
    <div class="pz-body">
      <button class="btn-scan ${btnCls}" onclick="startScan('${p.uuid}','${esc(p.part_number||'')}','${esc(p.description||'')}')">
        📷 ${btnLabel}
      </button>
      ${ts}
    </div>`;
  return `
    <div class="pz-card ${collapsed?'completato':''}" id="pz-${p.uuid}">
      <div class="pz-head" onclick="togglePezzo('${p.uuid}')">
        <div class="dot ${dotCls}"></div>
        <div class="pz-info">
          <div class="pz-part">${esc(p.part_number||'—')}</div>
          <div class="pz-desc">${esc(p.description||'—')}${p.length_mm?' · '+p.length_mm+'mm':''}</div>
          <div class="pz-stato ${statoCls}">${statoLabel}</div>
        </div>
        ${collapsed?'<span style="color:var(--muted);font-size:11px">▸</span>':''}
      </div>
      ${body}
    </div>`;
}

function statoConfig(stato){
  if(stato==='completato') return {stato,dotCls:'dot-fatto',statoCls:'stato-fatto',statoLabel:'✓ Completato',btnCls:'scan-fatto',btnLabel:'Completato',collapsed:true};
  if(stato==='in_corso')   return {stato,dotCls:'dot-corso',statoCls:'stato-corso',statoLabel:'⏱ In corso',btnCls:'scan-corso',btnLabel:'SCAN — Fine lavoro',collapsed:false};
  return {stato,dotCls:'dot-attesa',statoCls:'stato-attesa',statoLabel:'In attesa',btnCls:'scan-idle',btnLabel:'SCAN — Inizia',collapsed:false};
}

function togglePezzo(uuid){
  // I pezzi completati si riaprono al tap
  const card = document.getElementById('pz-'+uuid);
  if(!card) return;
  card.classList.toggle('completato');
}

function fmtTs(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

/* ── Camera ────────────────────────────────────────────────────────────────── */
function startScan(uuid, part, desc){
  _scanTarget = {uuid, part, desc};
  camOpen();
}

async function camOpen(){
  document.getElementById('cam-ov').classList.add('open');
  document.getElementById('cam-status').textContent = 'Avvio fotocamera…';
  try {
    _camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}});
    const vid = document.getElementById('cam-video');
    vid.srcObject = _camStream;
    await vid.play();
    document.getElementById('cam-status').textContent = 'Inquadra il QR del pezzo';
    _rafId = requestAnimationFrame(camFrame);
  } catch(e){
    document.getElementById('cam-status').textContent = '⚠ Fotocamera non disponibile';
  }
}

function camFrame(){
  const vid = document.getElementById('cam-video');
  const cvs = document.getElementById('cam-canvas');
  if(vid.readyState !== vid.HAVE_ENOUGH_DATA){ _rafId=requestAnimationFrame(camFrame); return; }
  cvs.width=vid.videoWidth; cvs.height=vid.videoHeight;
  const ctx = cvs.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(vid,0,0);
  const img  = ctx.getImageData(0,0,cvs.width,cvs.height);
  const code = jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
  if(code){ camClose(); handleQR(code.data); return; }
  _rafId = requestAnimationFrame(camFrame);
}

function camClose(){
  cancelAnimationFrame(_rafId);
  if(_camStream){ _camStream.getTracks().forEach(t=>t.stop()); _camStream=null; }
  document.getElementById('cam-ov').classList.remove('open');
}

/* ── Handle QR result ──────────────────────────────────────────────────────── */
async function handleQR(payload){
  try {
    const r = await fetch('/api/v1/officina/scan',{
      method:'POST', headers:auth(),
      body: JSON.stringify({uuid:payload, postazione:_postazione}),
    });
    if(r.status===409){
      const d = await r.json().catch(()=>({}));
      toast(d.detail||'Già completato','err'); return;
    }
    if(!r.ok){
      const d = await r.json().catch(()=>({}));
      toast(d.detail||'Errore scan','err'); return;
    }
    const data = await r.json();
    toast(`${data.messaggio} — ${data.part_number||data.description||'pezzo'}`, 'ok');
    // Aggiorna il pezzo nella UI senza ricaricare tutto
    updatePezzoUI(data);
  } catch(e){ toast('Errore di rete','err'); }
}

function updatePezzoUI(data){
  const card = document.getElementById('pz-'+data.uuid);
  if(!card){ loadPezzi(); return; }
  const nuovoStato = data.completato ? 'completato' : 'in_corso';
  const p = {
    uuid:       data.uuid,
    part_number:data.part_number,
    description:data.description,
    length_mm:  null,
    stato:      nuovoStato,
    timestamp:  data.timestamp,
  };
  card.outerHTML = pezzoCard(p);
}

/* ── Utility ────────────────────────────────────────────────────────────────── */
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
</script>
